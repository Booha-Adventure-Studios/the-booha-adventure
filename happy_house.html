<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000; overflow: hidden;
    font-family: 'Georgia', serif;
  }

  #hh-app {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #000;
  }

  /* ── Stage: letterboxed 16:9 ── */
  #hh-stage {
    position: relative;
    width: min(100vw, calc(100vh * 16 / 9));
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: #000;
  }

  /* ── Scene images ── */
  .hh-scene {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center center;
    display: block;
    pointer-events: none;
    user-select: none;
    opacity: 0;
    z-index: 1;
    transform: scale(1.0);
    transition: opacity 1.1s ease-in-out, transform 1.4s ease-in-out;
  }
  .hh-scene.visible {
    opacity: 1;
    z-index: 2;
    transform: scale(1.0);
  }
  .hh-scene.zooming-out {
    opacity: 0;
    transform: scale(1.07);
    z-index: 2;
    transition: opacity 1.1s ease-in-out, transform 1.4s ease-in-out;
  }
  .hh-scene.zooming-in {
    opacity: 1;
    transform: scale(1.0);
    z-index: 3;
    transition: opacity 1.1s ease-in-out, transform 1.4s ease-in-out;
  }

  /* ── Fade overlay ── */
  #hh-fade {
    position: absolute;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    z-index: 20;
    transition: opacity 0.6s ease-in-out;
  }

  /* ── Hotspots ── */
  .hh-hotspot {
    position: absolute;
    border-radius: 50%;
    cursor: pointer;
    transform: translate(-50%, -50%);
    z-index: 10;
    pointer-events: auto;
    background: transparent;
  }

  .hh-hotspot.forward {
    width: 12%;
    aspect-ratio: 1;
    background: radial-gradient(circle, rgba(255,230,120,0.18) 0%, rgba(255,190,40,0.08) 45%, transparent 70%);
    box-shadow:
      0 0 22px 8px rgba(255, 210, 80, 0.22),
      0 0 55px 18px rgba(255, 160, 20, 0.12),
      0 0 100px 30px rgba(200, 120, 0, 0.07);
    animation: hh-pulse-forward 2.8s ease-in-out infinite;
  }

  #hh-back-btn {
    position: absolute;
    top: 4%;
    left: 3%;
    z-index: 15;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border: 1px solid rgba(255, 220, 140, 0.30);
    border-radius: 20px;
    background: rgba(0, 0, 0, 0.45);
    color: rgba(255, 220, 140, 0.65);
    font-family: 'Georgia', serif;
    font-size: clamp(0.65rem, 1.8vw, 0.82rem);
    letter-spacing: 0.1em;
    user-select: none;
  }
  #hh-back-btn.visible {
    opacity: 1;
    pointer-events: auto;
  }
  #hh-back-btn:hover {
    background: rgba(0, 0, 0, 0.65);
    color: rgba(255, 220, 140, 0.90);
    border-color: rgba(255, 220, 140, 0.55);
  }

  .hh-hotspot.branch-left {
    width: 11%;
    aspect-ratio: 1;
    background: radial-gradient(circle, rgba(200,140,255,0.16) 0%, rgba(160,80,220,0.07) 45%, transparent 70%);
    box-shadow:
      0 0 22px 8px rgba(180, 80, 255, 0.20),
      0 0 55px 18px rgba(140, 40, 220, 0.10),
      0 0 100px 30px rgba(100, 0, 180, 0.06);
    animation: hh-pulse-branch 2.6s ease-in-out infinite;
  }
  .hh-hotspot.branch-right {
    width: 11%;
    aspect-ratio: 1;
    background: radial-gradient(circle, rgba(100,200,255,0.16) 0%, rgba(40,150,220,0.07) 45%, transparent 70%);
    box-shadow:
      0 0 22px 8px rgba(50, 180, 255, 0.20),
      0 0 55px 18px rgba(30, 130, 220, 0.10),
      0 0 100px 30px rgba(0, 80, 160, 0.06);
    animation: hh-pulse-branch 2.6s ease-in-out infinite 0.4s;
  }

  /* ── Game room PNG overlays ── */
  .hh-obj {
    position: absolute;
    transform: translate(-50%, -50%);
    z-index: 10;
    pointer-events: auto;
    cursor: pointer;
    user-select: none;
    display: block;
  }
  .hh-obj.trophy {
    /* 🔧 tune width here */
    width: 8%;
    filter:
      drop-shadow(0 0 6px rgba(255, 200, 60, 0.55))
      drop-shadow(0 0 18px rgba(255, 170, 20, 0.30));
    animation: hh-glow-gold 2.8s ease-in-out infinite;
  }
  .hh-obj.liar-machine {
    /* 🔧 tune width here */
    width: 12%;
    filter:
      drop-shadow(0 0 6px rgba(80, 200, 255, 0.55))
      drop-shadow(0 0 18px rgba(40, 150, 255, 0.28));
    animation: hh-glow-blue 2.8s ease-in-out infinite;
  }
  .hh-obj.mister-happy {
    /* 🔧 tune width here */
    width: 11%;
    pointer-events: none;
    cursor: default;
    opacity: 1;
    transition: opacity 3.0s ease-out;
  }
  .hh-obj.mister-happy.faded {
    opacity: 0;
  }
  @keyframes hh-glow-gold {
    0%, 100% {
      filter:
        drop-shadow(0 0 5px rgba(255, 200, 60, 0.45))
        drop-shadow(0 0 14px rgba(255, 170, 20, 0.22));
    }
    50% {
      filter:
        drop-shadow(0 0 9px rgba(255, 210, 80, 0.70))
        drop-shadow(0 0 24px rgba(255, 180, 30, 0.38));
    }
  }
  @keyframes hh-glow-blue {
    0%, 100% {
      filter:
        drop-shadow(0 0 5px rgba(80, 200, 255, 0.45))
        drop-shadow(0 0 14px rgba(40, 150, 255, 0.22));
    }
    50% {
      filter:
        drop-shadow(0 0 9px rgba(100, 220, 255, 0.70))
        drop-shadow(0 0 24px rgba(60, 170, 255, 0.38));
    }
  }

  /* ── Rotate prompt ── */
  #hh-rotate {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #000;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    text-align: center;
    padding: 32px;
  }
  @media screen and (orientation: portrait) and (max-width: 1023px) {
    #hh-rotate { display: flex !important; }
  }
  .hh-rotate-phone {
    font-size: 64px;
    animation: hh-rotatehint 2.4s ease-in-out infinite;
    transform-origin: center;
  }
  .hh-rotate-bar {
    width: 120px; height: 3px; border-radius: 999px;
    background: linear-gradient(90deg, #ffd966, #ffaa00, #ffd966);
    background-size: 200%;
    animation: hh-barshimmer 2s linear infinite;
    box-shadow: 0 0 14px rgba(255, 180, 0, 0.5);
  }
  .hh-rotate-title {
    font-size: clamp(18px, 5vw, 28px);
    font-weight: 900; letter-spacing: 1px; color: #fff; margin: 0;
    text-shadow: 0 0 28px rgba(255, 200, 80, 0.7);
  }
  .hh-rotate-sub { font-size: 14px; color: rgba(255,255,255,.55); margin: 0; line-height: 1.7; }

  @keyframes hh-pulse-forward {
    0%, 100% { opacity: 0.7; }
    50%       { opacity: 1.0; }
  }
  @keyframes hh-pulse-branch {
    0%, 100% { opacity: 0.6; }
    50%       { opacity: 1.0; }
  }
  @keyframes hh-rotatehint  { 0%,100%{transform:rotate(0deg);}40%,60%{transform:rotate(-90deg);} }
  @keyframes hh-barshimmer  { 0%{background-position:0%}100%{background-position:200%} }

  /* ══ DEV TOOLS ══════════════════════════════════════════ */
  #hh-dev-coords {
    display: none;
    position: absolute;
    top: 6px; right: 8px;
    z-index: 900;
    background: rgba(0,0,0,0.75);
    color: #0f0;
    font-family: monospace;
    font-size: 12px;
    padding: 4px 8px;
    border: 1px solid #0f0;
    pointer-events: none;
    letter-spacing: 1px;
  }
  #hh-dev-panel {
    display: none;
    position: absolute;
    bottom: 8px; left: 8px;
    z-index: 900;
    background: rgba(0,0,0,0.85);
    color: #ff0;
    font-family: monospace;
    font-size: 11px;
    padding: 10px 12px;
    border: 1px solid #ff0;
    min-width: 220px;
    line-height: 1.8;
  }
  #hh-dev-panel button {
    display: block;
    margin-top: 6px;
    font-family: monospace;
    font-size: 11px;
    background: #222;
    color: #ff0;
    border: 1px solid #ff0;
    padding: 3px 8px;
    cursor: pointer;
    width: 100%;
    text-align: left;
  }
  #hh-dev-panel button:hover { background: #333; }
  #hh-dev-click-marker {
    display: none;
    position: absolute;
    width: 12px; height: 12px;
    border: 2px solid #f0f;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 901;
  }
  /* ══ END DEV TOOLS ══════════════════════════════════════ */
</style>
</head>

<script>
(() => {

  /* ══ DEV MODE ══════════════════════════════════════════ */
  const DEV_MODE = false; // 🔧 toggle

  const devCoordsEl  = document.getElementById('hh-dev-coords');
  const devPanelEl   = document.getElementById('hh-dev-panel');
  const devMarkerEl  = document.getElementById('hh-dev-click-marker');
  const devSceneLbl  = document.getElementById('hh-dev-scene-label');
  const devClickLbl  = document.getElementById('hh-dev-last-click');
  let   devLastClick = null;

  function devShow() {
    devCoordsEl.style.display = 'block';
    devPanelEl.style.display  = 'block';
    devMarkerEl.style.display = 'block';
  }
  function devHide() {
    devCoordsEl.style.display = 'none';
    devPanelEl.style.display  = 'none';
    devMarkerEl.style.display = 'none';
  }

  if (DEV_MODE) devShow();

  // Expose console trigger: b_4800()
  Object.defineProperty(window, 'b_4800', {
    enumerable: false,
    get() {
      return () => {
        const on = devPanelEl.style.display === 'block';
        on ? devHide() : devShow();
        console.log('[HH DEV] panel ' + (on ? 'OFF' : 'ON'));
      };
    }
  });

  // Mouse move: show x/y as % of stage
  const stage = document.getElementById('hh-stage');
  stage.addEventListener('mousemove', (e) => {
    if (devPanelEl.style.display !== 'block') return;
    const r = stage.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width  * 100).toFixed(1);
    const y = ((e.clientY - r.top)  / r.height * 100).toFixed(1);
    devCoordsEl.textContent = 'x: ' + x + '%  y: ' + y + '%';
  });

  // Click: drop marker and record coords
  stage.addEventListener('click', (e) => {
    if (devPanelEl.style.display !== 'block') return;
    const r = stage.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width  * 100).toFixed(1);
    const y = ((e.clientY - r.top)  / r.height * 100).toFixed(1);
    devLastClick = { x, y };
    devClickLbl.textContent = 'last click: x:' + x + ' y:' + y;
    devMarkerEl.style.left = x + '%';
    devMarkerEl.style.top  = y + '%';
  }, true); // capture so it fires even when hotspot swallows the click

  function hhDevCopyLast() {
    if (!devLastClick) { console.log('[HH DEV] no click recorded yet'); return; }
    const txt = 'hotspot: { x: ' + devLastClick.x + ', y: ' + devLastClick.y + ' }';
    navigator.clipboard.writeText(txt).then(
      ()  => console.log('[HH DEV] copied: ' + txt),
      ()  => console.log('[HH DEV] clipboard blocked — coords: ' + txt)
    );
  }
  function hhDevCopyScene() {
    navigator.clipboard.writeText(currentScene).then(
      ()  => console.log('[HH DEV] copied scene: ' + currentScene),
      ()  => console.log('[HH DEV] scene: ' + currentScene)
    );
  }
  function hhDevClearRecords() {
    localStorage.removeItem('booha_liar_machine');
    console.log('[HH DEV] booha_liar_machine cleared');
  }

  // Keep these accessible from panel buttons (outside IIFE scope)
  window.hhDevCopyLast  = hhDevCopyLast;
  window.hhDevCopyScene = hhDevCopyScene;
  window.hhDevClearRecords = hhDevClearRecords;

  /* ══ END DEV TOOLS ═════════════════════════════════════ */


  /* ── BGM ── */
  const bgm = new Audio('assets/happy_house/happy-house.mp3');
  bgm.loop   = true;
  bgm.volume = 0.65;
  let bgmStarted = false;

  function startBGM() {
    if (bgmStarted) return;
    bgmStarted = true;
    bgm.play().catch(() => {});
  }

  /* ═══════════════════════════════════════════
     CONSTANTS
  ═══════════════════════════════════════════ */
  const TRANSITION_MS     = 1200;
  const COOLDOWN_AFTER_MS = 400;
  const TOTAL_LOCK_MS     = TRANSITION_MS + COOLDOWN_AFTER_MS;

  /* ═══════════════════════════════════════════
     SCENE GRAPH
  ═══════════════════════════════════════════ */
  const SCENES = {
    'entry': {
      forward: { to: 'mid-hall', hotspot: { x: 50, y: 52 } },
      back: null,
    },
    'mid-hall': {
      forward: { to: 'end-of-hall', hotspot: { x: 50, y: 50 } },
      back: 'entry',
      misterHappy: {
        src: 'assets/happy_house/mister_happy-1.png',
        hotspot: { x: 40.8, y: 49.3 }
      },
    },
    'end-of-hall': {
      branches: {
        left:  { to: 'left-branch',  hotspot: { x: 24, y: 54 } },
        right: { to: 'right-branch', hotspot: { x: 74, y: 52 } },
      },
      back: 'mid-hall',
    },
    'left-branch': {
      back: 'end-of-hall',
    },
    'right-branch': {
      forward: { to: 'game-room', hotspot: { x: 50, y: 50 } },
      back: 'end-of-hall',
    },
      'game-room': {
      trophy:      { hotspot: { x: 26.0, y: 64.6 } },
      liarMachine: { hotspot: { x: 62.2, y: 49.1 } },
      snapTest:    { hotspot: { x: 72.5, y: 54.4 } },
      misterHappy: {
        src: 'assets/happy_house/mister_happy-2.png',
        hotspot: { x: 49.7, y: 49.3 }
      },
      back: 'right-branch',
    },
  };

  /* ═══════════════════════════════════════════
     STATE
  ═══════════════════════════════════════════ */
  let currentScene  = 'entry';
  let transitioning = false;
  let lockUntil     = 0;

  /* ═══════════════════════════════════════════
     DOM REFS
  ═══════════════════════════════════════════ */
  const fadeEl       = document.getElementById('hh-fade');
  const backBtn      = document.getElementById('hh-back-btn');
  const hotspotLayer = document.getElementById('hh-hotspot-layer');

  function getSceneEl(sceneId) {
    return document.getElementById('scene-' + sceneId);
  }

  /* ═══════════════════════════════════════════
     HOTSPOT BUILDER
  ═══════════════════════════════════════════ */
  let _mhFadeTimer = null;

  function clearHotspots() {
    if (_mhFadeTimer) { clearTimeout(_mhFadeTimer); _mhFadeTimer = null; }
    hotspotLayer.innerHTML = '';
  }

  function makeHotspot(cssClass, xPct, yPct, onClick) {
    const el = document.createElement('div');
    el.className  = 'hh-hotspot ' + cssClass;
    el.style.left = xPct + '%';
    el.style.top  = yPct + '%';
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      onClick();
    });
    hotspotLayer.appendChild(el);
    return el;
  }

  /* ═══════════════════════════════════════════
     BACK BUTTON
  ═══════════════════════════════════════════ */
  function updateBackBtn(scene) {
    if (scene.back !== undefined) {
      backBtn.classList.add('visible');
    } else {
      backBtn.classList.remove('visible');
    }
  }

  backBtn.addEventListener('click', () => {
    if (performance.now() < lockUntil) return;
    startBGM();
    const scene = SCENES[currentScene];
    if (!scene) return;
    if (scene.back === null) {
      exitToKarasuki();
    } else if (scene.back) {
      navigateTo(scene.back);
    }
  });

  /* ═══════════════════════════════════════════
     NAVIGATION
  ═══════════════════════════════════════════ */
  function navigateTo(targetSceneId) {
    if (performance.now() < lockUntil) return;
    if (transitioning) return;
    if (!SCENES[targetSceneId]) return;

    startBGM();

    transitioning = true;
    lockUntil     = performance.now() + TOTAL_LOCK_MS;

    // Clear hotspots immediately so PNG overlays don't bleed into the crossfade
    clearHotspots();

    const outEl = getSceneEl(currentScene);
    const inEl  = getSceneEl(targetSceneId);

    inEl.style.transition = 'none';
    inEl.classList.remove('visible', 'zooming-in', 'zooming-out');
    inEl.style.opacity   = '0';
    inEl.style.transform = 'scale(1.06)';
    inEl.style.zIndex    = '3';

    void inEl.offsetWidth;

    inEl.style.transition = 'opacity 1.1s ease-in-out, transform 1.4s ease-in-out';

    requestAnimationFrame(() => {
      outEl.style.transition = 'opacity 1.1s ease-in-out, transform 1.4s ease-in-out';
      outEl.style.opacity    = '0';
      outEl.style.transform  = 'scale(1.07)';
      outEl.style.zIndex     = '2';

      inEl.style.opacity   = '1';
      inEl.style.transform = 'scale(1.0)';
    });

    setTimeout(() => {
      outEl.style.transition = 'none';
      outEl.style.opacity    = '0';
      outEl.style.transform  = 'scale(1.0)';
      outEl.style.zIndex     = '1';
      outEl.classList.remove('visible');

      inEl.style.zIndex = '2';
      inEl.classList.add('visible');

      currentScene = targetSceneId;

      buildHotspotsForScene(currentScene);
      updateBackBtn(SCENES[currentScene]);

      // DEV: update scene label
      if (devPanelEl.style.display === 'block') {
        devSceneLbl.textContent = 'scene: ' + currentScene;
      }

      setTimeout(() => { transitioning = false; }, COOLDOWN_AFTER_MS);

    }, TRANSITION_MS);
  }

  function buildHotspotsForScene(sceneId) {
    const scene = SCENES[sceneId];
    if (!scene) return;

    if (scene.forward) {
      makeHotspot('forward', scene.forward.hotspot.x, scene.forward.hotspot.y, () => {
        navigateTo(scene.forward.to);
      });
    }

    if (scene.branches) {
      const bl = scene.branches.left;
      const br = scene.branches.right;
      if (bl) makeHotspot('branch-left',  bl.hotspot.x, bl.hotspot.y, () => navigateTo(bl.to));
      if (br) makeHotspot('branch-right', br.hotspot.x, br.hotspot.y, () => navigateTo(br.to));
    }

    // Game room: trophy PNG
    if (scene.trophy) {
      const img = document.createElement('img');
      img.src       = 'assets/happy_house/happy_trophy.png';
      img.className = 'hh-obj trophy';
      img.style.left = scene.trophy.hotspot.x + '%';
      img.style.top  = scene.trophy.hotspot.y + '%';
      
      img.addEventListener('click', (e) => { e.stopPropagation(); startBGM(); openLiarRecords(); });
      hotspotLayer.appendChild(img);
    }

    // Game room: liar machine PNG
    if (scene.liarMachine) {
      const img = document.createElement('img');
      img.src       = 'assets/happy_house/liar_machine.png';
      img.className = 'hh-obj liar-machine';
      img.style.left = scene.liarMachine.hotspot.x + '%';
      img.style.top  = scene.liarMachine.hotspot.y + '%';
      
     img.addEventListener('click', (e) => {
        e.stopPropagation();
        startBGM();
        try { bgm.pause(); } catch(_) {}
        window.location.href = 'liar_machine.html';
      });
      hotspotLayer.appendChild(img);
    }

    // Game room: snap test PNG
    if (scene.snapTest) {
      const img = document.createElement('img');
      img.src       = 'assets/happy_house/mister_happys_snap_test.png';
      img.className = 'hh-obj liar-machine';
      img.style.left = scene.snapTest.hotspot.x + '%';
      img.style.top  = scene.snapTest.hotspot.y + '%';
      img.addEventListener('click', (e) => {
        e.stopPropagation();
        startBGM();
        try { bgm.pause(); } catch(_) {}
        window.location.href = 'mister_happys_snap_test.html';
      });
      hotspotLayer.appendChild(img);
    }

    // Game room + mid-hall: Mister Happy (non-interactive, fades out after 600ms)
    if (scene.misterHappy) {
      const img = document.createElement('img');
      img.src       = scene.misterHappy.src;
      img.className = 'hh-obj mister-happy';
      img.style.left = scene.misterHappy.hotspot.x + '%';
      img.style.top  = scene.misterHappy.hotspot.y + '%';
      hotspotLayer.appendChild(img);
      _mhFadeTimer = setTimeout(() => { img.classList.add('faded'); _mhFadeTimer = null; }, 600);
    }
  }

  /* ═══════════════════════════════════════════
     EXIT TO KARASUKI
  ═══════════════════════════════════════════ */
  function exitToKarasuki() {
    if (transitioning) return;
    startBGM();
    transitioning = true;
    try { bgm.pause(); bgm.currentTime = 0; } catch (_) {}
    fadeEl.style.transition = 'opacity 0.6s ease-in';
    fadeEl.style.opacity    = '1';
    setTimeout(() => {
      window.location.href = 'karasuki.html';
    }, 700);
  }

  /* ═══════════════════════════════════════════
     INIT
  ═══════════════════════════════════════════ */
  function init() {
    const entryEl = getSceneEl('entry');
    entryEl.style.opacity   = '1';
    entryEl.style.transform = 'scale(1.0)';
    entryEl.style.zIndex    = '2';
    entryEl.classList.add('visible');

    buildHotspotsForScene('entry');
    updateBackBtn(SCENES['entry']);

    stage.addEventListener('click', (e) => {
      if (performance.now() < lockUntil) {
        e.stopPropagation();
        e.preventDefault();
      }
    }, true);
  }

  init();

})();
</script>


<!-- ═══ LIAR MACHINE RECORDS ════════════════════════════ -->
<script>
  
const LIAR_STORE = 'booha_liar_machine';
const SNAP_STORE = 'booha_snap_test_records';

function getP1Name() {
  const directFirst = localStorage.getItem('booha_first_name') ||
                      localStorage.getItem('boohaFirstName') || '';
  const fullName = localStorage.getItem('booha_user_name') ||
                   localStorage.getItem('boohaUserName') ||
                   localStorage.getItem('booha_display_name') || '';
  const raw = (directFirst || fullName.split(' ')[0] || '').trim();
  if (!raw) return 'PLAYER 1';
  return (raw.length > 12 ? raw.slice(0, 12) : raw).toUpperCase();
}

function loadLiarRecords() {
  try {
    const raw = localStorage.getItem(LIAR_STORE);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return {
    totalDuels: 0, p1Wins: 0, p2Wins: 0, draws: 0,
    best: { vocab: null, sentences: null, questions: null },
    recentRuns: []
  };
}

function loadSnapRecords() {
  try {
    const raw = localStorage.getItem(SNAP_STORE);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { runs: [] };
}

function openLiarRecords() {
  const name = getP1Name();
  document.getElementById('records-modal-sub').textContent = name + "'S RECORDS";

  const rec     = loadLiarRecords();
  const total   = rec.totalDuels;
  const p1w     = rec.p1Wins;
  const p2w     = rec.p2Wins;
  const draws   = rec.draws;
  const winRate = total === 0 ? '—' : Math.round(p1w / total * 100) + '%';

  const fmtBest = (b) => b
    ? `<span style="color:#e8c84a">${(b.timeMs/1000).toFixed(1)}s &nbsp;/&nbsp; ${b.accuracy}%</span>`
    : `<span style="color:#2a2a3a;font-size:12px">NO RUNS YET</span>`;

  let liarRecent = '<div style="color:#666680;font-size:11px;padding:8px 0;">No runs yet.</div>';
  if (rec.recentRuns.length > 0) {
    liarRecent = rec.recentRuns.map(r => {
      const wl = r.winner === 'p1'
        ? `<span style="color:#2ecc71">${name} WIN</span>`
        : r.winner === 'p2'
          ? '<span style="color:#e74c3c">LOSS</span>'
          : '<span style="color:#666680">DRAW</span>';
      return `<div style="display:flex;justify-content:space-between;font-size:11px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.04);gap:8px;flex-wrap:wrap;">
        <span style="color:#4ecaff;letter-spacing:1px;min-width:60px">${r.mode.toUpperCase()}</span>
        <span>${name}: ${(r.p1.timeMs/1000).toFixed(1)}s</span>
        <span style="color:#666680">${r.p1.accuracy}%</span>
        ${wl}
        <span style="color:#666680;font-size:10px">${r.date}</span>
      </div>`;
    }).join('');
  }

  const snap = loadSnapRecords();
  let sw = 0, sl = 0, sd = 0;
  snap.runs.forEach(r => {
    if (r.winner === 'p1') sw++;
    else if (r.winner === 'p2') sl++;
    else sd++;
  });
  const snapTotal = snap.runs.length;
  const snapRate  = snapTotal === 0 ? '—' : Math.round(sw / snapTotal * 100) + '%';

  let snapRecent = '<div style="color:#666680;font-size:11px;padding:8px 0;">No games yet.</div>';
  if (snap.runs.length > 0) {
    snapRecent = snap.runs.slice(0, 8).map(r => {
      const p1n = r.p1Name || name;
      const wl = r.winner === 'p1'
        ? `<span style="color:#2ecc71">${p1n} WIN</span>`
        : r.winner === 'p2'
          ? '<span style="color:#e74c3c">LOSS</span>'
          : '<span style="color:#666680">DRAW</span>';
      return `<div style="display:flex;justify-content:space-between;font-size:11px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.04);gap:8px;flex-wrap:wrap;">
        <span style="color:#4ecaff;letter-spacing:1px;min-width:60px">${r.mode.toUpperCase()}</span>
        <span>${p1n} ${r.p1} - ${r.p2} P2</span>
        ${wl}
        <span style="color:#666680;font-size:10px">${r.date}</span>
      </div>`;
    }).join('');
  }

  const statCell = (num, label, color) => `
    <div style="flex:1;text-align:center;background:rgba(255,255,255,0.03);border:1px solid #2a2a3a;padding:8px 4px;">
      <div style="font-size:22px;font-weight:900;color:${color}">${num}</div>
      <div style="font-size:9px;letter-spacing:2px;color:#666680;margin-top:2px;text-transform:uppercase">${label}</div>
    </div>`;
  const sectionHead = (txt) => `<div style="font-size:11px;letter-spacing:4px;color:#e8c84a;text-transform:uppercase;margin:14px 0 8px;font-weight:900;">${txt}</div>`;
  const subHead = (txt) => `<div style="font-size:9px;letter-spacing:4px;color:#666680;text-transform:uppercase;margin-bottom:8px;">${txt}</div>`;

  document.getElementById('liar-records-body').innerHTML = `
    ${sectionHead('THE LIAR MACHINE')}
    <div style="border-top:1px solid #2a2a3a;padding-top:12px;">
      ${subHead('Best Times')}
      <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.04);">
        <span style="color:#666680">VOCAB</span>${fmtBest(rec.best.vocab)}
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.04);">
        <span style="color:#666680">SENTENCES</span>${fmtBest(rec.best.sentences)}
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px;">
        <span style="color:#666680">QUESTIONS</span>${fmtBest(rec.best.questions)}
      </div>
    </div>
    <div style="border-top:1px solid #2a2a3a;padding-top:12px;margin-top:12px;">
      ${subHead('Win / Loss')}
      <div style="display:flex;gap:2px;margin-bottom:8px;">
        ${statCell(p1w, name + ' WINS', '#2ecc71')}
        ${statCell(p2w, 'LOSSES', '#e74c3c')}
        ${statCell(draws, 'DRAWS', '#666680')}
        ${statCell(winRate, 'WIN RATE', '#f0f0f0')}
      </div>
    </div>
    <div style="border-top:1px solid #2a2a3a;padding-top:12px;margin-top:12px;">
      ${subHead('Recent Duels')}
      ${liarRecent}
    </div>

    ${sectionHead("MISTER HAPPY'S SNAP TEST")}
    <div style="border-top:1px solid #2a2a3a;padding-top:12px;">
      ${subHead('Win / Loss')}
      <div style="display:flex;gap:2px;margin-bottom:8px;">
        ${statCell(sw, name + ' WINS', '#2ecc71')}
        ${statCell(sl, 'LOSSES', '#e74c3c')}
        ${statCell(sd, 'DRAWS', '#666680')}
        ${statCell(snapRate, 'WIN RATE', '#f0f0f0')}
      </div>
    </div>
    <div style="border-top:1px solid #2a2a3a;padding-top:12px;margin-top:12px;">
      ${subHead('Recent Games')}
      ${snapRecent}
    </div>
  `;

  const modal = document.getElementById('liar-records-modal');
  modal.style.display = 'flex';
}
  
function closeLiarRecords() {
  document.getElementById('liar-records-modal').style.display = 'none';
}
</script>
