
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport"
      content="width=device-width, initial-scale=1,
               maximum-scale=1, user-scalable=no,
               viewport-fit=cover">
<title>Booha Game</title>
<meta name="theme-color" content="#081a04" />

 <!-- ═══ PWA ═══════════════════════════════════════════════ -->
  <link rel="manifest" href="/the-booha-adventure/manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Booha Adventure">
  <link rel="apple-touch-icon" href="/the-booha-adventure/icons/icon-512.png">
  <!-- ═══════════════════════════════════════════════════════ -->

<!-- ═══ TOKEN GATE ════════════════════════════════════════ -->
  <style>
    html.token-checking,
    html.token-checking body {
      background: #000;
      visibility: hidden;
    }
  </style>
  <script>document.documentElement.classList.add('token-checking');</script>
  <script src="./js/token.js"></script>
  <!-- ═══════════════════════════════════════════════════════ -->

      
<!-- Game CSS -->
<link rel="stylesheet" href="theme/game.css" />
<!-- SFX preload -->
<link rel="preload" as="audio" href="assets/audio/ding.mp3" />
<link rel="preload" as="audio" href="assets/audio/fart.mp3" />
</head>
<body>
<!-- ✕ Close button -->
<a class="game-close" id="gameClose" href="#" title="Back / もどる">✕</a>
<!-- Header (populated by game engines) -->
<header class="game-header">
  <div class="game-title" id="gameTitle">Loading…</div>
  <div class="game-week"  id="gameWeek"  data-week-label></div>
</header>
<!-- Loading state -->
<div id="game-loading">Loading…</div>
<!-- Error state (hidden until needed) -->
<div id="game-error"></div>
<!-- Game mount point — each engine renders into this -->
<main id="game-mount"></main>
<!-- iOS notice overlay (shared, engines show/hide as needed) -->
<div id="ios-overlay" class="ios-overlay">
  <div class="ios-dialog">
    <div class="ios-dialog-title">iPad / iPhone をお使いの方へ</div>
    <p id="ios-overlay-body"></p>
    <div style="text-align:center;margin-top:14px;">
      <button id="ios-overlay-ok" class="game-btn game-btn-gold">OK ／ はじめる</button>
    </div>
  </div>
</div>
<!-- Swipe-out transition screen -->
<div id="swipe-screen"></div>
<script>
/* ── Close button: go back to game-index, keep history for music ── */
document.getElementById('gameClose').addEventListener('click', function(e) {
  e.preventDefault();
  const cfg = window.GAME_CONFIG;
  if (cfg) {
    sessionStorage.setItem(cfg.navKey, '1');
    window.location.assign(cfg.navTarget + '?week=' + encodeURIComponent(cfg.weekParam));
  } else {
    history.back();
  }
});
</script>
 
<script src="/the-booha-adventure/js/calendar.js"></script>
<script src="/the-booha-adventure/js/core/adventure-core.js"></script>
<script src="/the-booha-adventure/js/core/save-file.js"></script>
<script src="js/sync-client.js"></script>      
<script src="/the-booha-adventure/js/core/game-registry.js"></script>
<script src="/the-booha-adventure/js/core/score-system.js"></script>
<script src="/the-booha-adventure/js/core/unlock-system.js"></script>
<script src="/the-booha-adventure/js/core/day-record.js"></script>  
<script src="/the-booha-adventure/js/game-utils.js"></script>
<script src="/the-booha-adventure/js/game-core.js"></script>
 
</body>
</html>
