
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Booha Homework</title>
  <meta name="theme-color" content="#ffffff" />
  <link href="https://fonts.googleapis.com/css2?family=Chau+Philomene+One&family=Nunito:wght@700;800;900&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f5f6f8;
      --ink:#111827;
      --muted:#6b7280;
      --line:#e5e7eb;
      --card:#ffffff;
      --pink:#ff5ca8;
      --green:#79d400;
      --blue:#29b6ff;
      --purple:#9b6bff;
      --gold:#ffbf2f;
      --radius:22px;
    }

    *{ box-sizing:border-box; }
    html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink); }
    body{
      font-family:'Nunito',sans-serif;
      min-height:100dvh;
    }

    #app{
      max-width:980px;
      margin:0 auto;
      padding:18px 14px 60px;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:16px;
    }

    .title{
      font-family:'Chau Philomene One',sans-serif;
      font-size:clamp(28px,6vw,48px);
      letter-spacing:.04em;
      margin:0;
    }

    .subtitle{
      color:var(--muted);
      font-size:14px;
      font-weight:800;
      margin-top:4px;
    }

    .panel{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:0 10px 30px rgba(0,0,0,.06);
      padding:18px;
      margin-bottom:16px;
    }

    .section-title{
      font-family:'Chau Philomene One',sans-serif;
      font-size:clamp(20px,4vw,30px);
      margin:0 0 10px;
    }

    .section-sub{
      color:var(--muted);
      font-size:14px;
      margin-bottom:14px;
      font-weight:700;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
    }

    .grid.two{
      grid-template-columns:repeat(2,1fr);
    }

    .choice-btn{
      border:none;
      border-radius:20px;
      padding:18px 14px;
      font-family:'Nunito',sans-serif;
      font-weight:900;
      font-size:18px;
      cursor:pointer;
      background:#fff;
      border:2px solid var(--line);
      box-shadow:0 4px 12px rgba(0,0,0,.05);
      transition:transform .15s, box-shadow .15s, border-color .15s;
    }

    .choice-btn:hover{
      transform:translateY(-2px);
      box-shadow:0 10px 18px rgba(0,0,0,.08);
    }

    .choice-btn.week-last{ border-color:#d1d5db; }
    .choice-btn.week-this{ border-color:var(--green); }
    .choice-btn.week-next{ border-color:var(--blue); }

    .choice-btn.pb{ border-color:var(--pink); }
    .choice-btn.br{ border-color:var(--green); }
    .choice-btn.bc{ border-color:var(--purple); }

    .choice-btn.vocab{ border-color:var(--green); }
    .choice-btn.sentences{ border-color:var(--blue); }
    .choice-btn.questions{ border-color:var(--gold); }

    .small-label{
      display:block;
      font-size:12px;
      color:var(--muted);
      margin-top:4px;
      font-weight:800;
    }

    .crumbs{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-bottom:14px;
    }

    .crumb{
      background:#fff;
      border:1px solid var(--line);
      border-radius:999px;
      padding:8px 12px;
      font-size:13px;
      font-weight:900;
    }

    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-bottom:14px;
    }

    .action-btn{
      border:none;
      border-radius:999px;
      padding:10px 16px;
      background:#111827;
      color:#fff;
      font-family:'Nunito',sans-serif;
      font-weight:900;
      cursor:pointer;
    }

    .action-btn.alt{
      background:#eef2f7;
      color:#111827;
    }

    .sheet{
      background:#fff;
      border:1px solid var(--line);
      border-radius:24px;
      padding:10px 18px 28px;
      box-shadow:0 12px 30px rgba(0,0,0,.06);
    }

    .sheet-head{
      padding:14px 0 10px;
      border-bottom:2px solid #111827;
      margin-bottom:8px;
    }

    .sheet-title{
      font-family:'Chau Philomene One',sans-serif;
      font-size:clamp(22px,4vw,34px);
      margin:0;
    }

    .sheet-meta{
      color:var(--muted);
      font-weight:800;
      margin-top:4px;
      font-size:14px;
    }

    .hw-item{
      padding:16px 0 18px;
      border-bottom:1px solid var(--line);
      transition:opacity .18s, transform .18s;
    }

    .hw-item.hidden-known{
      display:none;
    }

    .hw-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:6px;
    }

    .hw-num{
      font-size:20px;
      font-weight:900;
    }

    .hw-toggle{
      border:none;
      border-radius:999px;
      background:#eef2f7;
      color:#111827;
      padding:8px 12px;
      font-weight:900;
      cursor:pointer;
      font-size:13px;
    }

    .hw-en{
      font-size:24px;
      line-height:1.35;
      font-weight:900;
      color:#111827;
      margin-bottom:6px;
    }

    .hw-hira{
      font-family:'Noto Sans JP',sans-serif;
      font-size:18px;
      line-height:1.6;
      color:#4b5563;
      margin-bottom:2px;
    }

    .hw-jp{
      font-family:'Noto Sans JP',sans-serif;
      font-size:20px;
      line-height:1.6;
      color:#111827;
      font-weight:700;
    }

    .empty{
      text-align:center;
      color:var(--muted);
      padding:28px 10px;
      font-weight:800;
    }

    @media (max-width: 720px){
      .grid, .grid.two{ grid-template-columns:1fr; }
      .hw-en{ font-size:21px; }
      .hw-hira{ font-size:16px; }
      .hw-jp{ font-size:18px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="topbar">
      <div>
        <h1 class="title">HOMEWORK</h1>
        <div class="subtitle">Copy practice for last, this, and next week</div>
      </div>
    </div>

    <div id="root"></div>
  </div>

  <script src="/the-booha-adventure/js/calendar.js"></script>
  <script src="/the-booha-adventure/js/homework.js"></script>
</body>
</html>
