
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Booha Homework</title>
  <meta name="theme-color" content="#ffffff" />
  <link href="https://fonts.googleapis.com/css2?family=Chau+Philomene+One&family=Nunito:wght@700;800;900&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f5f6f8;
      --ink:#111827;
      --muted:#6b7280;
      --line:#e5e7eb;
      --card:#ffffff;
      --pink:#ff5ca8;
      --green:#79d400;
      --blue:#29b6ff;
      --purple:#9b6bff;
      --gold:#ffbf2f;
      --radius:22px;
    }

    *{ box-sizing:border-box; }
    html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink); }
    body{
      font-family:'Nunito',sans-serif;
      min-height:100dvh;
    }

   #app{
  width:100%;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px 16px 48px;
  background:
    linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,.30)),
    url('/the-booha-adventure/assets/img/hw-background-1.png') center center / cover no-repeat;
}

       .topbar{
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      gap:8px;
      margin-bottom:18px;
    }

    .title{
      font-family:'Chau Philomene One',sans-serif;
      font-size:clamp(34px,7vw,64px);
      letter-spacing:.05em;
      margin:0;
      color:#fff;
      text-shadow:
        0 0 18px rgba(255,255,255,.18),
        0 0 38px rgba(255,210,100,.18),
        0 6px 20px rgba(0,0,0,.35);
    }

    .subtitle{
      color:rgba(255,255,255,.90);
      font-size:14px;
      font-weight:800;
      margin-top:0;
      line-height:1.75;
      text-shadow:0 2px 8px rgba(0,0,0,.28);
    }

       .panel{
      width:min(980px,100%);
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.24);
      border-radius:28px;
      box-shadow:
        0 18px 44px rgba(0,0,0,.20),
        inset 0 1px 0 rgba(255,255,255,.20);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      padding:22px 20px 20px;
      margin-bottom:16px;
    }

       .section-title{
      font-family:'Chau Philomene One',sans-serif;
      font-size:clamp(24px,4.2vw,34px);
      margin:0 0 8px;
      color:#fff;
      text-align:center;
      text-shadow:0 2px 10px rgba(0,0,0,.28);
    }

    .section-sub{
      color:rgba(255,255,255,.88);
      font-size:14px;
      margin-bottom:16px;
      font-weight:800;
      text-align:center;
      line-height:1.7;
      text-shadow:0 2px 10px rgba(0,0,0,.22);
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
    }

    .grid.two{
      grid-template-columns:repeat(2,1fr);
    }

       .choice-btn{
      border:none;
      border-radius:24px;
      padding:20px 16px;
      font-family:'Nunito',sans-serif;
      font-weight:900;
      font-size:19px;
      cursor:pointer;
      color:#fff;
      background:rgba(255,255,255,.10);
      border:2px solid rgba(255,255,255,.22);
      box-shadow:
        0 10px 24px rgba(0,0,0,.18),
        inset 0 1px 0 rgba(255,255,255,.16);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      transition:transform .15s, box-shadow .15s, border-color .15s, background .15s;
      text-align:center;
    }

    .choice-btn:hover{
      transform:translateY(-3px) scale(1.02);
      box-shadow:
        0 16px 28px rgba(0,0,0,.20),
        inset 0 1px 0 rgba(255,255,255,.18);
    }
    
    .choice-btn.week-last{ border-color:#d1d5db; }
    .choice-btn.week-this{ border-color:var(--green); }
    .choice-btn.week-next{ border-color:var(--blue); }

    .choice-btn.pb{ border-color:var(--pink); }
    .choice-btn.br{ border-color:var(--green); }
    .choice-btn.bc{ border-color:var(--purple); }

    .choice-btn.vocab{ border-color:var(--green); }
    .choice-btn.sentences{ border-color:var(--blue); }
    .choice-btn.questions{ border-color:var(--gold); }

       .small-label{
      display:block;
      font-size:12px;
      color:rgba(255,255,255,.88);
      margin-top:6px;
      font-weight:800;
      line-height:1.5;
    }

    .crumbs{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-bottom:14px;
    }

    .crumb{
      background:#fff;
      border:1px solid var(--line);
      border-radius:999px;
      padding:8px 12px;
      font-size:13px;
      font-weight:900;
    }

    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-bottom:14px;
    }

    .action-btn{
      border:none;
      border-radius:999px;
      padding:10px 16px;
      background:#111827;
      color:#fff;
      font-family:'Nunito',sans-serif;
      font-weight:900;
      cursor:pointer;
    }

    .action-btn.alt{
      background:#eef2f7;
      color:#111827;
    }

    .sheet{
      background:
        repeating-linear-gradient(
          to bottom,
          #ffffff 0px,
          #ffffff 34px,
          #e5e7eb 35px,
          #ffffff 36px
        );
      border:1px solid var(--line);
      border-radius:26px;
      padding:10px 22px 28px;
      box-shadow:0 14px 34px rgba(0,0,0,.10);
    }

    .sheet-head{
      padding:14px 0 10px;
      border-bottom:2px solid #111827;
      margin-bottom:8px;
    }

    .sheet-title{
      font-family:'Chau Philomene One',sans-serif;
      font-size:clamp(22px,4vw,34px);
      margin:0;
    }

    .sheet-meta{
      color:var(--muted);
      font-weight:800;
      margin-top:4px;
      font-size:14px;
    }

    .hw-item{
      padding:16px 0 18px;
      border-bottom:1px solid var(--line);
      transition:opacity .18s, transform .18s;
    }

    .hw-item{
      padding:18px 0 18px;
      border-bottom:none;
    }
    
 
    
        .hw-item.hidden-known{
      opacity:.14;
      filter:grayscale(1);
    }
    .hw-item.hidden-known .hw-en,
    .hw-item.hidden-known .hw-hira,
    .hw-item.hidden-known .hw-jp,
    .hw-item.hidden-known .hw-num{
      color:#b8bcc4 !important;
    }

    
       .hw-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom:4px;
    }

    .hw-num{
      font-size:20px;
      font-weight:900;
      min-width:36px;
      color:#111827;
      line-height:1.35;
    }
    .hw-toggle{
      border:none;
      border-radius:999px;
      background:#eef2f7;
      color:#111827;
      padding:8px 12px;
      font-weight:900;
      cursor:pointer;
      font-size:13px;
    }

    .hw-en{
      font-size:24px;
      line-height:1.35;
      font-weight:900;
      color:#111827;
      margin-bottom:6px;
    }

       .hw-hira{
      font-family:'Noto Sans JP',sans-serif;
      font-size:18px;
      line-height:1.6;
      color:#cc5aa2;
      margin-top:4px;
      margin-bottom:2px;
      font-weight:700;
    }

    .hw-jp{
      font-family:'Noto Sans JP',sans-serif;
      font-size:20px;
      line-height:1.6;
      color:#7c4dff;
      font-weight:800;
    }
    
    .empty{
      text-align:center;
      color:var(--muted);
      padding:28px 10px;
      font-weight:800;
    }

    @media (max-width: 720px){
      .grid, .grid.two{ grid-template-columns:1fr; }
      .hw-en{ font-size:21px; }
      .hw-hira{ font-size:16px; }
      .hw-jp{ font-size:18px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="topbar">
      <div>
        <h1 class="title">HOMEWORK</h1>
        <div class="subtitle">
          Copy practice for last, this, and next week<br>
          さいしょ・こんしゅう・らいしゅう の れんしゅう<br>
          先週・今週・来週の練習
        </div>
      </div>
    </div>

    <div id="root"></div>
  </div>

  <script src="/the-booha-adventure/js/calendar.js"></script>
  <script src="/the-booha-adventure/js/homework.js"></script>
</body>
</html>
