
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ぼくのぼうけん — My Adventure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Yomogi&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme/save-ui.css">

  <style>
    :root {
      --ink:         #0a0a12;
      --void:        #070710;
      --fog:         #1a1530;
      --mist:        #241d3f;
      --glow-moon:   #c8b8ff;
      --glow-teal:   #7fffd4;
      --glow-amber:  #ffcc66;
      --glow-rose:   #ff9eb5;
      --glow-bc:     #a8edcc;
      --glow-br:     #a8d4ff;
      --glow-pb:     #e8a8ff;
      --text:        #e8e0f8;
      --text-dim:    #9d93c0;
      --text-ghost:  #5a5278;
      --radius:      12px;
      --radius-lg:   20px;
      --font-title:  'Cinzel Decorative', serif;
      --font-jp:     'Yomogi', cursive;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--void);
      color: var(--text);
      font-family: var(--font-jp);
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* ── ATMOSPHERE ─────────────────────────────── */
    .bg-cosmos {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%,   #1a1060 0%, transparent 70%),
        radial-gradient(ellipse 80% 60% at 20% 100%,  #0d1a1a 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 80% 80%,   #1a0d20 0%, transparent 60%),
        var(--void);
    }

    .bg-moon-shaft {
      position: fixed; top: -10%; left: 50%; transform: translateX(-50%);
      width: 280px; height: 75vh; z-index: 1; pointer-events: none;
      background: radial-gradient(ellipse 50% 100% at 50% 0%, #c8b8ff14 0%, transparent 100%);
      animation: moonPulse 7s ease-in-out infinite;
    }
    @keyframes moonPulse {
      0%,100% { opacity:.7; transform:translateX(-50%) scaleX(1); }
      50%      { opacity:1;  transform:translateX(-50%) scaleX(1.2); }
    }

    .bg-stars {
      position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden;
    }
    .bg-stars::before, .bg-stars::after {
      content: ''; position: absolute; inset: 0;
      animation: twinkle 4s ease-in-out infinite;
    }
    .bg-stars::before {
      background-image:
        radial-gradient(1.5px 1.5px at  8% 12%, #fff       0%, transparent 100%),
        radial-gradient(1px   1px   at 15% 45%, #c8b8ff    0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 22% 78%, #fff       0%, transparent 100%),
        radial-gradient(1px   1px   at 35% 25%, #7fffd4    0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 42%  8%, #fff       0%, transparent 100%),
        radial-gradient(1px   1px   at 55% 60%, #c8b8ff    0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 68% 35%, #fff       0%, transparent 100%),
        radial-gradient(1px   1px   at 75% 88%, #7fffd4    0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 82% 18%, #fff       0%, transparent 100%),
        radial-gradient(2px   2px   at 95% 30%, #ffcc66    0%, transparent 100%);
    }
    .bg-stars::after {
      background-image:
        radial-gradient(1px 1px at 12% 33%, #fff       0%, transparent 100%),
        radial-gradient(1px 1px at 28% 55%, #c8b8ff    0%, transparent 100%),
        radial-gradient(1px 1px at 47% 90%, #fff       0%, transparent 100%),
        radial-gradient(1px 1px at 60% 15%, #7fffd4    0%, transparent 100%),
        radial-gradient(1px 1px at 73% 70%, #fff       0%, transparent 100%),
        radial-gradient(1px 1px at 88% 42%, #ffcc66    0%, transparent 100%);
      animation-duration: 6s;
      animation-delay: 2s;
    }
    @keyframes twinkle {
      0%,100% { opacity:.65; } 50% { opacity:1; }
    }

    .bg-forest {
      position: fixed; bottom: 0; left: 0; width: 100%;
      z-index: 2; pointer-events: none;
    }

    .bg-fog {
      position: fixed; bottom: 0; left: -50%; width: 200%; height: 110px;
      z-index: 3; pointer-events: none;
      background: linear-gradient(to top, #07071088 0%, transparent 100%);
      animation: fogDrift 22s linear infinite;
    }
    @keyframes fogDrift {
      from { transform:translateX(0); }
      to   { transform:translateX(25%); }
    }

    /* ── LAYOUT ──────────────────────────────────── */
    .page {
      position: relative; z-index: 10;
      max-width: 820px; margin: 0 auto;
      padding: 3rem 1.5rem 8rem;
    }

    /* ── GLASS CARD ──────────────────────────────── */
    .glass {
      background: linear-gradient(135deg, #1a153088 0%, #0e0b1a99 100%);
      border: 1px solid #c8b8ff22;
      border-radius: var(--radius-lg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      position: relative; overflow: hidden;
    }
    .glass::before {
      content: '';
      position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background: linear-gradient(135deg, #c8b8ff08 0%, transparent 55%);
    }

    /* ── HEADER ──────────────────────────────────── */
    .profile-header {
      text-align: center; margin-bottom: 2.75rem;
      animation: riseIn .9s cubic-bezier(.16,1,.3,1) both;
    }

    .moon-orb {
      width: 78px; height: 78px; border-radius: 50%; margin: 0 auto 1.2rem;
      background: radial-gradient(circle at 35% 35%, #e8e0ff, #9d80ff 55%, #4a2d8a);
      box-shadow: 0 0 0 2px #c8b8ff22, 0 0 30px #c8b8ff77, 0 0 80px #c8b8ff33,
                  inset 0 -6px 18px #2a1a5a55;
      animation: orbFloat 5s ease-in-out infinite;
      position: relative;
    }
    .moon-orb::after {
      content: ''; position: absolute; inset: 12px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff2a, transparent 60%);
    }
    @keyframes orbFloat {
      0%,100% { transform:translateY(0); box-shadow:0 0 0 2px #c8b8ff22,0 0 30px #c8b8ff77,0 0 80px #c8b8ff33,inset 0 -6px 18px #2a1a5a55; }
      50%      { transform:translateY(-9px); box-shadow:0 0 0 2px #c8b8ff44,0 0 50px #c8b8ffaa,0 0 100px #c8b8ff55,inset 0 -6px 18px #2a1a5a55; }
    }

    .h-en {
      font-family: var(--font-title); font-size: clamp(1.3rem,5vw,2rem);
      color: var(--glow-moon);
      text-shadow: 0 0 30px #c8b8ff99, 0 0 60px #c8b8ff33;
      line-height: 1.2; letter-spacing: .06em;
    }
    .h-jp    { font-size: 1rem;  color: var(--text-dim); margin-top:.25rem; letter-spacing:.12em; }
    .h-kanji { font-size: .72rem; color: var(--text-ghost); letter-spacing:.2em; margin-top:.1rem; }

    .back-btn {
      display: inline-flex; align-items: center; gap: .4rem;
      margin-top: 1.1rem; padding: .4rem .9rem; border-radius: 99px;
      border: 1px solid #c8b8ff33; background: #c8b8ff08;
      color: var(--text-dim); font-family: var(--font-jp); font-size: .78rem;
      cursor: pointer; text-decoration: none; transition: all .2s;
    }
    .back-btn:hover { border-color: var(--glow-moon); color: var(--glow-moon); box-shadow: 0 0 12px #c8b8ff44; }

    /* ── SECTION EYEBROW ─────────────────────────── */
    .eyebrow {
      display: flex; align-items: baseline; gap: .55rem; margin-bottom: 1rem;
    }
    .ey-en {
      font-family: var(--font-title); font-size: .58rem;
      letter-spacing: .18em; text-transform: uppercase;
      color: var(--glow-moon); text-shadow: 0 0 10px #c8b8ff77;
    }
    .ey-jp    { font-family: var(--font-jp); font-size: .7rem; color: var(--text-dim); }
    .ey-kanji { font-family: var(--font-jp); font-size: .6rem; color: var(--text-ghost); }
    .ey-line  { flex:1; height:1px; background: linear-gradient(90deg,#c8b8ff22,transparent); }

    /* ── TOTALS ──────────────────────────────────── */
    .totals-bar {
      display: grid; grid-template-columns: repeat(3,1fr);
      gap: .7rem; margin-bottom: 2rem;
      animation: riseIn .9s .1s cubic-bezier(.16,1,.3,1) both;
    }

    .total-card {
      padding: 1.1rem .7rem; text-align: center;
      transition: transform .2s;
    }
    .total-card:hover { transform: translateY(-3px); }
    .total-card::after {
      content: ''; position: absolute;
      bottom:0; left:12%; right:12%; height:1px; border-radius:99px;
    }
    .tc-stars::after  { background:var(--glow-amber); box-shadow:0 0 8px var(--glow-amber); }
    .tc-done::after   { background:var(--glow-teal);  box-shadow:0 0 8px var(--glow-teal); }
    .tc-unlock::after { background:var(--glow-moon);  box-shadow:0 0 8px var(--glow-moon); }

    .tv {
      font-family: var(--font-title); font-size: clamp(1.2rem,4vw,1.9rem); line-height:1.1; margin-bottom:.35rem;
    }
    .tc-stars  .tv { color:var(--glow-amber); text-shadow:0 0 20px #ffcc6677; }
    .tc-done   .tv { color:var(--glow-teal);  text-shadow:0 0 20px #7fffd477; }
    .tc-unlock .tv { color:var(--glow-moon);  text-shadow:0 0 20px #c8b8ff77; }

    .t-icon { font-size:1.05rem; margin-bottom:.25rem; }
    .t-tri  { display:flex; flex-direction:column; gap:.05rem; align-items:center; }
    .t-en   { font-family:var(--font-title); font-size:.58rem; letter-spacing:.1em; text-transform:uppercase; }
    .t-jp   { font-size:.72rem; }
    .t-k    { font-size:.6rem; color:var(--text-ghost); }
    .tc-stars  .t-en { color:var(--glow-amber); }
    .tc-done   .t-en { color:var(--glow-teal); }
    .tc-unlock .t-en { color:var(--glow-moon); }

    /* ── CURRICULUM ──────────────────────────────── */
    .curr-section { margin-bottom:2rem; animation:riseIn .9s .2s cubic-bezier(.16,1,.3,1) both; }
    .curr-card    { padding:1.35rem; margin-bottom:.85rem; }

    .curr-head {
      display:flex; align-items:center; justify-content:space-between; margin-bottom:.8rem;
    }
    .curr-badge { display:flex; align-items:center; gap:.65rem; }

    .orb {
      width:34px; height:34px; border-radius:50%; display:flex;
      align-items:center; justify-content:center;
      font-family:var(--font-title); font-size:.62rem; font-weight:700; flex-shrink:0;
    }
    .orb-bc { background:radial-gradient(circle at 35% 35%,#d4fce9,#4aaa7a); box-shadow:0 0 14px #a8edcc77; color:#0a2a1a; }
    .orb-br { background:radial-gradient(circle at 35% 35%,#d4e8ff,#4a82cc); box-shadow:0 0 14px #a8d4ff77; color:#0a1a2a; }
    .orb-pb { background:radial-gradient(circle at 35% 35%,#f0d4ff,#a04acc); box-shadow:0 0 14px #e8a8ff77; color:#1a0a2a; }

    .curr-name-en { font-family:var(--font-title); font-size:.68rem; letter-spacing:.08em; }
    .curr-name-jp { font-size:.7rem; color:var(--text-dim); }
    .curr-name-k  { font-size:.6rem; color:var(--text-ghost); }
    .c-bc { color:var(--glow-bc); text-shadow:0 0 10px #a8edcc55; }
    .c-br { color:var(--glow-br); text-shadow:0 0 10px #a8d4ff55; }
    .c-pb { color:var(--glow-pb); text-shadow:0 0 10px #e8a8ff55; }

    .curr-stars { font-family:var(--font-title); font-size:.76rem; color:var(--glow-amber); text-shadow:0 0 10px #ffcc6655; }

    .prog-track { height:4px; background:#c8b8ff14; border-radius:99px; overflow:hidden; margin-bottom:.85rem; }
    .prog-fill  { height:100%; border-radius:99px; width:0%; transition:width 1.1s cubic-bezier(.34,1.56,.64,1); }
    .pf-bc { background:linear-gradient(90deg,#4aaa7a,#a8edcc); box-shadow:0 0 5px #a8edcc77; }
    .pf-br { background:linear-gradient(90deg,#4a82cc,#a8d4ff); box-shadow:0 0 5px #a8d4ff77; }
    .pf-pb { background:linear-gradient(90deg,#a04acc,#e8a8ff); box-shadow:0 0 5px #e8a8ff77; }

    .game-rows  { display:flex; flex-direction:column; gap:.28rem; }
    .game-row   {
      display:grid; grid-template-columns:1.3rem 1fr auto auto;
      align-items:center; gap:.55rem;
      padding:.45rem .65rem; border-radius:8px;
      background:#c8b8ff05; border:1px solid transparent;
      transition:background .15s, border-color .15s;
    }
    .game-row:hover { background:#c8b8ff0d; border-color:#c8b8ff16; }
    .game-row.done  { background:#7fffd406; border-color:#7fffd416; }

    .row-chk { font-size:.82rem; text-align:center; line-height:1; }
    .row-names { overflow:hidden; }
    .rn-en {
      font-family:var(--font-title); font-size:.62rem; letter-spacing:.04em;
      color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .game-row.done .rn-en { color:var(--glow-teal); }
    .rn-jp {
      font-size:.62rem; color:var(--text-ghost);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .row-stars { display:flex; gap:1px; }
    .sp { font-size:.62rem; opacity:.18; transition:opacity .2s; }
    .sp.lit { opacity:1; filter:drop-shadow(0 0 3px #ffcc66); }
    .row-sc {
      font-family:var(--font-title); font-size:.6rem;
      color:var(--text-ghost); min-width:2rem; text-align:right;
    }
    .game-row.done .row-sc { color:var(--text-dim); }

    /* ── UNLOCKS ─────────────────────────────────── */
    .unlock-section { margin-bottom:2rem; animation:riseIn .9s .3s cubic-bezier(.16,1,.3,1) both; }
    .unlocks-grid   { display:grid; grid-template-columns:repeat(auto-fill,minmax(205px,1fr)); gap:.55rem; }

    .u-chip {
      display:flex; align-items:center; gap:.6rem;
      padding:.65rem .8rem; border-radius:var(--radius);
      border:1px solid #c8b8ff14; background:#c8b8ff05;
      filter:grayscale(.8); opacity:.45; transition:all .2s;
      position:relative; overflow:hidden;
    }
    .u-chip.earned {
      filter:none; opacity:1; border-color:#c8b8ff44;
      background:#c8b8ff0c; box-shadow:0 0 20px #c8b8ff14,inset 0 0 20px #c8b8ff05;
    }
    .u-chip.earned:hover { border-color:var(--glow-moon); box-shadow:0 0 28px #c8b8ff2a; transform:translateY(-2px); }
    .u-chip.earned::before {
      content:''; position:absolute; top:0; left:-100%; width:55%; height:100%;
      background:linear-gradient(90deg,transparent,#c8b8ff08,transparent);
      animation:shimmer 5s 1.5s ease-in-out infinite;
    }
    @keyframes shimmer { 0%{left:-100%} 50%,100%{left:160%} }

    .u-icon  { font-size:1.2rem; flex-shrink:0; }
    .u-text  { overflow:hidden; min-width:0; }
    .u-en    { font-family:var(--font-title); font-size:.6rem; letter-spacing:.05em; color:var(--glow-moon); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .u-chip:not(.earned) .u-en { color:var(--text-ghost); }
    .u-jp    { font-size:.63rem; color:var(--text-ghost); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .u-desc  { font-size:.6rem; color:var(--text-ghost); margin-top:.08rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    /* ── SAVE CONTROLS ───────────────────────────── */
    .save-section { padding:1.4rem; animation:riseIn .9s .4s cubic-bezier(.16,1,.3,1) both; }
    .save-grid    { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:.55rem; margin-top:.85rem; }

    .spell-btn {
      display:flex; flex-direction:column; align-items:center; gap:.28rem;
      padding:.85rem .7rem; border-radius:var(--radius);
      border:1px solid; background:transparent;
      cursor:pointer; font-family:var(--font-jp);
      transition:all .2s; position:relative; overflow:hidden; text-align:center;
    }
    .spell-btn::before {
      content:''; position:absolute; inset:0; opacity:0; transition:opacity .2s;
    }
    .spell-btn:hover::before { opacity:1; }
    .spell-btn:active { transform:scale(.97); }

    .sb-icon  { font-size:1.25rem; }
    .sb-en    { font-family:var(--font-title); font-size:.54rem; letter-spacing:.1em; text-transform:uppercase; }
    .sb-jp    { font-size:.7rem; }
    .sb-kanji { font-size:.58rem; }

    .sb-moon   { border-color:#c8b8ff55; color:var(--glow-moon); }
    .sb-moon::before   { background:radial-gradient(ellipse at 50% 0%,#c8b8ff14,transparent 70%); }
    .sb-moon:hover     { border-color:var(--glow-moon); box-shadow:0 0 20px #c8b8ff33,0 0 40px #c8b8ff11; }

    .sb-teal   { border-color:#7fffd455; color:var(--glow-teal); }
    .sb-teal::before   { background:radial-gradient(ellipse at 50% 0%,#7fffd414,transparent 70%); }
    .sb-teal:hover     { border-color:var(--glow-teal); box-shadow:0 0 20px #7fffd433; }

    .sb-amber  { border-color:#ffcc6655; color:var(--glow-amber); }
    .sb-amber::before  { background:radial-gradient(ellipse at 50% 0%,#ffcc6614,transparent 70%); }
    .sb-amber:hover    { border-color:var(--glow-amber); box-shadow:0 0 20px #ffcc6633; }

    .sb-danger { border-color:#ff6b6b44; color:#ff9eb5; }
    .sb-danger::before { background:radial-gradient(ellipse at 50% 0%,#ff6b6b14,transparent 70%); }
    .sb-danger:hover   { border-color:#ff9eb5; box-shadow:0 0 20px #ff6b6b33; }

    .prof-status {
      text-align:center; font-size:.76rem; min-height:1.2em;
      margin-top:.8rem; color:var(--text-ghost); transition:color .2s;
    }
    .s-ok   { color:var(--glow-teal);  text-shadow:0 0 10px #7fffd455; }
    .s-err  { color:var(--glow-rose);  text-shadow:0 0 10px #ff9eb555; }
    .s-warn { color:var(--glow-amber); text-shadow:0 0 10px #ffcc6655; }

    /* ── ANIMATION ───────────────────────────────── */
    @keyframes riseIn {
      from { opacity:0; transform:translateY(22px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* ── MOBILE ──────────────────────────────────── */
    @media (max-width:500px) {
      .totals-bar { gap:.4rem; }
      .total-card { padding:.8rem .35rem; }
      .save-grid  { grid-template-columns:repeat(2,1fr); }
      .tv { font-size:1.1rem; }
    }
  </style>
</head>
<body>

<div class="bg-cosmos"></div>
<div class="bg-moon-shaft"></div>
<div class="bg-stars"></div>

<!-- Forest silhouette -->
<svg class="bg-forest" viewBox="0 0 1440 230" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0a1e"/>
      <stop offset="100%" stop-color="#070710"/>
    </linearGradient>
  </defs>
  <!-- distant trees, dimmed -->
  <g opacity="0.45">
    <polygon points="60,190 82,82 104,190"    fill="url(#tg)"/>
    <polygon points="115,190 148,58 181,190"  fill="url(#tg)"/>
    <polygon points="205,190 232,94 259,190"  fill="url(#tg)"/>
    <polygon points="1190,190 1212,78 1234,190" fill="url(#tg)"/>
    <polygon points="1265,190 1298,52 1331,190" fill="url(#tg)"/>
    <polygon points="1355,190 1382,88 1409,190" fill="url(#tg)"/>
  </g>
  <!-- foreground trees -->
  <polygon points="0,230 32,18 64,230"      fill="url(#tg)"/>
  <polygon points="52,230 98,0 144,230"     fill="url(#tg)"/>
  <polygon points="132,230 170,42 208,230"  fill="url(#tg)"/>
  <polygon points="265,230 298,62 331,230"  fill="url(#tg)"/>
  <polygon points="345,230 388,8 431,230"   fill="url(#tg)"/>
  <polygon points="478,230 506,72 534,230"  fill="url(#tg)"/>
  <polygon points="925,230 958,60 991,230"  fill="url(#tg)"/>
  <polygon points="1008,230 1055,4 1102,230" fill="url(#tg)"/>
  <polygon points="1118,230 1150,48 1182,230" fill="url(#tg)"/>
  <polygon points="1238,230 1275,22 1312,230" fill="url(#tg)"/>
  <polygon points="1328,230 1368,58 1408,230" fill="url(#tg)"/>
  <polygon points="1395,230 1418,82 1441,230" fill="url(#tg)"/>
  <!-- twisted branches -->
  <path d="M98 30 Q128 10 148 28"  stroke="#0d0a1e" stroke-width="4" fill="none" opacity="0.9"/>
  <path d="M388 20 Q415 4 432 22"  stroke="#0d0a1e" stroke-width="3" fill="none" opacity="0.9"/>
  <path d="M1055 18 Q1080 2 1100 20" stroke="#0d0a1e" stroke-width="3" fill="none" opacity="0.9"/>
  <path d="M170 55 Q195 40 210 58"  stroke="#0d0a1e" stroke-width="3" fill="none" opacity="0.7"/>
  <!-- ground fill -->
  <rect x="0" y="205" width="1440" height="25" fill="#070710"/>
</svg>

<div class="bg-fog"></div>

<!-- ═══════════════════════════════ PAGE ═══════════════════════════════ -->
<div class="page">

  <!-- Header -->
  <header class="profile-header">
    <div class="moon-orb"></div>
    <div class="h-en">My Adventure</div>
    <div class="h-jp">ぼくのぼうけん</div>
    <div class="h-kanji">冒険の記録</div>
    <a href="javascript:history.back()" class="back-btn">← 戻る &nbsp;/&nbsp; Back</a>
  </header>

  <!-- Totals -->
  <div class="totals-bar">

  <!-- Curriculum progress -->
  <section class="curr-section">
    <div class="eyebrow">
      <span class="ey-en">Curriculum</span>

  <!-- Unlocks -->
  <section class="unlock-section">

      <span class="ey-en">Achievements</span>

  <!-- Save controls -->
  <section class="save-section glass">
    <div class="eyebrow">

        <span class="sb-icon">📋</span>

<!-- Core systems -->
<script src="js/core/adventure-core.js"></script>
<script src="js/core/save-file.js"></script>
<script src="js/core/save-utils.js"></script>
<script src="js/core/save-code.js"></script>
<script src="js/core/game-registry.js"></script>
<script src="js/core/score-system.js"></script>
<script src="js/core/unlock-system.js"></script>
<script src="js/core/stats-system.js"></script>
<script src="js/core/collectible-system.js"></script>
<script src="js/core/page-state.js"></script>
<script src="js/core/week-system.js"></script>
<script src="js/ui/memory-code-ui.js"></script>
<script src="js/ui/save-menu.js"></script>

<script>
const GAME_JP = {
  ask_sentence:   { jp:'しつもんをする',   k:'質問文' },
  say_sentence:   { jp:'ぶんをいう',       k:'文を言う' },
  say_word:       { jp:'たんごをいう',     k:'単語を言う' },
  sentence_order: { jp:'ぶんならべかえ',   k:'文の順序' },
  sentence_speed: { jp:'すぴーどぶん',     k:'速文' },
  sentence_tap:   { jp:'ぶんをたっぷ',     k:'文タップ' },
  spell_word:     { jp:'もじをかく',       k:'綴り' },
  vocab_speed:    { jp:'すぴーどごい',     k:'速語彙' },
  vocab_tap:      { jp:'ごいをたっぷ',     k:'語彙タップ' },
};

const CURR_INFO = {
  bc:{ en:'BC Curriculum', jp:'BCカリキュラム', k:'BC課程', cc:'c-bc', oc:'orb-bc', fc:'pf-bc' },
  br:{ en:'BR Curriculum', jp:'BRカリキュラム', k:'BR課程', cc:'c-br', oc:'orb-br', fc:'pf-br' },
  pb:{ en:'PB Curriculum', jp:'PBカリキュラム', k:'PB課程', cc:'c-pb', oc:'orb-pb', fc:'pf-pb' },
};

const UNLOCK_META = {
  first_game:              { icon:'🌟', jp:'さいしょのゲーム', k:'初ゲーム' },
  any_curriculum_complete: { icon:'🎓', jp:'カリキュラムかんりょう', k:'課程完了' },
  all_complete:            { icon:'👑', jp:'ぜんぶかんりょう', k:'全完了' },
};
function uMeta(id) {
  if (UNLOCK_META[id]) return UNLOCK_META[id];
  if (id.includes('all_complete')) return { icon:'🏆', jp:'チャンピオン', k:'王者' };
  return { icon:'✅', jp:'クリア', k:'完了' };
}

function starsHTML(n, max=3) {
  return Array.from({length:max},(_,i)=>`<span class="sp ${i<n?'lit':''}">★</span>`).join('');
}

function setStatus(msg, type='') {
  const el = document.getElementById('prof-status');
  el.textContent = msg;
  el.className = `prof-status ${type?'s-'+type:''}`;
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.textContent=''; el.className='prof-status'; }, 3500);
}

function render() {
  const S = BoohaAdventure.scores;
  const U = BoohaAdventure.unlocks;
  const R = BoohaAdventure.registry;

  const summary    = S.summaryAll();
  const allUnlocks = U.getAll();
  const earned     = allUnlocks.filter(u=>u.unlocked).length;

  document.getElementById('total-stars').textContent     = `${summary.stars}/${summary.totalStars}`;
  document.getElementById('total-completed').textContent = `${summary.completed}/${summary.totalGames}`;
  document.getElementById('total-unlocks').textContent   = `${earned}/${allUnlocks.length}`;

  // Curriculum cards
  const cont = document.getElementById('curr-cards');
  cont.innerHTML = '';
  R.CURRICULUMS.forEach(c => {
    const ci  = CURR_INFO[c];
    const cs  = S.summaryFor(c);
    const pct = cs.totalGames > 0 ? Math.round(cs.completed/cs.totalGames*100) : 0;

    const card = document.createElement('div');
    card.className = 'glass curr-card';
    card.innerHTML = `
      <div class="curr-head">
        <div class="curr-badge">
          <div class="orb ${ci.oc}">${c.toUpperCase()}</div>
          <div>
            <div class="curr-name-en ${ci.cc}">${ci.en}</div>
            <div class="curr-name-jp">${ci.jp} <span class="curr-name-k">${ci.k}</span></div>
          </div>
        </div>
        <span class="curr-stars">⭐ ${cs.stars}/${cs.totalStars}</span>
      </div>
      <div class="prog-track">
        <div class="prog-fill ${ci.fc}" data-target="${pct}"></div>
      </div>
      <div class="game-rows">
        ${cs.entries.map(e=>{
          const gj = GAME_JP[e.id]||{jp:e.name,k:''};
          return `<div class="game-row ${e.completed?'done':''}">
            <span class="row-chk">${e.completed?'✅':'☐'}</span>
            <div class="row-names">
              <div class="rn-en">${e.name}</div>
              <div class="rn-jp">${gj.jp}　${gj.k}</div>
            </div>
            <div class="row-stars">${starsHTML(e.stars)}</div>
            <div class="row-sc">${e.highScore>0?e.highScore:'—'}</div>
          </div>`;
        }).join('')}
      </div>`;
    cont.appendChild(card);
  });

  requestAnimationFrame(()=>{
    document.querySelectorAll('.prog-fill[data-target]').forEach(el=>{
      el.style.width = el.dataset.target+'%';
    });
  });

  // Unlocks
  const grid = document.getElementById('unlocks-grid');
  grid.innerHTML = '';
  [...allUnlocks].sort((a,b)=>b.unlocked-a.unlocked).forEach(u=>{
    const m = uMeta(u.id);
    const chip = document.createElement('div');
    chip.className = `u-chip ${u.unlocked?'earned':''}`;
    chip.innerHTML = `
      <span class="u-icon">${u.unlocked?m.icon:'🔒'}</span>
      <div class="u-text">
        <div class="u-en">${u.name}</div>
        <div class="u-jp">${m.jp}　<span style="font-size:.56rem">${m.k}</span></div>
        <div class="u-desc">${u.description}</div>
      </div>`;
    grid.appendChild(chip);
  });
}

document.addEventListener('booha:ready', ()=>{
  render();

  document.getElementById('btn-show-code').onclick  = ()=> BoohaMemoryCodeUI.showCode();
  document.getElementById('btn-enter-code').onclick = ()=> BoohaMemoryCodeUI.promptEnterCode();
  document.getElementById('btn-export').onclick = ()=>{
    BoohaSaveUtils.downloadSaveFile();
    setStatus('セーブファイルをダウンロードしました ✓','ok');
  };
  document.getElementById('btn-import').onclick = async ()=>{
    const {ok,error} = await BoohaSaveUtils.uploadSaveFile();
    if(ok){ setStatus('セーブをよみこみました ✓','ok'); render(); }
    else  setStatus(`よみこみしっぱい: ${error}`,'err');
  };
  document.getElementById('btn-reset').onclick = ()=>{
    const ok = BoohaSaveUtils.resetAll(true);
    if(ok){ setStatus('ぼうけんをリセットしました','warn'); setTimeout(render,400); }
  };

  document.addEventListener('booha:saved', render);
  document.addEventListener('booha:reset', render);
});
</script>
</body>
</html>
