  <style>
    :root {
      --ink:         #0a0a12;
      --void:        #070710;
      --fog:         #1a1530;
      --mist:        #241d3f;
      --glow-moon:   #ddd0ff;
      --glow-teal:   #7fffd4;
      --glow-amber:  #ffcc66;
      --glow-rose:   #ff9eb5;
      --glow-bc:     #a8edcc;
      --glow-br:     #a8d4ff;
      --glow-pb:     #e8a8ff;
      --text:        #f0eaff;
      --text-dim:    #c4bce0;
      --text-ghost:  #7a7098;
      --radius:      12px;
      --radius-lg:   20px;
      --font-title:  'Cinzel Decorative', serif;
      --font-jp:     'Yomogi', cursive;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--void);
      color: var(--text);
      font-family: var(--font-jp);
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* ── ATMOSPHERE ─────────────────────────────── */
    .bg-cosmos {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%,   #1a1060 0%, transparent 70%),
        radial-gradient(ellipse 80% 60% at 20% 100%,  #0d1a1a 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 80% 80%,   #1a0d20 0%, transparent 60%),
        var(--void);
    }

    .bg-moon-shaft {
      position: fixed; top: -10%; left: 50%; transform: translateX(-50%);
      width: 280px; height: 75vh; z-index: 1; pointer-events: none;
      background: radial-gradient(ellipse 50% 100% at 50% 0%, #c8b8ff14 0%, transparent 100%);
      animation: moonPulse 7s ease-in-out infinite;
    }
    @keyframes moonPulse {
      0%,100% { opacity:.7; transform:translateX(-50%) scaleX(1); }
      50%      { opacity:1;  transform:translateX(-50%) scaleX(1.2); }
    }

    /* ── STARS — DENSE MULTI-LAYER ──────────────── */
    .bg-stars {
      position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden;
    }
    .bg-stars::before, .bg-stars::after {
      content: ''; position: absolute; inset: 0;
      animation: twinkle 4s ease-in-out infinite;
    }
    .bg-stars::before {
      background-image:
        radial-gradient(1.5px 1.5px at  5%  7%, #fff       0%, transparent 100%),
        radial-gradient(1px   1px   at  8% 12%, #fff       0%, transparent 100%),
        radial-gradient(1px   1px   at 12% 28%, #c8b8ff    0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 15% 45%, #c8b8ff    0%, transparent 100%),
        radial-gradient(1px   1px   at 18% 62%, #fff       0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 22% 78%, #fff       0%, transparent 100%),
        radial-gradient(1px   1px   at 26% 14%, #7fffd4    0%, transparent 100%),
        radial-gradient(1px   1px   at 30% 52%, #c8b8ff    0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 35% 25%, #7fffd4    0%, transparent 100%),
        radial-gradient(1px   1px   at 38% 85%, #fff       0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 42%  8%, #fff       0%, transparent 100%),
        radial-gradient(1px   1px   at 46% 40%, #ffcc66    0%, transparent 100%),
        radial-gradient(1px   1px   at 50% 70%, #c8b8ff    0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 55% 60%, #c8b8ff    0%, transparent 100%),
        radial-gradient(1px   1px   at 58% 20%, #fff       0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 63%  5%, #7fffd4    0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 68% 35%, #fff       0%, transparent 100%),
        radial-gradient(1px   1px   at 71% 55%, #c8b8ff    0%, transparent 100%),
        radial-gradient(1px   1px   at 75% 88%, #7fffd4    0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 79% 10%, #fff       0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 82% 18%, #fff       0%, transparent 100%),
        radial-gradient(1px   1px   at 86% 48%, #ffcc66    0%, transparent 100%),
        radial-gradient(1px   1px   at 90% 72%, #c8b8ff    0%, transparent 100%),
        radial-gradient(2px   2px   at 95% 30%, #ffcc66    0%, transparent 100%),
        radial-gradient(1px   1px   at 98% 60%, #fff       0%, transparent 100%);
    }
    .bg-stars::after {
      background-image:
        radial-gradient(1px 1px at  3% 22%, #fff       0%, transparent 100%),
        radial-gradient(1px 1px at  7% 50%, #c8b8ff    0%, transparent 100%),
        radial-gradient(1px 1px at 11% 75%, #fff       0%, transparent 100%),
        radial-gradient(1px 1px at 16%  4%, #7fffd4    0%, transparent 100%),
        radial-gradient(1px 1px at 20% 38%, #fff       0%, transparent 100%),
        radial-gradient(1px 1px at 24% 65%, #c8b8ff    0%, transparent 100%),
        radial-gradient(1px 1px at 28% 55%, #c8b8ff    0%, transparent 100%),
        radial-gradient(1px 1px at 33% 18%, #fff       0%, transparent 100%),
        radial-gradient(1px 1px at 40% 82%, #ffcc66    0%, transparent 100%),
        radial-gradient(1px 1px at 44% 44%, #c8b8ff    0%, transparent 100%),
        radial-gradient(1px 1px at 47% 90%, #fff       0%, transparent 100%),
        radial-gradient(1px 1px at 52%  3%, #7fffd4    0%, transparent 100%),
        radial-gradient(1px 1px at 56% 30%, #fff       0%, transparent 100%),
        radial-gradient(1px 1px at 60% 15%, #7fffd4    0%, transparent 100%),
        radial-gradient(1px 1px at 65% 68%, #c8b8ff    0%, transparent 100%),
        radial-gradient(1px 1px at 69% 92%, #fff       0%, transparent 100%),
        radial-gradient(1px 1px at 73% 70%, #fff       0%, transparent 100%),
        radial-gradient(1px 1px at 77% 25%, #c8b8ff    0%, transparent 100%),
        radial-gradient(1px 1px at 81% 55%, #fff       0%, transparent 100%),
        radial-gradient(1px 1px at 85% 12%, #ffcc66    0%, transparent 100%),
        radial-gradient(1px 1px at 88% 42%, #ffcc66    0%, transparent 100%),
        radial-gradient(1px 1px at 92% 80%, #c8b8ff    0%, transparent 100%),
        radial-gradient(1px 1px at 96%  5%, #fff       0%, transparent 100%);
      animation-duration: 6s;
      animation-delay: 2s;
    }

    /* Extra star layers for density */
    .bg-stars-extra {
      position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden;
      animation: twinkle 5s 1s ease-in-out infinite;
    }
    .bg-stars-extra::before {
      content: ''; position: absolute; inset: 0;
      background-image:
        radial-gradient(1px 1px at  9% 33%, #fff8    0%, transparent 100%),
        radial-gradient(1px 1px at 17% 18%, #c8b8ff88 0%, transparent 100%),
        radial-gradient(1px 1px at 23% 91%, #fff8    0%, transparent 100%),
        radial-gradient(1px 1px at 31% 44%, #7fffd488 0%, transparent 100%),
        radial-gradient(1px 1px at 37% 67%, #fff8    0%, transparent 100%),
        radial-gradient(1px 1px at 43% 11%, #c8b8ff88 0%, transparent 100%),
        radial-gradient(1px 1px at 49% 58%, #fff8    0%, transparent 100%),
        radial-gradient(1px 1px at 54% 77%, #ffcc6688 0%, transparent 100%),
        radial-gradient(1px 1px at 59% 22%, #fff8    0%, transparent 100%),
        radial-gradient(1px 1px at 64% 46%, #c8b8ff88 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 84%, #fff8    0%, transparent 100%),
        radial-gradient(1px 1px at 76% 13%, #7fffd488 0%, transparent 100%),
        radial-gradient(1px 1px at 83% 62%, #fff8    0%, transparent 100%),
        radial-gradient(1px 1px at 89% 35%, #c8b8ff88 0%, transparent 100%),
        radial-gradient(1px 1px at 94% 88%, #fff8    0%, transparent 100%);
    }

    /* Third dense layer */
    .bg-stars-deep {
      position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden;
      animation: twinkle 8s 3s ease-in-out infinite;
    }
    .bg-stars-deep::before {
      content: ''; position: absolute; inset: 0;
      background-image:
        radial-gradient(1px 1px at  2% 15%, #ffffff66 0%, transparent 100%),
        radial-gradient(1px 1px at  6% 42%, #c8b8ff55 0%, transparent 100%),
        radial-gradient(1px 1px at 10% 68%, #ffffff55 0%, transparent 100%),
        radial-gradient(1px 1px at 13%  2%, #7fffd444 0%, transparent 100%),
        radial-gradient(1px 1px at 19% 57%, #ffffff66 0%, transparent 100%),
        radial-gradient(1px 1px at 25% 83%, #c8b8ff55 0%, transparent 100%),
        radial-gradient(1px 1px at 29%  9%, #ffffff55 0%, transparent 100%),
        radial-gradient(1px 1px at 34% 36%, #ffcc6655 0%, transparent 100%),
        radial-gradient(1px 1px at 39% 74%, #ffffff66 0%, transparent 100%),
        radial-gradient(1px 1px at 45% 20%, #c8b8ff55 0%, transparent 100%),
        radial-gradient(1px 1px at 48% 96%, #ffffff44 0%, transparent 100%),
        radial-gradient(1px 1px at 53% 48%, #7fffd444 0%, transparent 100%),
        radial-gradient(1px 1px at 57% 10%, #ffffff66 0%, transparent 100%),
        radial-gradient(1px 1px at 61% 79%, #c8b8ff55 0%, transparent 100%),
        radial-gradient(1px 1px at 66% 26%, #ffffff55 0%, transparent 100%),
        radial-gradient(1px 1px at 72% 53%, #ffcc6655 0%, transparent 100%),
        radial-gradient(1px 1px at 74%  1%, #ffffff66 0%, transparent 100%),
        radial-gradient(1px 1px at 78% 87%, #c8b8ff55 0%, transparent 100%),
        radial-gradient(1px 1px at 84% 33%, #ffffff55 0%, transparent 100%),
        radial-gradient(1px 1px at 87% 64%, #7fffd444 0%, transparent 100%),
        radial-gradient(1px 1px at 91% 17%, #ffffff66 0%, transparent 100%),
        radial-gradient(1px 1px at 93% 49%, #c8b8ff55 0%, transparent 100%),
        radial-gradient(1px 1px at 97% 76%, #ffffff55 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at  4% 89%, #ffcc6666 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 36% 61%, #c8b8ffaa 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 67% 40%, #7fffd4aa 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 99% 22%, #ffffffaa 0%, transparent 100%);
    }

    /* Star burst effect */
    .bg-stars.star-burst::before,
    .bg-stars.star-burst::after,
    .bg-stars-extra.star-burst::before {
      animation: starBurst .7s ease-out forwards;
    }
    @keyframes starBurst {
      0%   { opacity: .55; filter: brightness(1); }
      25%  { opacity: 1;   filter: brightness(3.5) saturate(1.8); }
      65%  { opacity: 1;   filter: brightness(2.2) saturate(1.4); }
      100% { opacity: .55; filter: brightness(1); }
    }
    @keyframes twinkle {
      0%,100% { opacity:.55; } 50% { opacity:1; }
    }

    .bg-forest {
      position: fixed; bottom: 0; left: 0; width: 100%;
      z-index: 2; pointer-events: none;
    }

    .bg-fog {
      position: fixed; bottom: 0; left: -50%; width: 200%; height: 110px;
      z-index: 3; pointer-events: none;
      background: linear-gradient(to top, #07071088 0%, transparent 100%);
      animation: fogDrift 22s linear infinite;
    }
    @keyframes fogDrift {
      from { transform:translateX(0); }
      to   { transform:translateX(25%); }
    }

    /* ── LAYOUT ──────────────────────────────────── */
    .page {
      position: relative; z-index: 10;
      max-width: 820px; margin: 0 auto;
      padding: 3rem 1.5rem 8rem;
    }

    /* ── GLASS CARD ──────────────────────────────── */
    .glass {
      background: linear-gradient(135deg, #1a153088 0%, #0e0b1a99 100%);
      border: 1px solid #c8b8ff22;
      border-radius: var(--radius-lg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      position: relative; overflow: hidden;
    }
    .glass::before {
      content: '';
      position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background: linear-gradient(135deg, #c8b8ff08 0%, transparent 55%);
    }

    /* ── HEADER ──────────────────────────────────── */
    .profile-header {
      text-align: center; margin-bottom: 2.75rem;
      animation: riseIn .9s cubic-bezier(.16,1,.3,1) both;
    }

    /* ── BOO-MOON IMAGE — PULSATING GLOW ─────────── */
    .moon-orb {
      width: 160px; height: 160px;
      margin: 0 auto 1.2rem;
      position: relative;
      display: flex; align-items: center; justify-content: center;
      animation: orbFloat 5s ease-in-out infinite;
    }
    .moon-orb img {
      width: 160px; height: 160px;
      object-fit: contain;
      display: block;
      position: relative; z-index: 2;
      animation: moonImgGlow 3.5s ease-in-out infinite;
    }
    /* Outer halo ring for extra depth */
    .moon-orb::after {
      content: '';
      position: absolute; inset: -20px;
      border-radius: 50%;
      background: radial-gradient(circle, #c8b8ff22 0%, transparent 70%);
      animation: moonHalo 3.5s ease-in-out infinite;
      z-index: 1;
    }

   @keyframes moonImgGlow {
     0%,100% {
      filter:
        drop-shadow(0 0 8px #c8b8ffaa)
        drop-shadow(0 0 18px #c8b8ff88)
        drop-shadow(0 0 35px #c8b8ff33)
        drop-shadow(0 0 3px #ffffff55);
   }
     50% {
      filter:
        drop-shadow(0 0 14px #ffffffcc)
        drop-shadow(0 0 30px #ddd0ffbb)
        drop-shadow(0 0 55px #c8b8ff66)
        drop-shadow(0 0 5px #ffffff88);
   }
 }
    
    @keyframes moonHalo {
      0%,100% { opacity: 0.4; transform: scale(1); }
      50%      { opacity: 0.9; transform: scale(1.15); }
    }
    @keyframes orbFloat {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-9px); }
    }

    /* ── HEADER TEXT — BOLD + WHITE ──────────────── */
    .h-en {
      font-family: var(--font-title); font-size: clamp(1.4rem,5vw,2.1rem);
      color: #ffffff;
      font-weight: 700;
      text-shadow: 0 0 30px #c8b8ffcc, 0 0 60px #c8b8ff66, 0 2px 4px rgba(0,0,0,.5);
      line-height: 1.2; letter-spacing: .06em;
    }
    .h-jp    { font-size: 1.1rem; font-weight: 900; color: #f0ecff; margin-top:.3rem; letter-spacing:.12em; text-shadow: 0 0 16px #c8b8ff88; }
    .h-kanji { font-size: .85rem; color: #c4b8e8; font-weight: 800; letter-spacing:.2em; margin-top:.1rem; text-shadow: 0 0 10px #c8b8ff55; }

    /* ── BACK BUTTON — GLOWING ───────────────────── */
    .back-btn {
      display: inline-flex; align-items: center; gap: .4rem;
      margin-top: 1.1rem; padding: .55rem 1.4rem; border-radius: 99px;
      border: 1.5px solid #c8b8ffaa;
      background: linear-gradient(135deg, #c8b8ff22, #9d80ff14);
      color: #ffffff;
      font-family: var(--font-jp); font-size: .86rem; font-weight: 900;
      cursor: pointer; text-decoration: none;
      transition: all .25s;
      box-shadow:
        0 0 18px #c8b8ff55,
        0 0 40px #c8b8ff22,
        0 0 70px #c8b8ff11,
        inset 0 1px 0 #c8b8ff33;
      animation: backBtnPulse 3s ease-in-out infinite;
    }
    @keyframes backBtnPulse {
      0%,100% { box-shadow: 0 0 18px #c8b8ff55, 0 0 40px #c8b8ff22, 0 0 70px #c8b8ff11, inset 0 1px 0 #c8b8ff33; }
      50%      { box-shadow: 0 0 28px #c8b8ffaa, 0 0 60px #c8b8ff44, 0 0 100px #c8b8ff22, inset 0 1px 0 #c8b8ff55; }
    }
    .back-btn:hover {
      border-color: #ffffff;
      color: #fff;
      background: linear-gradient(135deg, #c8b8ff38, #9d80ff22);
      box-shadow: 0 0 32px #c8b8ffcc, 0 0 70px #c8b8ff55, 0 0 120px #c8b8ff22, inset 0 1px 0 #c8b8ff66;
      transform: translateY(-2px);
      animation: none;
    }
    .back-btn:active { transform: scale(.96); }

    /* ── SECTION EYEBROW ─────────────────────────── */
    .eyebrow {
      display: flex; align-items: baseline; gap: .55rem; margin-bottom: 1rem;
    }
    .ey-en {
      font-family: var(--font-title); font-size: .65rem;
      letter-spacing: .18em; text-transform: uppercase;
      color: #ffffff; font-weight: 700;
      text-shadow: 0 0 14px #c8b8ffcc;
    }
    .ey-jp    { font-family: var(--font-jp); font-size: .78rem; font-weight: 800; color: #e8e4ff; }
    .ey-kanji { font-family: var(--font-jp); font-size: .68rem; font-weight: 800; color: #c4bce0; }
    .ey-line  { flex:1; height:1px; background: linear-gradient(90deg,#c8b8ff55,transparent); }

    /* ── TOTALS ──────────────────────────────────── */
    .totals-bar {
      display: grid; grid-template-columns: repeat(3,1fr);
      gap: .7rem; margin-bottom: 2rem;
      animation: riseIn .9s .1s cubic-bezier(.16,1,.3,1) both;
    }

    .total-card {
      padding: 1.1rem .7rem; text-align: center;
      transition: transform .2s;
    }
    .total-card:hover { transform: translateY(-3px); }
    .total-card::after {
      content: ''; position: absolute;
      bottom:0; left:12%; right:12%; height:1px; border-radius:99px;
    }
    .tc-stars::after  { background:var(--glow-amber); box-shadow:0 0 8px var(--glow-amber); }
    .tc-done::after   { background:var(--glow-teal);  box-shadow:0 0 8px var(--glow-teal); }
    .tc-unlock::after { background:var(--glow-moon);  box-shadow:0 0 8px var(--glow-moon); }

    .tv {
      font-family: var(--font-title); font-size: clamp(1.2rem,4vw,1.9rem); line-height:1.1; margin-bottom:.35rem;
      font-weight: 700;
    }
    .tc-stars  .tv { color:#ffd966; text-shadow:0 0 22px #ffcc6699; }
    .tc-done   .tv { color:#5cffd0; text-shadow:0 0 22px #7fffd499; }
    .tc-unlock .tv { color:#ddd0ff; text-shadow:0 0 22px #c8b8ff99; }

    .t-icon { font-size:1.05rem; margin-bottom:.25rem; }
    .t-tri  { display:flex; flex-direction:column; gap:.05rem; align-items:center; }
    .t-en   { font-family:var(--font-title); font-size:.62rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
    .t-jp   { font-size:.78rem; font-weight:800; color: #e0d8ff; }
    .t-k    { font-size:.66rem; color:#c4bce0; font-weight:800; }
    .tc-stars  .t-en { color:#ffd966; }
    .tc-done   .t-en { color:#5cffd0; }
    .tc-unlock .t-en { color:#ddd0ff; }

    /* ── ACCORDION BASE ──────────────────────────── */
    .accordion-wrap { margin-bottom: .85rem; }

    .accordion-trigger {
      width: 100%; text-align: left;
      background: transparent; border: none; cursor: pointer;
      padding: 0; display: block;
      -webkit-tap-highlight-color: transparent;
    }

    .accordion-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.1rem 1.35rem; border-radius: var(--radius-lg);
      transition: background .2s;
    }
    .accordion-trigger[aria-expanded="true"] .accordion-header {
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }
    .accordion-trigger:hover .accordion-header { background: #c8b8ff0f; }

    .acc-chevron {
      font-size: .75rem; color: #c4bce0; flex-shrink: 0; margin-left: .5rem;
      transition: transform .32s cubic-bezier(.34,1.56,.64,1), color .2s;
      display: inline-block;
    }
    .accordion-trigger[aria-expanded="true"] .acc-chevron {
      transform: rotate(180deg); color: #ffffff;
    }

    .accordion-body {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows .38s cubic-bezier(.16,1,.3,1);
      overflow: hidden;
    }
    .accordion-body.open {
      grid-template-rows: 1fr;
    }
    .accordion-inner {
      overflow: hidden;
      min-height: 0;
    }

    /* ── ACCORDION SHIMMER ON OPEN ───────────────── */
    @keyframes accordionShimmer {
      0%   { left: -100%; }
      60%, 100% { left: 160%; }
    }
    .accordion-body.open .accordion-shimmer {
      animation: accordionShimmer .8s .05s ease-out both;
    }
    .accordion-shimmer {
      position: absolute; top: 0; left: -100%;
      width: 55%; height: 100%; pointer-events: none;
      background: linear-gradient(90deg, transparent, #c8b8ff18, #fff10a, #c8b8ff18, transparent);
      z-index: 2; border-radius: inherit;
    }

    /* ── CURRICULUM ACCORDION ────────────────────── */
    .curr-section { margin-bottom:2rem; animation:riseIn .9s .2s cubic-bezier(.16,1,.3,1) both; }

    .curr-card-acc {
      margin-bottom: 0;
      border-radius: var(--radius-lg);
      overflow: hidden;
      position: relative;
    }
    .curr-card-acc .accordion-body .accordion-inner {
      padding: 0 1.35rem 1.15rem;
    }

    .curr-badge { display:flex; align-items:center; gap:.65rem; }

    .orb {
      width: 38px; height: 38px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center;
      font-family: var(--font-title); font-size: .64rem; font-weight: 700; flex-shrink: 0;
    }
    /* BOLD curriculum orb colors */
    .orb-bc {
      background: radial-gradient(circle at 35% 35%, #eafff5, #12cc60);
      box-shadow: 0 0 22px #4dffa088, 0 0 44px #4dffa033;
      color: #041a0e;
    }
    .orb-br {
      background: radial-gradient(circle at 35% 35%, #dceeff, #1255ee);
      box-shadow: 0 0 22px #66bbff88, 0 0 44px #66bbff33;
      color: #040a1a;
    }
    .orb-pb {
      background: radial-gradient(circle at 35% 35%, #f5ddff, #8811ee);
      box-shadow: 0 0 22px #cc66ff88, 0 0 44px #cc66ff33;
      color: #150822;
    }

    /* BOLD curriculum name colors */
    .curr-name-en { font-family:var(--font-title); font-size:.74rem; font-weight:700; letter-spacing:.08em; }
    .curr-name-jp { font-size:.77rem; font-weight:800; color: #e0d8ff; }
    .curr-name-k  { font-size:.65rem; color: #c4bce0; font-weight:800; }

    .c-bc { color: #22ff88; text-shadow: 0 0 18px #22ff8899; }
    .c-br { color: #44aaff; text-shadow: 0 0 18px #44aaff99; }
    .c-pb { color: #cc55ff; text-shadow: 0 0 18px #cc55ff99; }

    .curr-stars { font-family:var(--font-title); font-size:.8rem; font-weight:700; color:#ffd966; text-shadow:0 0 14px #ffcc6688; }

    .prog-track { height:6px; background:#c8b8ff14; border-radius:99px; overflow:hidden; margin-bottom:.85rem; }
    .prog-fill  { height:100%; border-radius:99px; width:0%; transition:width 1.1s cubic-bezier(.34,1.56,.64,1); }
    .pf-bc { background:linear-gradient(90deg,#12cc60,#4dffa0); box-shadow:0 0 9px #4dffa0cc; }
    .pf-br { background:linear-gradient(90deg,#1255ee,#44aaff); box-shadow:0 0 9px #44aaffcc; }
    .pf-pb { background:linear-gradient(90deg,#8811ee,#cc55ff); box-shadow:0 0 9px #cc55ffcc; }

    .game-rows  { display:flex; flex-direction:column; gap:.28rem; }
    .game-row   {
      display:grid; grid-template-columns:1.3rem 1fr auto auto;
      align-items:center; gap:.55rem;
      padding:.45rem .65rem; border-radius:8px;
      background:#c8b8ff05; border:1px solid transparent;
      transition:background .15s, border-color .15s;
    }
    .game-row:hover { background:#c8b8ff0d; border-color:#c8b8ff16; }
    .game-row.done  { background:#7fffd406; border-color:#7fffd416; }

    .row-chk { font-size:.82rem; text-align:center; line-height:1; }
    .row-names { overflow:hidden; }
    .rn-en {
      font-family:var(--font-title); font-size:.66rem; font-weight:700; letter-spacing:.04em;
      color: #ffffff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .game-row.done .rn-en { color:var(--glow-teal); }
    .rn-jp {
      font-size:.66rem; font-weight:800; color: #c4bce0;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .row-stars { display:flex; gap:1px; }
    .sp { font-size:.62rem; opacity:.18; transition:opacity .2s; }
    .sp.lit { opacity:1; filter:drop-shadow(0 0 3px #ffcc66); }
    .row-sc {
      font-family:var(--font-title); font-size:.64rem; font-weight:700;
      color: #c4bce0; min-width:2rem; text-align:right;
    }
    .game-row.done .row-sc { color: #e0e8ff; }

    /* ── ACHIEVEMENTS ACCORDION ──────────────────── */
    .unlock-section { margin-bottom:2rem; animation:riseIn .9s .3s cubic-bezier(.16,1,.3,1) both; }

    .unlocks-acc-card {
      border-radius: var(--radius-lg);
      overflow: hidden;

    }
    .unlocks-acc-card .accordion-body .accordion-inner {
      padding: 0 1rem 1rem;

    .u-chip {
      display:flex; align-items:center; gap:.6rem;
      padding:.65rem .8rem; border-radius:var(--radius);

    /* ── ANIMATION ───────────────────────────────── */
    @keyframes riseIn {
      from { opacity:0; transform:translateY(22px); }
      to   { opacity:1; transform:translateY(0); }
    }

    @media (max-width:500px) {

  </style>
</head>

/* ── STAR BURST helper ───────────────────────────────────────────────── */
function triggerStarBurst() {
  const stars = [
    document.querySelector('.bg-stars'),
    document.querySelector('.bg-stars-extra'),
  ];
  stars.forEach(el => {
    if (!el) return;
    el.classList.remove('star-burst');
    el.offsetHeight;
    el.classList.add('star-burst');
    el.addEventListener('animationend', () => el.classList.remove('star-burst'), { once: true });
  });
}

/* ── ACCORDION LOGIC ─────────────────────────────────────────────────── */
function initAccordion(triggerId, bodyId) {
  const trigger = document.getElementById(triggerId);
  const body    = document.getElementById(bodyId);
  if (!trigger || !body) return;

  const card    = trigger.closest('.glass');
  const shimmer = card ? card.querySelector('.accordion-shimmer') : null;

  trigger.addEventListener('click', () => {
    const expanded = trigger.getAttribute('aria-expanded') === 'true';
    trigger.setAttribute('aria-expanded', String(!expanded));
    body.classList.toggle('open', !expanded);

    if (!expanded) {
      if (shimmer) {
        shimmer.style.animation = 'none';
        shimmer.offsetHeight;
        shimmer.style.animation = '';
      }
      triggerStarBurst();
    }
  });
}

/* ── GAME DATA ───────────────────────────────────────────────────────── */
const GAME_JP = {
  ask_sentence:   { jp:'しつもんをする',   k:'質問文' },
  say_sentence:   { jp:'ぶんをいう',       k:'文を言う' },
  say_word:       { jp:'たんごをいう',     k:'単語を言う' },
  sentence_order: { jp:'ぶんならべかえ',   k:'文の順序' },
  sentence_speed: { jp:'すぴーどぶん',     k:'速文' },
  sentence_tap:   { jp:'ぶんをたっぷ',     k:'文タップ' },
  spell_word:     { jp:'もじをかく',       k:'綴り' },
  vocab_speed:    { jp:'すぴーどごい',     k:'速語彙' },
  vocab_tap:      { jp:'ごいをたっぷ',     k:'語彙タップ' },
};

const CURR_INFO = {
  bc:{ en:'BC Curriculum', jp:'BCカリキュラム', k:'BC課程', cc:'c-bc', oc:'orb-bc', fc:'pf-bc' },
  br:{ en:'BR Curriculum', jp:'BRカリキュラム', k:'BR課程', cc:'c-br', oc:'orb-br', fc:'pf-br' },
  pb:{ en:'PB Curriculum', jp:'PBカリキュラム', k:'PB課程', cc:'c-pb', oc:'orb-pb', fc:'pf-pb' },
};

const UNLOCK_META = {
  first_game:              { icon:'🌟', jp:'さいしょのゲーム', k:'初ゲーム' },
  any_curriculum_complete: { icon:'🎓', jp:'カリキュラムかんりょう', k:'課程完了' },
  all_complete:            { icon:'👑', jp:'ぜんぶかんりょう', k:'全完了' },
};
function uMeta(id) {
  if (UNLOCK_META[id]) return UNLOCK_META[id];
  if (id.includes('all_complete')) return { icon:'🏆', jp:'チャンピオン', k:'王者' };
  return { icon:'✅', jp:'クリア', k:'完了' };
}

function starsHTML(n, max=3) {
  return Array.from({length:max}, (_,i) =>
    `<span class="sp ${i < n ? 'lit' : ''}">★</span>`
  ).join('');
}

function setStatus(msg, type='') {
  const el = document.getElementById('prof-status');
  el.textContent = msg;
  el.className = `prof-status ${type ? 's-'+type : ''}`;
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.textContent=''; el.className='prof-status'; }, 3500);
}

/* ── RENDER ──────────────────────────────────────────────────────────── */
function render() {
  const S = BoohaAdventure.scores;
  const U = BoohaAdventure.unlocks;
  const R = BoohaAdventure.registry;

  // ── Totals bar — Weekly Stars / Weekly Complete / All-Time Stars ──────
  const wStars     = S.weeklyStars();
  const wMax       = 27 * 3; // 27 games × 3 stars max
  const wCompleted = S.weeklyCompleted();
  const allTime    = S.allTimeStars();
  const allUnlocks = U.getAll();

  document.getElementById('total-stars').textContent     = `${wStars}/${wMax}`;
  document.getElementById('total-completed').textContent = `${wCompleted}/27`;
  document.getElementById('total-alltime').textContent   = allTime;

  // ── Curriculum cards — read from WEEKLY data ──────────────────────────
  const cont = document.getElementById('curr-cards');
  cont.innerHTML = '';

  R.CURRICULUMS.forEach(c => {
    const ci    = CURR_INFO[c];
    const cs    = S.weeklySummaryFor(c);   // ← weekly, not permanent
    const pct   = cs.totalGames > 0 ? Math.round(cs.completed / cs.totalGames * 100) : 0;
    const accId  = `acc-curr-${c}`;
    const bodyId = `acc-curr-body-${c}`;

    const wrap = document.createElement('div');
    wrap.className = 'accordion-wrap';
    wrap.innerHTML = `
      <div class="glass curr-card-acc">
        <div class="accordion-shimmer"></div>
        <button class="accordion-trigger" aria-expanded="false" id="${accId}">
          <div class="accordion-header">
            <div class="curr-badge">
              <div class="orb ${ci.oc}">${c.toUpperCase()}</div>
              <div>
                <div class="curr-name-en ${ci.cc}">${ci.en}</div>
                <div class="curr-name-jp">${ci.jp} <span class="curr-name-k">${ci.k}</span></div>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:.7rem;">
              <span class="curr-stars">⭐ ${cs.stars}/${cs.totalStars}</span>
              <span class="acc-chevron">▼</span>
            </div>
          </div>
        </button>
        <div class="accordion-body" id="${bodyId}">
          <div class="accordion-inner">
            <div class="prog-track">
              <div class="prog-fill ${ci.fc}" data-target="${pct}"></div>
            </div>
            <div class="game-rows">
              ${cs.entries.map(e => {
                const gj = GAME_JP[e.id] || { jp: e.name, k: '' };
                return `<div class="game-row ${e.completed ? 'done' : ''}">
                  <span class="row-chk">${e.completed ? '✅' : '☐'}</span>
                  <div class="row-names">
                    <div class="rn-en">${e.name}</div>
                    <div class="rn-jp">${gj.jp}　${gj.k}</div>
                  </div>
                  <div class="row-stars">${starsHTML(e.stars)}</div>
                  <div class="row-sc">${e.highScore > 0 ? e.highScore : '—'}</div>
                </div>`;
              }).join('')}
            </div>
          </div>
        </div>
      </div>`;
    cont.appendChild(wrap);
    initAccordion(accId, bodyId);
  });

  requestAnimationFrame(() => {
    document.querySelectorAll('.prog-fill[data-target]').forEach(el => {
      el.style.width = el.dataset.target + '%';
    });
  });

  // ── Achievements accordion — permanent, unchanged ─────────────────────
  const grid = document.getElementById('unlocks-grid');
  grid.innerHTML = '';
  [...allUnlocks].sort((a, b) => b.unlocked - a.unlocked).forEach(u => {
    const m = uMeta(u.id);
    const chip = document.createElement('div');
    chip.className = `u-chip ${u.unlocked ? 'earned' : ''}`;
    chip.innerHTML = `
      <span class="u-icon">${u.unlocked ? m.icon : '🔒'}</span>
      <div class="u-text">
        <div class="u-en">${u.name}</div>
        <div class="u-jp">${m.jp}　<span style="font-size:.56rem">${m.k}</span></div>
        <div class="u-desc">${u.description}</div>
      </div>`;
    grid.appendChild(chip);
  });
}

/* ── BOOT ────────────────────────────────────────────────────────────── */
document.addEventListener('booha:ready', () => {
  render();

  initAccordion('acc-achievements-trigger', 'acc-achievements-body');

  document.getElementById('btn-show-code').onclick  = () => BoohaMemoryCodeUI.showCode();
  document.getElementById('btn-enter-code').onclick = () => BoohaMemoryCodeUI.promptEnterCode();
  document.getElementById('btn-export').onclick = () => {
    BoohaSaveUtils.downloadSaveFile();
    setStatus('セーブファイルをダウンロードしました ✓', 'ok');
  };
  document.getElementById('btn-import').onclick = async () => {
    const { ok, error } = await BoohaSaveUtils.uploadSaveFile();
    if (ok) { setStatus('セーブをよみこみました ✓', 'ok'); render(); }
    else     setStatus(`よみこみしっぱい: ${error}`, 'err');
  };
  document.getElementById('btn-reset').onclick = () => {
    const ok = BoohaSaveUtils.resetAll(true);
    if (ok) { setStatus('ぼうけんをリセットしました', 'warn'); setTimeout(render, 400); }
  };

  document.addEventListener('booha:saved',       render);
  document.addEventListener('booha:reset',        render);
  document.addEventListener('booha:weeklyReset',  render);
});
</script>  


</body>
</html>
