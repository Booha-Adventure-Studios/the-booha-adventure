
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ぼうけんログ — Adventure Log</title>

  <!-- ═══ PWA ═══════════════════════════════════════════════ -->
  <link rel="manifest" href="/the-booha-adventure/manifest.json">
  <meta name="theme-color" content="#14100a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Booha Adventure">
  <link rel="apple-touch-icon" href="/the-booha-adventure/icons/icon-512.png">
  <!-- ═══════════════════════════════════════════════════════ -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

  <!-- ═══ TOKEN GATE ════════════════════════════════════════ -->
  <style>
    html.token-checking,
    html.token-checking body {
      background: #000;
      visibility: hidden;
    }
  </style>
  <script>document.documentElement.classList.add('token-checking');</script>
  <script src="./js/token.js"></script>
  <!-- ═══════════════════════════════════════════════════════ -->

  <style>
    /* ═══ THE OPEN JOURNAL ═══════════════════════════════════
       Leather:  #14100a  #241a10
       Paper:    #efe1c2  #e6d5ae
       Ink:      #3a2c1a
       Wax/gold: #b8892f  #ffd700
       Blitz:    #0e6f7a (teal ink)
       Honesty:  #b03434 (red ink)                              */

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% -10%, #2c2014 0%, transparent 55%),
        repeating-linear-gradient(115deg, rgba(0,0,0,.16) 0 2px, transparent 2px 7px),
        #14100a;
      font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif;
      font-weight: 700;
      color: #3a2c1a;
      padding: 14px 10px 40px;
      -webkit-font-smoothing: antialiased;
    }


  .dc-wk{margin:6px 0 4px;}
    .dc-row{display:flex;justify-content:space-between;gap:4px;margin-bottom:14px;}
    .dc-day{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;}
    .dc-dow{font-size:11px;color:#7a603a;font-weight:700;}
    .dc-dot{width:26px;height:26px;border-radius:50%;border:2px dashed rgba(58,44,26,.4);
      display:flex;align-items:center;justify-content:center;font-size:13px;color:#8a7048;}
    .dc-dot.done{border:3px double #2e7d4f;color:#1f5c39;background:radial-gradient(circle at 50% 42%,rgba(64,150,98,.30),rgba(64,150,98,.07) 70%);}
    .dc-dot.skip{border-style:solid;border-color:rgba(58,44,26,.35);color:#b09068;}
    .dc-dot.future{opacity:.35;}
    .dc-dot.today{box-shadow:0 0 0 2px #b8892f;}
    .dc-stats{display:flex;gap:10px;justify-content:center;}
    .dc-stat{flex:1;max-width:120px;text-align:center;padding:8px 6px;border:1px solid #4a3820;border-radius:8px;}
    .dc-stat b{display:block;font-size:22px;color:#3a2c1a;line-height:1;}
    .dc-stat.accuracy b{font-size:clamp(14px,3.5vw,19px);white-space:nowrap;}
    .dc-stat .lab{font-size:10px;color:#7a603a;letter-spacing:1px;margin-top:4px;font-weight:700;}
    .dc-empty{color:#7a603a;font-size:14px;padding:6px 0 14px;}
    .dc-today{
      margin:14px auto 2px;padding:13px 14px;max-width:520px;border:2px solid rgba(58,44,26,.55);
      border-radius:12px;background:rgba(255,255,255,.16);text-align:center;
    }
    .dc-today-kicker{
      color:#7a603a;font-family:'Cinzel Decorative',serif;font-size:9px;
      letter-spacing:2px;margin-bottom:5px;
    }
    .dc-today-score{color:#3a2c1a;font-size:clamp(17px,4.5vw,22px);font-weight:900;line-height:1.35;}
    .dc-today-meta{color:#7a603a;font-size:10px;letter-spacing:1px;margin-top:3px;}
    .dc-today-action{
      appearance:none;border:0;border-radius:999px;margin-top:11px;padding:10px 18px;
      background:#3a2c1a;color:#efe1c2;font:900 12px/1.2 inherit;letter-spacing:.5px;
      cursor:pointer;box-shadow:0 3px 0 #1f160d;-webkit-tap-highlight-color:transparent;
    }
    .dc-today-action:active{transform:translateY(2px);box-shadow:0 1px 0 #1f160d;}
    .dc-today-action:disabled{opacity:.55;cursor:wait;}

    /* ── Juku weekly reports ── */
    .juku-log-empty {
      padding: 12px 4px 16px; color: #7a603a; text-align: center;
      font-size: 14px; line-height: 1.6;
    }
    .juku-log-list { display: grid; gap: 12px; }
    .juku-log-card {
      border: 2px solid rgba(58,44,26,.48); border-radius: 13px;
      background: rgba(255,255,255,.14); overflow: hidden;
    }
    .juku-log-head {
      appearance: none; width: 100%; border: 0; cursor: pointer;
      display: grid; grid-template-columns: 1fr auto; gap: 5px 12px;
      padding: 13px 14px; background: transparent; color: #3a2c1a;
      text-align: left; font: 900 14px/1.4 inherit;
    }
    .juku-log-date { color: #7a603a; font-size: 11px; font-weight: 700; }
    .juku-log-score { grid-row: 1 / 3; grid-column: 2; align-self: center;
      color: #8a5a1e; font-size: 26px; }
    .juku-log-status { grid-row: 1 / 3; grid-column: 2; align-self: center;
      color: #b03434; font-size: 12px; text-align: right; }
    .juku-log-body {
      display: none; padding: 0 14px 15px;
      border-top: 1px dashed rgba(58,44,26,.35);
    }
    .juku-log-body.open { display: block; }
    .juku-log-grid {
      display: grid; grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 7px; margin-top: 12px;
    }
    .juku-log-metric {
      padding: 8px; border-radius: 9px; background: rgba(58,44,26,.07);
    }
    .juku-log-metric b { display: block; font-size: 17px; }
    .juku-log-metric span { color: #7a603a; font-size: 10px; }
    .juku-log-subhead {
      margin: 13px 0 5px; color: #5c4626; font-size: 13px; font-weight: 900;
    }
    .juku-log-line { margin: 4px 0; color: #5c4626; font-size: 12px; line-height: 1.5; }
    .juku-log-strength { color: #1f5c39; }
    .juku-log-focus { color: #8a5a1e; }
    @media (max-width: 390px) {
      .juku-log-grid { grid-template-columns: 1fr; }
    }


    
    /* ── Close button (back to hub) ── */
    #alog-close {
      position: fixed; top: calc(10px + env(safe-area-inset-top, 0px));
      right: 12px; z-index: 80;
      width: 46px; height: 46px; border-radius: 50%;
      border: 2px solid #8a6a34; cursor: pointer;
      font-size: 26px; font-weight: 900; line-height: 1;
      color: #efe1c2;
      background: radial-gradient(circle at 38% 30%, #7a6030, #4a3820 80%);
      box-shadow: 0 3px 10px rgba(0,0,0,.5), inset 0 -4px 8px rgba(0,0,0,.35),
                  inset 0 3px 6px rgba(255,235,180,.25);
      -webkit-tap-highlight-color: transparent;
      transition: transform .12s ease;
    }
    #alog-close:active { transform: scale(.9); }

    /* ── Weekly world doors ──────────────────────────────────────────────── */
    #world-doors[hidden] { display: none; }
    #world-doors .world-door {
      position: fixed; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      z-index: 70; width: 86px; min-height: 102px; padding: 5px 4px 3px;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      border: 1px solid rgba(255,255,255,.16); border-radius: 15px;
      background: rgba(20,16,10,.84); color: #efe1c2; text-decoration: none;
      box-shadow: 0 5px 18px rgba(0,0,0,.55), inset 0 1px rgba(255,255,255,.14);
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
      -webkit-tap-highlight-color: transparent;
    }
    #world-doors .world-door:hover,
    #world-doors .world-door:focus-visible {
      transform: translateY(-4px) scale(1.03); outline: none;
    }
    #world-door-karasuki { left: 14px; border-color: rgba(184,137,47,.55); }
    #world-door-karasuki:hover, #world-door-karasuki:focus-visible {
      border-color: #d7aa4c; box-shadow: 0 0 22px rgba(184,137,47,.38), 0 6px 18px rgba(0,0,0,.55);
    }
    #world-door-utsuroba { right: 14px; border-color: rgba(91,194,231,.55); }
    #world-door-utsuroba:hover, #world-door-utsuroba:focus-visible {
      border-color: #8edfff; box-shadow: 0 0 22px rgba(70,188,235,.38), 0 6px 18px rgba(0,0,0,.55);
    }
    .world-door img {
      width: 69px; height: 69px; object-fit: contain; object-position: center bottom;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,.72));
    }
    #world-door-karasuki img { transform: scale(1.18); }
    #world-door-utsuroba img { transform: scale(.84); }
    .world-door-label {
      position: relative; z-index: 1; width: 100%; margin-top: -1px;
      font-family: 'Cinzel Decorative', serif; font-size: 8px; letter-spacing: 1px;
      line-height: 1.2; text-align: center; white-space: nowrap;
    }
    .world-door-label small { display: block; margin-top: 2px; color: #bca989; font-family: inherit; font-size: 8px; letter-spacing: .5px; }
    @media (max-width: 430px) {
      #world-doors .world-door { width: 72px; min-height: 86px; border-radius: 12px; }
      .world-door img { width: 57px; height: 57px; }
      .world-door-label { font-size: 7px; }
      .world-door-label small { font-size: 7px; }
      #world-door-karasuki { left: 8px; }
      #world-door-utsuroba { right: 8px; }
    }

    /* ── Leather header plate ── */
    .journal-plate {
      max-width: 680px; margin: 0 auto 14px; text-align: center;
      color: #e6cf9a; padding: 10px 8px 12px;
    }
    .journal-plate h1 {
      font-size: clamp(24px, 7vw, 38px);
      font-weight: 400;
      letter-spacing: 2px;
      text-shadow: 0 0 22px rgba(255,215,0,.28), 0 2px 0 rgba(0,0,0,.7);
    }
    .journal-plate .plate-en {
      font-family: 'Cinzel Decorative', serif;
      font-size: 11px; letter-spacing: 4px; color: #9c8352; margin-top: 2px;
    }

    /* ── The paper spread ── */
    .paper {
      max-width: 680px; margin: 0 auto;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(255,255,255,.35), transparent 40%),
        repeating-linear-gradient(0deg, transparent 0 30px, rgba(122,96,58,.10) 30px 31px),
        linear-gradient(160deg, #efe1c2, #e6d5ae 60%, #dcc99e);
      border-radius: 10px;
      border: 1px solid #4a3820;
      box-shadow:
        0 0 0 6px #241a10,
        0 0 0 8px #4a3820,
        0 18px 44px rgba(0,0,0,.65),
        inset 0 0 60px rgba(122,96,58,.25);
      padding: 22px 16px 26px;
      position: relative;
    }
    /* brass corners */
    .paper::before, .paper::after {
      content: ''; position: absolute; width: 26px; height: 26px;
      border: 3px solid #b8892f; opacity: .8;
    }
    .paper::before { top: -2px; left: -2px; border-right: none; border-bottom: none; border-radius: 8px 0 0 0; }
    .paper::after  { bottom: -2px; right: -2px; border-left: none; border-top: none; border-radius: 0 0 8px 0; }

    /* ── Section headers: handwritten ink rules ── */
    .ink-head {
      display: flex; align-items: baseline; gap: 10px;
      margin: 22px 2px 12px;
      border-bottom: 2px solid rgba(58,44,26,.55);
      padding-bottom: 4px;
    }
    .ink-head:first-of-type { margin-top: 4px; }
    .ink-head .jp { font-size: 20px; font-weight: 700; }
    .ink-head .en {
      font-family: 'Cinzel Decorative', serif;
      font-size: 10px; letter-spacing: 3px; color: #7a603a;
    }

    /* ═══ Adventure-log module reskin (ink & wax) ═══════════ */

    .alog-curr-tabs {
      display: flex; gap: 8px; margin-bottom: 14px; justify-content: center;
    }
    .alog-curr-tab {
      appearance: none; cursor: pointer;
      font-family: inherit; font-weight: 900; letter-spacing: 2px;
      font-size: 13px; padding: 6px 18px; border-radius: 999px;
      border: 2px dashed rgba(58,44,26,.45);
      background: transparent; color: #8a7048;
      -webkit-tap-highlight-color: transparent;
    }
    .alog-curr-tab.active {
      border: 2px solid #3a2c1a;
      background: #3a2c1a; color: #efe1c2;
      transform: rotate(-1.2deg);
    }

    .alog-stamps {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(94px, 1fr));
      gap: 10px;
    }
    .alog-stamp {
      aspect-ratio: 1; border-radius: 50%;
      border: 2px dashed rgba(58,44,26,.4);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1px;
      text-align: center; padding: 6px;
      color: #8a7048;
    }
    /* each stamp pressed slightly crooked */
    .alog-stamp:nth-child(3n)   { transform: rotate(2.4deg); }
    .alog-stamp:nth-child(3n+1) { transform: rotate(-2deg); }
    .alog-stamp:nth-child(4n)   { transform: rotate(1.2deg); }
    .alog-stamp.done,
    .alog-stamp.blitz.done {
      border: 3px double #2e7d4f;
      color: #1f5c39;
      background: radial-gradient(circle at 50% 42%, rgba(64,150,98,.30), rgba(64,150,98,.07) 70%);
      box-shadow: inset 0 0 12px rgba(46,125,79,.35);
    }
    .alog-stamp.done .alog-stamp-glyph {
      color: #d4a017;
      text-shadow: 0 1px 0 rgba(120,80,10,.5), 0 0 8px rgba(212,160,23,.55);
    }
    .alog-stamp-glyph { font-size: 18px; min-height: 22px; }
    .alog-stamp-label { font-size: 8.5px; letter-spacing: .4px; line-height: 1.15; }
    .alog-stamp-pct   { font-size: 13px; font-weight: 700; }

    .alog-count {
      text-align: center; margin: 14px 0 4px;
      font-size: 16px; color: #5c4626;
    }

    /* ── Weekly progress & score ── */
    .alog-progress { margin: 16px auto 4px; max-width: 440px; text-align: center; }
    .alog-progress-label { font-size: 19px; font-weight: 900; color: #3a2c1a; }
    .alog-bar {
      margin: 8px 0 6px; height: 18px; border-radius: 999px;
      border: 2px solid #8a7048; background: rgba(58,44,26,.08);
      overflow: hidden;
    }
    .alog-bar-fill {
      height: 100%; border-radius: 999px; min-width: 4px;
      background: linear-gradient(90deg, #7fb98f, #2e7d4f);
      transition: width 600ms ease;
    }
    .alog-bar-fill.full { background: linear-gradient(90deg, #e8b93c, #b8892f); }
    .alog-progress-en {
      font-family: 'Cinzel Decorative', serif;
      font-size: 10px; letter-spacing: 2px; color: #7a603a;
    }
    .alog-score {
      margin: 14px auto 4px; max-width: 440px; text-align: center;
      border: 3px double #b8892f; border-radius: 16px;
      padding: 12px 14px;
      background: radial-gradient(circle at 50% 20%, rgba(232,185,60,.28), rgba(232,185,60,.06) 75%);
    }
    .alog-score-pct { font-size: 46px; font-weight: 900; color: #8a5a1e;
                      text-shadow: 0 1px 0 rgba(255,245,200,.8); }
    .alog-score-jp  { font-size: 14px; font-weight: 900; color: #5c4626; }
    .alog-score-en  { font-family: 'Cinzel Decorative', serif;
                      font-size: 9px; letter-spacing: 2px; color: #7a603a; margin-top: 2px; }

    .alog-duels { margin-top: 14px; text-align: center; font-size: 14px; color: #5c4626; }
    .alog-duel-label { color: #a34d12; font-weight: 700; margin-right: 8px; }
    .alog-duel-item  { margin: 0 7px; }

    .alog-untouched {
      border: 3px dashed #b03434; border-radius: 12px;
      padding: 26px 12px; text-align: center; color: #b03434;
      transform: rotate(-.6deg);
      background: rgba(176,52,52,.05);
    }
    .alog-untouched-jp { font-size: 28px; font-weight: 700; }
    .alog-untouched-en { font-family: 'Cinzel Decorative', serif;
                         font-size: 10px; letter-spacing: 2px; margin-top: 4px; }

    /* ── Calendar: hand-ruled grid ── */
    .alog-cal-month { text-align: center; font-size: 18px; color: #5c4626; margin-bottom: 8px; }
    .alog-cal-grid  { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .alog-cal-dow   { text-align: center; font-size: 12px; color: #8a7048; padding-bottom: 2px; }
    .alog-cal-dow:first-child { color: #b03434; }
    .alog-cal-cell {
      aspect-ratio: 1; border-radius: 8px;
      border: 1px solid rgba(58,44,26,.3);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-size: 11px; color: #8a7048;
    }
    .alog-cal-cell.visited {
      border-color: #b8892f;
      background: rgba(184,137,47,.14); color: #6b4a16;
    }
    .alog-cal-cell.today  { outline: 2px solid #0e6f7a; outline-offset: 1px; }
    .alog-cal-cell.future { opacity: .35; }
    .alog-cal-cell.empty  { border: none; }
    .alog-cal-num   { line-height: 1.1; }
    .alog-cal-star {
      font-size: 15px; line-height: 1; color: #d4a017;
      text-shadow: 0 1px 0 rgba(120,80,10,.4);
    }
    .alog-cal-cell.played {
      border: 2px solid #2e7d4f;
      background: radial-gradient(circle at 50% 40%, rgba(64,150,98,.28), rgba(64,150,98,.06) 75%);
      color: #1f5c39;
    }
    .alog-cal-legend {
      text-align: center; margin-top: 10px;
      font-size: 12px; color: #7a603a;
    }
    .alog-legend-star  { color: #d4a017; font-size: 14px; }
    .alog-legend-visit { color: #b8892f; }
    .alog-streak {
      text-align: center; margin-top: 10px; min-height: 22px;
      font-size: 16px; color: #0b5661; font-weight: 700;
    }

    /* ── Past weeks: a row of wax blobs ── */
    .alog-term {
      margin: 2px auto 16px; max-width: 520px; text-align: center;
      border: 3px double #b8892f; border-radius: 14px; padding: 14px 16px;
      background: radial-gradient(circle at 50% 15%, rgba(232,185,60,.24), rgba(232,185,60,.05) 78%);
    }
    .alog-term-jp { color: #3a2c1a; font-size: 21px; font-weight: 900; line-height: 1.35; }
    .alog-term-en {
      margin-top: 4px; color: #7a603a; font-family: 'Cinzel Decorative', serif;
      font-size: 9px; letter-spacing: 1.3px; line-height: 1.5;
    }
    .alog-past-strip { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 8px; }
    .alog-past-seal {
      flex: 0 0 auto; width: 72px; height: 72px; border-radius: 50%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #efe1c2;
      background: radial-gradient(circle at 45% 35%, #7a6030, #55401e 80%);
      box-shadow: 0 2px 6px rgba(0,0,0,.3), inset 0 -4px 8px rgba(0,0,0,.3);
    }
    .alog-past-seal.gold {
      background: radial-gradient(circle at 45% 35%, #e8b93c, #8a5a1e 82%);
      color: #3a2510;
      box-shadow: 0 2px 10px rgba(184,137,47,.5), inset 0 -4px 8px rgba(90,55,10,.4);
    }
    .alog-past-seal.partial { filter: saturate(.55); }
    .alog-past-seal.missed {
      background: none; box-shadow: none;
      border: 2px dashed #b03434; color: #b03434;
    }
    .alog-past-pct  { font-weight: 700; font-size: 15px; }
    .alog-past-week { font-size: 8px; letter-spacing: 1px; opacity: .85;
                      font-family: 'Cinzel Decorative', serif; }
    .alog-past-empty { text-align: center; color: #8a7048; padding: 8px; font-size: 15px; }
  </style>
</head>
<body>

  <button id="alog-close" type="button" aria-label="もどる / Back to games">×</button>

  <div class="journal-plate">
    <h1 id="alog-title">ぼうけんログ</h1>
    <div class="plate-en">THE BOOHA ADVENTURE — RECORD OF DEEDS</div>
  </div>

 <div class="paper">
    <div class="ink-head">
      <span class="jp">まいにちチェック</span><span class="en">DAILY CHECK</span>
    </div>
    <div id="dc-week"></div>

    <div class="ink-head">
      <span class="jp">こんしゅう</span><span class="en">THIS WEEK</span>
    </div>
    <div id="alog-week"></div>

    <div id="juku-report-section">
      <div class="ink-head">
        <span class="jp">じゅくレポート</span><span class="en">JUKU REPORTS</span>
      </div>
      <div id="juku-report-log"></div>
    </div>

    <div class="ink-head">
      <span class="jp">ぼうけんカレンダー</span><span class="en">CALENDAR</span>
    </div>
    <div id="alog-calendar"></div>

    <div class="ink-head">
      <span class="jp">これまでのきろく</span><span class="en">PAST WEEKS</span>
    </div>
    <div id="alog-past"></div>
  </div>

  <!-- These doors are intentionally absent until the shared weekly gate opens. -->

<script>
  (function () {
    var doors = document.getElementById('world-doors');
    if (!doors) return;

    function renderWorldDoors() {
      var open = false;
      try {
        open = !!(window.BoohaUnlockSystem &&
          typeof BoohaUnlockSystem.isWeeklyWorldGateOpen === 'function' &&
          BoohaUnlockSystem.isWeeklyWorldGateOpen());
      } catch (_) {}
      doors.hidden = !open;
      doors.setAttribute('aria-hidden', open ? 'false' : 'true');
    }

    if (window.BOOHA_READY) renderWorldDoors();
    else document.addEventListener('booha:ready', renderWorldDoors, { once: true });
    document.addEventListener('booha:saved', renderWorldDoors);
    document.addEventListener('booha:weeklyReset', renderWorldDoors);
  })();
</script>
<script>
  (function () {
    function renderDailySummary() {
      var host = document.getElementById('dc-week');
      if (!host || !window.BoohaDailyCheck) return;
      var DOW = ['日','月','火','水','木','金','土'];
      var s;
      try { s = BoohaDailyCheck.weekSummary(); } catch (e) { return; }
      host.textContent = '';

      var row = document.createElement('div'); row.className = 'dc-row';
      s.days.forEach(function (d, i) {
        var cell = document.createElement('div'); cell.className = 'dc-day';
        var dow = document.createElement('div'); dow.className = 'dc-dow'; dow.textContent = DOW[i];
        var dot = document.createElement('div'); dot.className = 'dc-dot';
        if (d.st === 'done') { dot.classList.add('done'); dot.textContent = '✓'; }
        else if (d.st === 'skip') { dot.classList.add('skip'); dot.textContent = '·'; }
        else if (d.isFuture) { dot.classList.add('future'); }
        if (d.isToday) dot.classList.add('today');
        cell.appendChild(dow); cell.appendChild(dot); row.appendChild(cell);
      });

      var stats = document.createElement('div'); stats.className = 'dc-stats';
      function stat(value, label, extraClass) {
        var box = document.createElement('div');
        box.className = 'dc-stat' + (extraClass ? ' ' + extraClass : '');
        var b = document.createElement('b'); b.textContent = value;
        var l = document.createElement('div'); l.className = 'lab'; l.textContent = label;
        box.appendChild(b); box.appendChild(l); return box;
      }
      var accuracy = s.accuracyFirst == null ? '—' : s.accuracyFirst + '%';
      var accuracyLabel = 'せいかいりつ';
      if (s.hasRetakes && s.accuracyBest != null) {
        accuracy = s.accuracyFirst + '% → ' + s.accuracyBest + '%';
        accuracyLabel = 'さいしょ → ベスト';
      }
      stats.appendChild(stat(s.doneCount + '/' + s.total, 'こんしゅう'));
      stats.appendChild(stat('🔥 ' + s.streak, 'チェックれんぞく'));
      stats.appendChild(stat(accuracy, accuracyLabel, 'accuracy'));

      host.appendChild(row);
      host.appendChild(stats);

      // This card is about today's actual assessment. The weekly percentage
      // above stays an aggregate; the action below always opens today's check.
      var today = BoohaDailyCheck.todaySummary();
      var card = document.createElement('div'); card.className = 'dc-today';
      var kicker = document.createElement('div'); kicker.className = 'dc-today-kicker';
      kicker.textContent = 'きょう / TODAY'; card.appendChild(kicker);
      var score = document.createElement('div'); score.className = 'dc-today-score';
      var meta = document.createElement('div'); meta.className = 'dc-today-meta';
      var action = document.createElement('button');
      action.className = 'dc-today-action'; action.type = 'button';

      if (today.done) {
        if (today.first == null) score.textContent = '✓ COMPLETED';
        else score.textContent = today.hasRetakes
          ? today.first + '% → ' + today.best + '%'
          : today.first + '% · FIRST ATTEMPT';
        meta.textContent = today.attempts + (today.attempts === 1 ? ' ATTEMPT' : ' ATTEMPTS') +
          (today.curr ? ' · ' + today.curr.toUpperCase() : '');
        action.textContent = today.best >= 100
          ? 'れんしゅう / PRACTICE AGAIN'
          : 'もういちど / RETAKE TODAY';
      } else {
        score.textContent = 'まだ / NOT COMPLETED';
        meta.textContent = today.curr ? today.curr.toUpperCase() : '5 MINUTES';
        action.textContent = 'きょうのチェック / TAKE TODAY’S CHECK';
      }

      action.addEventListener('click', function () {
        action.disabled = true;
        BoohaDailyCheck.run({
          curr: today.done ? (today.curr || BoohaDailyCheck.knownCurr()) : null,
          mode: today.done ? 'retake' : 'check',
          recordSkipOnCancel: false,
          doneLabel: 'ログにもどる',
          onDone: renderDailySummary,
          onCancel: renderDailySummary
        });
      });
      card.appendChild(score); card.appendChild(meta); card.appendChild(action);
      host.appendChild(card);
    }

    // A borrowed device must finish cloud restoration before this summary
    // reads meta.checkIn; otherwise it can paint an empty local week forever.
    if (window.BOOHA_READY) renderDailySummary();
    else document.addEventListener('booha:ready', renderDailySummary, { once: true });
  })();
</script>
