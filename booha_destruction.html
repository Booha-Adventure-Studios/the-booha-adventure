

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Booha Destruction</title>
  <meta name="theme-color" content="#000000" />


<!-- ═══ TOKEN GATE ════════════════════════════════════════ -->
<style>
  html.token-checking,
  html.token-checking body {
    background: #000;
    visibility: hidden;
  }
</style>
  
<script>document.documentElement.classList.add('token-checking');</script>
  <script src="./js/token.js"></script>

  <!-- ═══ BONUS UNLOCK GATE ═════════════════════════════════
       Core stack must load here so the Monday weekly reset
       runs BEFORE we read the unlock. A raw localStorage
       check would honor last week's stale unlock.
       ⚠️ day-record.js is deliberately NOT loaded on bonus
       pages — reward play is never tracked. Do not add it. -->
  <style>
    html.bonus-checking,
    html.bonus-checking body {
      background: #000;
      visibility: hidden;
    }
  </style>
  <script>document.documentElement.classList.add('bonus-checking');</script>
  <script src="./js/calendar.js"></script>
  <script src="./js/core/adventure-core.js"></script>
  <script src="./js/core/save-file.js"></script>
  <script src="./js/sync-client.js"></script>
  <script src="./js/core/game-registry.js"></script>
  <script src="./js/core/score-system.js"></script>
  <script src="./js/core/unlock-system.js"></script>

  <!-- Adventure Save panel — same save/memory-code system as
       adventure-profile.html. day-record.js above stays excluded;
       none of these touch it. -->
  <script src="./js/core/save-utils.js"></script>
  <script src="./js/core/save-code.js"></script>
  <script src="./js/ui/memory-code-ui.js"></script>
  <script src="./js/ui/save-menu.js"></script>

  <script>
    (function () {
      'use strict';
      var GAME_ID = 'booha_destruction';
      var passed  = false;

      function fail() {
        window.location.replace('./index.html');
      }

      document.addEventListener('booha:ready', function () {
        try {
          if (window.BoohaUnlockSystem &&
              BoohaUnlockSystem.isBonusGameUnlocked(GAME_ID)) {
            passed = true;
            document.documentElement.classList.remove('bonus-checking');
            return;
          }
        } catch (e) {
          console.error('[BonusGate] Check failed:', e);
        }
        fail();
      });

      /* Fail closed: if the core stack never boots, leave. */
      setTimeout(function () { if (!passed) fail(); }, 5000);
    })();
  </script>
  <!-- ═══════════════════════════════════════════════════════ -->


  
  <link rel="preload" href="./assets/destruction/destruction-1.webp" as="image" />
  <link rel="stylesheet" href="./theme/save-ui.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      /* Prevent pull-to-refresh on mobile */
      overscroll-behavior: none;
    }
    #gameCanvas {
      display: block;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      touch-action: none;
      cursor: crosshair;
    }
    /* Portrait lock overlay */
    #rotateOverlay {
      display: none;
      position: fixed; inset: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
      align-items: center; justify-content: center;
      text-align: center; z-index: 9999;
    }
    #rotateOverlay.show { display: flex; }
    #rotateOverlay p { font-size: 18px; opacity: 0.8; margin-top: 8px; }
  </style>
</head>
<body>
  <canvas id="gameCanvas" aria-label="Booha Destruction"></canvas>

  <div id="rotateOverlay">
    <div>
      <div style="font-size:48px">↺</div>
      <p>Please rotate to landscape</p>
      <p style="font-size:13px;margin-top:4px;opacity:0.5">横向きでつかってください</p>
    </div>
  </div>

  <script>
    window.BOOHA_CFG = {
      canvasId: 'gameCanvas',
      assets: {
        bg: './assets/destruction/destruction-1.webp'
      },
      audio: {
        pull:   './assets/destruction/pull.mp3',
        launch: './assets/destruction/launch.mp3',
        wood:   './assets/destruction/wood.mp3',
        stone:  './assets/destruction/stone.mp3',
        glass:  './assets/destruction/glass.mp3',
        soft:   './assets/destruction/soft.mp3',
        break:  './assets/destruction/break.mp3',
        rubble: './assets/destruction/fall_rubble.mp3',
        ground: './assets/destruction/ground.mp3',
        win:    './assets/destruction/100.mp3',
        fail:   './assets/destruction/fail.mp3'
      },
      gameplay: {
        ghostsPerRound: 3,
        targetPercent:  100
      }
    };

    // Portrait detection
    function checkRotate() {
      const ro = document.getElementById('rotateOverlay');
      const portrait = window.innerWidth < 600 && window.innerHeight > window.innerWidth;
      ro.classList.toggle('show', portrait);
    }
    window.addEventListener('resize', checkRotate);
    checkRotate();
  </script>

  <script src="./js/destruction_levels_1.js"></script>
  <script src="./js/destruction_1.js"></script>

  <script>
    // Inject the save panel once the core stack is up, but skip the
    // floating 💾 toggle button it normally adds — Destruction has its
    // own canvas buttons for this (title screen + pause menu) so a
    // second, DOM-level button floating over the canvas would be
    // redundant and could eat touch input meant for the sling.
    document.addEventListener('booha:ready', function () {
      if (!window.BoohaSaveMenu) return;
      BoohaSaveMenu.init().then(function () {
        var toggle = document.getElementById('booha-save-toggle');
        if (toggle) toggle.remove();
      });
    });
  </script>
</body>
</html>
