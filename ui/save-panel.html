
<!-- save-panel.html -->
<!-- The Booha Adventure — Save Panel -->
<!-- Injected into pages by save-menu.js via fetch or inline fallback -->

<div id="booha-save-overlay" class="booha-overlay" aria-hidden="true"></div>

<aside
  id="booha-save-panel"
  class="booha-save-panel"
  role="dialog"
  aria-label="Save Menu"
  aria-hidden="true"
>
  <button id="booha-save-close" class="booha-close-btn" aria-label="Close save menu">✕</button>

  <div class="booha-panel-header">
    <span class="booha-panel-icon">💾</span>
    <h2 class="booha-panel-title">Adventure Save</h2>
  </div>

  <!-- ── Save & Load ─────────────────────────────────────────── -->
  <section class="booha-save-section">
    <h3 class="booha-section-title">Save &amp; Load</h3>

    <button id="booha-btn-export-file" class="booha-btn">
      <span class="booha-btn-icon">📥</span>
      Export Save File
    </button>

    <button id="booha-btn-import-file" class="booha-btn">
      <span class="booha-btn-icon">📤</span>
      Import Save File
    </button>
  </section>

  <!-- ── Memory Code ────────────────────────────────────────── -->
  <section class="booha-save-section">
    <h3 class="booha-section-title">Memory Code</h3>
    <p class="booha-section-hint">A secret code that holds your whole adventure.</p>

    <button id="booha-btn-show-code" class="booha-btn">
      <span class="booha-btn-icon">🔑</span>
      Show Memory Code
    </button>

    <button id="booha-btn-enter-code" class="booha-btn">
      <span class="booha-btn-icon">📋</span>
      Enter Memory Code
    </button>
  </section>

  <!-- ── Danger Zone ────────────────────────────────────────── -->
  <section class="booha-save-section booha-danger-zone">
    <h3 class="booha-section-title">Danger Zone</h3>

    <button id="booha-btn-reset" class="booha-btn booha-btn-danger">
      <span class="booha-btn-icon">🗑</span>
      Reset Adventure
    </button>
  </section>

  <!-- ── Status feedback ────────────────────────────────────── -->
  <p
    class="booha-save-status"
    id="booha-save-status"
    aria-live="polite"
    aria-atomic="true"
  ></p>
</aside>
