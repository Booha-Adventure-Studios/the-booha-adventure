
<!-- save-panel.html -->
<!-- The Booha Adventure — Save Panel -->
<!-- Injected into pages by save-menu.js via fetch or inline fallback -->

<div id="booha-save-overlay" class="booha-overlay" aria-hidden="true"></div>

<aside
  id="booha-save-panel"
  class="booha-save-panel"
  role="dialog"
  aria-label="Save Menu"
  aria-hidden="true"
>
  <button id="booha-save-close" class="booha-close-btn" aria-label="Close save menu">✕</button>

  <div class="booha-panel-header">
    <span class="booha-panel-icon">💾</span>
    <h2 class="booha-panel-title">Adventure Save<span class="booha-jp">アドベンチャー セーブ</span></h2>
  </div>

  <!-- ── Save & Load ─────────────────────────────────────────── -->
  <section class="booha-save-section">
    <h3 class="booha-section-title">Save &amp; Load<span class="booha-jp">セーブ・よみこみ</span></h3>

    <button id="booha-btn-export-file" class="booha-btn">
      <span class="booha-btn-icon">📥</span>
      <span class="booha-btn-label">Export Save File<span class="booha-jp">ファイルにほぞんする</span></span>
    </button>

    <button id="booha-btn-import-file" class="booha-btn" hidden>
      <span class="booha-btn-icon">📤</span>
      <span class="booha-btn-label">Import Save File<span class="booha-jp">ファイルをよみこむ</span></span>
    </button>
  </section>

  <!-- ── Memory Code ────────────────────────────────────────── -->
  <section class="booha-save-section">
    <h3 class="booha-section-title">Memory Code<span class="booha-jp">きおくコード</span></h3>
    <p class="booha-section-hint">A secret code that holds your whole adventure.<span class="booha-jp">ぼうけんの きろくが はいった ひみつのコード</span></p>

    <button id="booha-btn-show-code" class="booha-btn">
      <span class="booha-btn-icon">🔑</span>
      <span class="booha-btn-label">Show Memory Code<span class="booha-jp">コードをみる</span></span>
    </button>

    <button id="booha-btn-enter-code" class="booha-btn" hidden>
      <span class="booha-btn-icon">📋</span>
      <span class="booha-btn-label">Enter Memory Code<span class="booha-jp">コードをいれる</span></span>
    </button>
  </section>

  <!-- ── Danger Zone ────────────────────────────────────────── -->
  <section class="booha-save-section booha-danger-zone" hidden>
    <h3 class="booha-section-title">Danger Zone<span class="booha-jp">きけんゾーン</span></h3>

    <button id="booha-btn-reset" class="booha-btn booha-btn-danger">
      <span class="booha-btn-icon">🗑</span>
      <span class="booha-btn-label">Reset Adventure<span class="booha-jp">全消去</span></span>
    </button>
  </section>

  <!-- ── Status feedback ────────────────────────────────────── -->
  <p
    class="booha-save-status"
    id="booha-save-status"
    aria-live="polite"
    aria-atomic="true"
  ></p>
</aside>
