    /* ═══════════════════════════════════════
       HOMEWORK PROMPT — magical redesign
    ═══════════════════════════════════════ */
    #hwPromptScrim{
      position:fixed; inset:0; z-index:210;
      background:rgba(0,0,0,0);
      backdrop-filter:blur(0px); -webkit-backdrop-filter:blur(0px);
      display:none;
      transition:background 600ms ease, backdrop-filter 600ms ease, -webkit-backdrop-filter 600ms ease;
    }
    #hwPromptScrim.show{ display:block; }
    #hwPromptScrim.active{
      background:rgba(3,0,20,.78);
      backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    }

    #hwPrompt{
      position:fixed; left:50%; top:50%;
      transform:translate(-50%,-50%) scale(0.78) translateY(18px);
      z-index:215;
      min-width:280px; max-width:460px; width:min(90vw,460px);
      max-height:90vh; overflow-y:auto;
      background:
        radial-gradient(ellipse at 50% -8%, rgba(255,215,80,.20) 0%, transparent 55%),
        radial-gradient(ellipse at 15% 115%, rgba(255,145,55,.12) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 115%, rgba(255,110,200,.08) 0%, transparent 50%),
        linear-gradient(155deg, rgba(20,9,48,.99) 0%, rgba(5,14,42,.99) 100%);
      border-radius:28px;
      padding:clamp(24px,4vw,36px) clamp(20px,4vw,32px) clamp(20px,4vw,32px);
      backdrop-filter:blur(36px); -webkit-backdrop-filter:blur(36px);
      text-align:center;
      border:1px solid rgba(255,215,80,.24);
      box-shadow:
        0 0 0 1px rgba(255,255,255,.07),
        0 48px 120px rgba(0,0,0,.92),
        0 0 140px rgba(255,195,50,.14),
        0 0 70px rgba(255,130,35,.09),
        inset 0 1px 0 rgba(255,255,255,.14),
        inset 0 -1px 0 rgba(255,210,60,.09);
      display:none;
      pointer-events:auto;
      overflow:hidden;
      opacity:0;
      transition:opacity 480ms cubic-bezier(.22,1,.36,1), transform 520ms cubic-bezier(.34,1.42,.64,1);
    }
    #hwPrompt.show{ display:block; }
    #hwPrompt.visible{
      opacity:1;
      transform:translate(-50%,-50%) scale(1) translateY(0);
    }

    /* Animated shimmer top bar */
    #hwPromptBar{
      height:3px; border-radius:999px; margin:0 auto 18px; width:60%; opacity:1;
      background:linear-gradient(90deg,#cc7700,#ffe566,#fff9c0,#ffe566,#ffaa22,#ffe566,#fff9c0,#cc7700);
      background-size:300% 100%;
      animation:hwBarShimmer 2.8s linear infinite;
      box-shadow:0 0 20px #ffe06688, 0 0 40px #ffbb3344, 0 0 8px #fffde0;
    }
    @keyframes hwBarShimmer{
      0%{ background-position:0% 0% }
      100%{ background-position:300% 0% }
    }

    /* Floating tree image with golden glow */
    #hwTreeEmoji{
      width:clamp(60px,14vmin,108px);
      height:clamp(60px,14vmin,108px);
      object-fit:contain;
      display:block;
      margin:0 auto 12px;
      animation:hwTreeFloat 3.4s ease-in-out infinite;
      filter:
        drop-shadow(0 0 22px rgba(255,210,60,.60))
        drop-shadow(0 0 50px rgba(255,160,40,.30))
        drop-shadow(0 10px 28px rgba(0,0,0,.75));
    }
    @keyframes hwTreeFloat{
      0%,100%{ transform:translateY(0) rotate(-2.5deg) scale(1); }
      45%{ transform:translateY(-11px) rotate(2.5deg) scale(1.04); }
    }

    .hw-eyebrow{
      font-family:'Bowlby One',sans-serif;
      font-size:clamp(9px,1.6vw,11px);
      letter-spacing:3.5px;
      text-transform:uppercase;
      color:rgba(255,205,70,.60);
      margin:0 0 8px;
    }

    #hwPromptTitle{
      font-family:'Bowlby One',sans-serif;
      font-size:clamp(20px,4vw,38px);
      letter-spacing:.2px;
      margin:0 0 6px;
      color:#fff;
      line-height:1.25;
      text-shadow:
        0 0 50px rgba(255,225,100,.28),
        0 0 100px rgba(255,165,40,.14),
        0 2px 12px rgba(0,0,0,.85);
    }

    #hwPromptSub{
      font-size:clamp(12px,2vw,16px);
      font-weight:700;
      color:rgba(255,255,255,.48);
      margin:0 0 16px;
      letter-spacing:.3px;
      line-height:1.65;
    }

    /* Pulsing dots row */
    .hw-dots{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:10px;
      margin-bottom:20px;
    }
    .hw-dot{
      border-radius:50%;
      animation:hwDotPulse 2s ease-in-out infinite;
    }
    .hw-dot:nth-child(1){ width:8px;height:8px; background:#ffe566; animation-delay:0s; }
    .hw-dot:nth-child(2){ width:6px;height:6px; background:#ffbb33; animation-delay:.25s; }
    .hw-dot:nth-child(3){ width:10px;height:10px; background:#fff5b0; animation-delay:.5s; }
    .hw-dot:nth-child(4){ width:6px;height:6px; background:#ffbb33; animation-delay:.75s; }
    .hw-dot:nth-child(5){ width:8px;height:8px; background:#ffe566; animation-delay:1s; }
    @keyframes hwDotPulse{
      0%,100%{ transform:scale(1); opacity:.55; box-shadow:none; }
      50%{ transform:scale(1.6); opacity:1; box-shadow:0 0 10px currentColor; }
    }

    .hw-actions{
      display:flex;
      justify-content:center;
      gap:clamp(10px,3vw,16px);
      flex-wrap:wrap;
    }

    #hwNoBtn{
      appearance:none; border:0;
      border-radius:999px;
      padding:clamp(11px,2.5vw,14px) clamp(22px,5vw,32px);
      font-size:clamp(14px,2.5vw,17px);
      font-weight:900;
      cursor:pointer;
      color:rgba(255,255,255,.68);
      background:rgba(255,255,255,.09);
      box-shadow:
        0 4px 18px rgba(0,0,0,.32),
        inset 0 0 0 1px rgba(255,255,255,.13);
      transition:transform 120ms ease, box-shadow 140ms ease, background 140ms ease, color 140ms ease;
      letter-spacing:.3px;
    }
    #hwNoBtn:hover{
      background:rgba(255,255,255,.15);
      color:rgba(255,255,255,.88);
      transform:translateY(-2px);
    }
    #hwNoBtn:active{ transform:scale(.93); }

    #hwYesBtn{
      appearance:none; border:0;
      border-radius:999px;

    }

    #krPrompt.visible{
      opacity:1;
      transform:translate(-50%,-50%) scale(1) translateY(0);
    }

    /* Spooky shimmer bar — green/purple */
    #krPromptBar{
      height:2px; border-radius:999px; margin:0 auto 18px; width:55%; opacity:1;
      background:linear-gradient(90deg,#1a0030,#4a1a7a,#2d8c2d,#7a2a9a,#1e5c1e,#4a1a7a,#1a0030);

      100%{ background-position:300% 0% }

    /* Floating Karasuki tree logo */
    #krTreeLogo{

    @keyframes krLogoFloat{

    #krPromptTitle{

    #krPromptSub{

      color:rgba(180,210,180,.38);

    /* Spooky drip ornament */

      animation:krDripGrow 2.8s ease-in-out infinite;
    }
    .kr-drip-bar:nth-child(1){ height:clamp(10px,2.5vw,18px); animation-delay:0s; }
    .kr-drip-bar:nth-child(2){ height:clamp(16px,3.5vw,28px); animation-delay:.2s; }
    .kr-drip-bar:nth-child(3){ height:clamp(22px,4.5vw,36px); animation-delay:.4s; }
    .kr-drip-bar:nth-child(4){ height:clamp(14px,3vw,22px); animation-delay:.6s; }
    .kr-drip-bar:nth-child(5){ height:clamp(28px,5.5vw,44px); animation-delay:.8s; }
    .kr-drip-bar:nth-child(6){ height:clamp(14px,3vw,22px); animation-delay:1s; }
    .kr-drip-bar:nth-child(7){ height:clamp(22px,4.5vw,36px); animation-delay:1.2s; }
    .kr-drip-bar:nth-child(8){ height:clamp(16px,3.5vw,28px); animation-delay:1.4s; }
    .kr-drip-bar:nth-child(9){ height:clamp(10px,2.5vw,18px); animation-delay:1.6s; }
    @keyframes krDripGrow{
      0%,100%{ opacity:.35; transform:scaleY(1); }
      50%{ opacity:.85; transform:scaleY(1.18); }
    }

    .kr-actions{
      display:flex;

    #krNoBtn{

    #krYesBtn::after{

    }
    #krYesBtn:hover{
      transform:translateY(-2px);
      box-shadow:0 10px 32px rgba(0,0,0,.80),0 0 0 1px rgba(80,200,80,.35),0 0 50px rgba(80,200,80,.18),0 0 70px rgba(100,30,160,.20),inset 0 1px 0 rgba(180,220,180,.15);
    }
    #krYesBtn:active{ transform:scale(.93); }

    /* Corner rune marks */
    .kr-corner{
      position:absolute;
      width:24px; height:24px;
      pointer-events:none;
      opacity:.40;
    }
    .kr-corner.tl{ top:14px; left:14px; animation:krCornerPulse 4.5s ease-in-out infinite; }
    .kr-corner.tr{ top:14px; right:14px; animation:krCornerPulse 4.5s ease-in-out infinite; animation-delay:1.2s; }
    .kr-corner.bl{ bottom:14px; left:14px; animation:krCornerPulse 4.5s ease-in-out infinite; animation-delay:2.4s; }
    .kr-corner.br{ bottom:14px; right:14px; animation:krCornerPulse 4.5s ease-in-out infinite; animation-delay:3.6s; }
    @keyframes krCornerPulse{
      0%,100%{ opacity:.25; transform:scale(1); }
      50%{ opacity:.65; transform:scale(1.15); }
    }
    .kr-corner svg{ width:100%; height:100%; }

    /* ═══════════════════════════════════════
       KARASUKI VIDEO — simple fade
    ═══════════════════════════════════════ */
    #krVideoWrap{
      position:fixed; inset:0; z-index:220;

      opacity:0;
      pointer-events:none;
      visibility:hidden;

const KARASUKI_SWAP_MS=25000,KARASUKI_FADE_MS=1200,KARASUKI_GONE_MS=15000,KARASUKI_PUFF_MS=1500;
let karasukiPuffParticles=[];

function spawnKarasukiPuff(cx,cy){
  karasukiPuffParticles=[];
  for(let i=0;i<28;i++){
    const angle=Math.random()*Math.PI*2,speed=1.2+Math.random()*2.8;
    karasukiPuffParticles.push({x:cx,y:cy,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-1.5,life:1,size:3+Math.random()*5,color:i%3===0?'#aaffcc':i%3===1?'#dd99ff':'#9933ff'});
  }
}
function tickKarasuki(now,cx,cy){
  if(karasukiLastSwap===0){karasukiLastSwap=now;return;}
  const el=now-karasukiLastSwap;
  if(karasukiPhase===0){karasukiOpacity=1;karasukiBlend=0;if(el>=KARASUKI_SWAP_MS){karasukiPhase=1;karasukiLastSwap=now;}}
  else if(karasukiPhase===1){karasukiBlend=Math.min(el/KARASUKI_FADE_MS,1);if(karasukiBlend>=1){karasukiPhase=2;karasukiLastSwap=now;}}
  else if(karasukiPhase===2){karasukiOpacity=1;karasukiBlend=1;if(el>=KARASUKI_SWAP_MS){karasukiPhase=3;karasukiLastSwap=now;}}
  else if(karasukiPhase===3){karasukiBlend=Math.max(1-el/KARASUKI_FADE_MS,0);if(karasukiBlend<=0){karasukiPhase=4;karasukiLastSwap=now;}}
  else if(karasukiPhase===4){karasukiOpacity=Math.max(1-el/KARASUKI_PUFF_MS,0);if(el>50&&karasukiPuffParticles.length===0)spawnKarasukiPuff(cx,cy);if(karasukiOpacity<=0){karasukiPhase=5;karasukiLastSwap=now;karasukiOpacity=0;}}
  else if(karasukiPhase===5){karasukiOpacity=0;if(el>=KARASUKI_GONE_MS){karasukiPhase=6;karasukiLastSwap=now;}}
  else if(karasukiPhase===6){karasukiOpacity=Math.min(el/KARASUKI_PUFF_MS,1);if(karasukiOpacity>=1){karasukiPhase=0;karasukiLastSwap=now;karasukiPuffParticles=[];}}
  for(const p of karasukiPuffParticles){p.x+=p.vx;p.y+=p.vy;p.vy+=0.04;p.life-=0.018;}
  karasukiPuffParticles=karasukiPuffParticles.filter(p=>p.life>0);
}

    return 0;

function shuffledExtraIndices() {
  const arr = EXTRA_BOOHA_GHOSTS.map((_, i) => i);

  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }

  return arr;
}

function buildWanderers() {
  wanderers = [];

  // Always keep the cute original maze feeling:
  // player ghost + 4 main Booha friends.
  for (let gi = 0; gi < GHOSTS.length; gi++) {
    if (gi === activeGhostIdx) continue;

    const w = createWanderer(gi, wanderers.length * 1400);
    w.kind = 'main';
    wanderers.push(w);
  }

  const games = window.__boohaExtraGhosts ? 9 : getGamesThisWeekForMaze();

  // Quiet atmospheric increase.
  // Not "one game = one obvious unlock."
  const extraCount = window.__boohaExtraGhosts
    ? EXTRA_BOOHA_GHOSTS.length
    : Math.min(EXTRA_BOOHA_GHOSTS.length, Math.floor(games * 0.75));

    ctx.beginPath();ctx.moveTo(x,y-starLen*.18);ctx.lineTo(x,y-starLen);ctx.moveTo(x,y+starLen*.18);ctx.lineTo(x,y+starLen);ctx.moveTo(x-starLen*.18,y);ctx.lineTo(x-starLen,y);ctx.moveTo(x+starLen*.18,y);ctx.lineTo(x+starLen,y);ctx.moveTo(x-dL*.1,y-dL*.1);ctx.lineTo(x-dL,y-dL);ctx.moveTo(x+dL*.1,y-dL*.1);ctx.lineTo(x+dL,y-dL);ctx.moveTo(x-dL*.1,y+dL*.1);ctx.lineTo(x-dL,y+dL);ctx.moveTo(x+dL*.1,y+dL*.1);ctx.lineTo(x+dL,y+dL);ctx.stroke();ctx.shadowBlur=0;
    CP_FAIRIES[cpIdx].forEach(f=>{
      const angle=f.angle+sec*f.speed,twinkle=.35+.65*Math.abs(Math.sin(sec*f.twinkleSpeed+f.twinklePhase));
      const r=f.orbit*coverScale*(.82+state.extra*.08)*(.92+.08*Math.sin(sec*1.1+f.phase));
      const fx=x+Math.cos(angle)*r,fy=y+Math.sin(angle)*r*.84;
      const fColor=f.useSecondary?col2:col1,fAlpha=twinkle*alpha*(.70+state.extra*.15),fSize=f.size*coverScale*(.65+twinkle*.45);
      ctx.globalAlpha=fAlpha*.42;const fg=ctx.createRadialGradient(fx,fy,0,fx,fy,fSize*3.2);fg.addColorStop(0,fColor);fg.addColorStop(1,'transparent');ctx.fillStyle=fg;ctx.beginPath();ctx.arc(fx,fy,fSize*3.2,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=fAlpha;ctx.strokeStyle='#fff';ctx.lineWidth=fSize*.55;ctx.shadowBlur=6;ctx.shadowColor=fColor;const sl=fSize*1.9;ctx.beginPath();ctx.moveTo(fx,fy-sl);ctx.lineTo(fx,fy+sl);ctx.moveTo(fx-sl,fy);ctx.lineTo(fx+sl,fy);ctx.stroke();
      ctx.globalAlpha=fAlpha;ctx.fillStyle='#fff';ctx.shadowBlur=5;ctx.shadowColor=fColor;ctx.beginPath();ctx.arc(fx,fy,fSize*.48,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    });
    ctx.globalAlpha=1;ctx.restore();
  });

  // ── Layer 4: wandering ghosts (on top of orbs & trees) ──────────────────
  tickWanderers(now);
  drawWanderers(now);

  // ── Layer 5: active ghost (always topmost) ───────────────────────────────
  if(ghostVisible){
    const bob=Math.sin(sec*1.85)*3.5;const{x:gx,y:gy}=imgToCSS(ghostIX,ghostIY);
    const gR=activeGhostR,pulseG=.5+.5*Math.sin(sec*2.1),gcol1=monthPrimary(activeWeek),gcol2=monthSecondary(activeWeek);
    ctx.save();
    ctx.globalAlpha=.20+pulseG*.10;const ga=ctx.createRadialGradient(gx,gy+3,0,gx,gy+3,gR*2.0);ga.addColorStop(0,gcol1);ga.addColorStop(.5,gcol2);ga.addColorStop(1,'transparent');ctx.fillStyle=ga;ctx.beginPath();ctx.arc(gx,gy+3,gR*2.0,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=.14+pulseG*.06;const gs=ctx.createRadialGradient(gx,gy+gR*.7,0,gx,gy+gR*.7,gR*.85);gs.addColorStop(0,'rgba(0,0,0,.5)');gs.addColorStop(1,'transparent');ctx.fillStyle=gs;ctx.beginPath();ctx.arc(gx,gy+gR*.7,gR*.85,0,Math.PI*2);ctx.fill();
    ctx.restore();ctx.save();
    const activeImg=ghostImgs[activeGhostIdx];
    if(activeImg&&activeImg.complete&&activeImg.naturalWidth>0)ctx.drawImage(activeImg,gx-gR,gy-gR+bob,gR*2,gR*2);
    else{ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(gx,gy+bob,gR*.7,0,Math.PI*2);ctx.fill();}
    ctx.restore();
  }

  if(bryanOn&&bMouseX>=0){
    ctx.save();ctx.strokeStyle='rgba(255,255,255,.50)';ctx.lineWidth=1;ctx.shadowBlur=8;ctx.shadowColor='rgba(255,255,255,.25)';ctx.setLineDash([5,5]);
    ctx.beginPath();ctx.moveTo(0,bMouseY);ctx.lineTo(cssW,bMouseY);ctx.stroke();ctx.beginPath();ctx.moveTo(bMouseX,0);ctx.lineTo(bMouseX,cssH);ctx.stroke();ctx.restore();
  }
}

const HIT_R=40;
function hitTest(clientX,clientY){
  const rect=canvas.getBoundingClientRect();const cx=clientX-rect.left,cy=clientY-rect.top;const{ix,iy}=cssToImg(cx,cy);
  const pool=bryanOn?CHECKPOINTS:CHECKPOINTS.filter(c=>OPEN_WEEKS.includes(c.w));
  let best=null,bestD=Infinity;pool.forEach(cp=>{const d=Math.hypot(cp.ix-ix,cp.iy-iy);if(d<HIT_R&&d<bestD){bestD=d;best=cp;}});return best;
}
function hitHomeworkTree(clientX,clientY){
  const rect=canvas.getBoundingClientRect();const{ix,iy}=cssToImg(clientX-rect.left,clientY-rect.top);
  return Math.hypot(ix-HW_TREE_IX,iy-HW_TREE_IY)<HW_TREE_HIT_R;
}

  const rect=canvas.getBoundingClientRect();const{ix,iy}=cssToImg(clientX-rect.left,clientY-rect.top);
  return Math.hypot(ix-KR_TREE_IX,iy-KR_TREE_IY)<KR_TREE_HIT_R;
}

function showPopupAtCP(cp){
  // Resolve cp's actual week dates through calendar.js — handles repeat weeks correctly.
  // Shift the current week's Sunday start by (cp.w - CURRENT_WEEK) * 7 days, then resolve.
  const cpWeekData = window.CALENDAR.getCurrentCurriculumWeek(
    new Date(new Date(CURRENT_WEEK_DATA.weekStart + 'T12:00:00Z').getTime()
      + (cp.w - CURRENT_WEEK) * 7 * 24 * 60 * 60 * 1000)
  );
  // Diff based on resolved weekId strings, not raw week numbers
  const sameWeek = cpWeekData.weekId === CURRENT_WEEK_DATA.weekId;
  const isPast   = cp.w < CURRENT_WEEK;
  const diff     = sameWeek ? 0 : isPast ? -1 : 1;
  cpWeekLabel.textContent=diff===0?'今週のブーハー':diff<0?'先週のブーハー':'来週のブーハー';
  const col1=monthPrimary(cp.w),col2=monthSecondary(cp.w);
  cpPopupBar.style.background=`linear-gradient(90deg,${col1},${col2})`;cpPopupBar.style.boxShadow=`0 0 14px ${col1}88,0 0 28px ${col2}55`;
  cpTitle.textContent='GAMES';
  // Use the calendar-resolved dates — correct even during repeat weeks
  const start=new Date(cpWeekData.weekStart+'T12:00:00Z');
  const end=new Date(cpWeekData.weekEnd+'T12:00:00Z');
  const en=start.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' – '+end.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const jp=start.toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'})+'–'+end.toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'});
  cpPopupDate.innerHTML=`${en}<br><span style="font-size:0.88em;opacity:0.7">${jp}</span>`;
  cpWeekBadge.classList.remove('visible');cpWeekBadge.style.background='';cpWeekBadge.style.color='';cpWeekBadge.textContent='';
  if(diff===0){cpWeekBadge.textContent='★ THIS WEEK / 今週 ★';cpWeekBadge.style.background=`linear-gradient(90deg,${col1},${col2})`;cpWeekBadge.style.color='#000';cpWeekBadge.classList.add('visible');}
  else if(diff<0){cpWeekBadge.textContent='← LAST WEEK / 先週';cpWeekBadge.style.background='rgba(255,255,255,0.12)';cpWeekBadge.style.color='rgba(255,255,255,0.75)';cpWeekBadge.classList.add('visible');}
  else{cpWeekBadge.textContent='NEXT WEEK / 来週 →';cpWeekBadge.style.background='rgba(255,255,255,0.12)';cpWeekBadge.style.color='rgba(255,255,255,0.75)';cpWeekBadge.classList.add('visible');}  

  
  cpScrim.classList.add('show');cpPopup.classList.remove('show');void cpPopup.offsetWidth;cpPopup.classList.add('show');
}

function buildSparkles(container,count=24,wide=false){
  container.innerHTML='';
  // Radii are now percentages of the container (which uses inset:% so it scales with the button)
  for(let i=0;i<count;i++){
    const sp=document.createElement('div');sp.className='sp';
    const angle=(i/count)*Math.PI*2,r=wide?28+Math.random()*18:22+Math.random()*12;
    const cx=50+Math.cos(angle)*r,cy=50+Math.sin(angle)*r;
    const size=wide?3+Math.random()*4:2+Math.random()*3,dur=1.3+Math.random()*1.8,delay=-(Math.random()*dur);
    sp.style.cssText=`--size:${size}px;--x:${cx}%;--y:${cy}%;--dur:${dur}s;--delay:${delay}s;`;
    container.appendChild(sp);
  }
}

  CHECKPOINTS.forEach(cp => {
    if (!OPEN_WEEKS.includes(cp.w)) OPEN_WEEKS.push(cp.w);
  });

  mazeStarted = true;
  ghostVisible = true;
  introPhase = 'done';
  setTravelLock(false);

  const cp = CHECKPOINTS.find(c => c.w === CURRENT_WEEK) || CHECKPOINTS[0];

  // Put the player ghost at the current week checkpoint when DEV starts.
ghostIX = cp.ix;
ghostIY = cp.iy;
ghostSrcIX = cp.ix;
ghostSrcIY = cp.iy;
ghostDstIX = cp.ix;
ghostDstIY = cp.iy;
ghostT = 1;
activeWeek = cp.w;
  

  buildWanderers();
  resizeCanvas();
  startLoop();

  console.log('👻 b_4822 DEV ON');
  console.log('Coords ON. All checkpoints visible. Extra Booha visitors visible.');
  console.log('Playable ghosts are still ONLY the main five.');

  return {
    dev: true,
    playableGhosts: GHOSTS.length,
    extraGhostsAvailable: EXTRA_BOOHA_GHOSTS.length,
    activeGhostIdx,
    activeGhostSrc: GHOSTS[activeGhostIdx],
    wanderers: wanderers.length,
    checkpoints: CHECKPOINTS.length
  };
};

window.b_4822_off = function b_4822_off() {
  window.__boohaMazeDev = false;
  window.__boohaShowAllCheckpoints = false;
  window.__boohaExtraGhosts = false;

  bryanOn = false;
  applyBryan();

  // Restore normal open weeks.
  OPEN_WEEKS.length = 0;
  OPEN_WEEKS.push(Math.max(1, _lastW), CURRENT_WEEK);

  if (_nextData.weekId !== CURRENT_WEEK_DATA.weekId) {
    OPEN_WEEKS.push(Math.min(48, _nextW));
  }

  buildWanderers();
  resizeCanvas();

  console.log('👻 b_4822 DEV OFF');

  return {
    dev: false,
    openWeeks: OPEN_WEEKS.slice(),
    wanderers: wanderers.length
  };
};
  
</script>
