
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Booha Adventure — Maze</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bowlby+One&display=swap" rel="stylesheet" />
  <style>
    :root{
      --pink:#ff3bbd; --pink2:#ff79d7;
      --blue:#3bc8ff; --blue2:#79dfff;
      --safe-top:    env(safe-area-inset-top);
      --safe-right:  env(safe-area-inset-right);
      --safe-bottom: env(safe-area-inset-bottom);
      --safe-left:   env(safe-area-inset-left);
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; background:#000; color:#fff;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,
        "Noto Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; }
    #app{ position:fixed; inset:0; background:#000; overflow:hidden; }
    #rotateOverlay{
      position:fixed; inset:0; display:none; flex-direction:column;
      align-items:center; justify-content:center; gap:20px;
      background:#000; z-index:9999; text-align:center; padding:32px;
    }
    #rotateOverlay.show{ display:flex; }
    @media screen and (orientation:portrait) and (max-width:1023px){
      #rotateOverlay{ display:flex !important; }
    }
    .rotateIcon{ font-size:72px; display:block; transform-origin:center; animation:rotateHint 2.2s ease-in-out infinite; }
    @keyframes rotateHint{ 0%,100%{ transform:rotate(0deg); } 35%,65%{ transform:rotate(-90deg); } }
    .rotateTitle{ font-family:'Bowlby One',sans-serif; font-size:clamp(22px,6vw,34px); letter-spacing:2px; color:#fff; margin:0; text-shadow:0 0 30px rgba(255,140,255,.8),0 0 60px rgba(255,80,200,.4); }
    .rotateSub{ font-size:16px; color:rgba(255,255,255,.65); margin:0; line-height:1.7; }
    .rotateGlow{ width:140px; height:4px; border-radius:999px; margin:0 auto; background:linear-gradient(90deg,var(--pink),var(--blue),var(--pink)); background-size:200%; animation:shimmer 2s linear infinite; box-shadow:0 0 16px rgba(255,59,189,.5); }
    @keyframes shimmer{ 0%{ background-position:0% } 100%{ background-position:200% } }
    .overlay{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(14px,3.5vmin,30px); padding: calc(28px + var(--safe-top)) calc(28px + var(--safe-right)) calc(28px + var(--safe-bottom)) calc(28px + var(--safe-left)); background:radial-gradient(ellipse at center,rgba(0,0,0,.50) 0%,rgba(0,0,0,.84) 62%,rgba(0,0,0,.97) 100%); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); text-align:center; z-index:40; transition:opacity 550ms ease; }
    .overlay.hidden{ opacity:0; pointer-events:none; }
    .overlay.gone{ display:none; }
    .overlayHeading{ font-family:'Bowlby One',sans-serif; font-size:clamp(20px,4.5vw,46px); letter-spacing:2px; margin:0; color:#fff; line-height:1.2; text-shadow:0 0 32px rgba(255,140,255,.7),0 0 80px rgba(255,80,200,.35),0 2px 8px rgba(0,0,0,.9); }
    .btnRow{ display:flex; gap:clamp(10px,3vmin,20px); flex-wrap:wrap; justify-content:center; align-items:center; }
    .btnPink,.btnBlue{ appearance:none; border:0; border-radius:999px; padding:clamp(11px,2.5vmin,15px) clamp(20px,5vmin,30px); font-size:clamp(15px,3.8vmin,20px); font-weight:1000; letter-spacing:.5px; cursor:pointer; color:#000; -webkit-tap-highlight-color:transparent; transform:translateZ(0); min-width:80px; }
    .btnPink{ background:linear-gradient(180deg,var(--pink2),var(--pink)); box-shadow:0 8px 20px rgba(255,59,189,.28),0 0 0 2px rgba(255,59,189,.18),0 0 26px rgba(255,59,189,.38); }
    .btnPink:active{ transform:scale(.96); }
    .btnBlue{ background:linear-gradient(180deg,var(--blue2),var(--blue)); box-shadow:0 8px 20px rgba(59,200,255,.28),0 0 0 2px rgba(59,200,255,.18),0 0 26px rgba(59,200,255,.38); }
    .btnBlue:active{ transform:scale(.96); }
    .sparkleWrap{ position:relative; display:inline-flex; align-items:center; justify-content:center; }
    .sparkleField{ position:absolute; inset:-50px; pointer-events:none; }
    .sp{ position:absolute; border-radius:50%; background:#fff; opacity:0; animation:sparkleLife var(--dur) ease-in-out var(--delay) infinite; width:var(--size); height:var(--size); top:var(--y); left:var(--x); box-shadow:0 0 4px 1px rgba(255,255,255,.9),0 0 10px 3px rgba(255,100,220,.6); }
    @keyframes sparkleLife{ 0%{ opacity:0; transform:scale(.4) translateY(0); } 20%{ opacity:1; transform:scale(1) translateY(-6px); } 60%{ opacity:.85; transform:scale(.9) translateY(-14px); } 100%{ opacity:0; transform:scale(.3) translateY(-22px); } }
    #overlay1{ z-index:50; }
    #videoWrap{ position:absolute; inset:0; display:none; background:#000; z-index:20; }
    #videoWrap.show{ display:block; }
    #toMazeVideo{ width:100%; height:100%; object-fit:cover; background:#000; }
    #overlay2{ z-index:45; display:none; }
    #overlay2.show{ display:flex; }
    .ghostBtnWrap{ position:relative; display:inline-flex; align-items:center; justify-content:center; background:none; border:none; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    .ghostBtnWrap:active #startGhost{ transform:scale(.88) translateY(-5px); filter:drop-shadow(0 0 44px rgba(255,100,220,1)) drop-shadow(0 14px 30px rgba(0,0,0,.7)); }
    .ghostSparkleField{ position:absolute; inset:-70px; pointer-events:none; z-index:0; }
    .ghostSparkleField .sp{ box-shadow:0 0 6px 2px rgba(255,255,255,.95),0 0 16px 5px rgba(255,100,220,.75); }
    #startGhost{ width:clamp(100px,28vmin,200px); height:clamp(100px,28vmin,200px); object-fit:contain; user-select:none; -webkit-user-drag:none; filter:drop-shadow(0 0 26px rgba(255,100,220,.6)) drop-shadow(0 14px 30px rgba(0,0,0,.7)); animation:floaty 3.6s ease-in-out infinite; transform-origin:50% 60%; transition:transform 120ms ease,filter 120ms ease; position:relative; z-index:1; }
    @keyframes floaty{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-8px); } }
    #mazeScene{ position:absolute; inset:0; background:#000; }
    #stage{ position:absolute; inset:0; overflow:hidden; }
    #mazeImg{ display:block; position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center center; user-select:none; -webkit-user-drag:none; pointer-events:none; }
    #mazeCanvas{ position:absolute; left:0; top:0; z-index:6; cursor:default; }
    #mazeCanvas.bryan{ cursor:crosshair; }
    #mazeCanvas.locked{ cursor:not-allowed; pointer-events:none; }
    #travelLock{ position:absolute; inset:0; z-index:30; display:none; cursor:not-allowed; }
    #travelLock.active{ display:block; }
    #grid{ position:absolute; inset:0; display:none; pointer-events:none; z-index:7; background-image:linear-gradient(to right,rgba(255,255,255,.12) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.12) 1px,transparent 1px); background-size:80px 80px; mix-blend-mode:screen; opacity:.55; }
    #grid.show{ display:block; }
    .hudTitle{ font-family:'Bowlby One',sans-serif; font-size:clamp(13px,1.8vw,18px); letter-spacing:2px; line-height:1.15; color:#fff; text-shadow:0 0 22px rgba(255,140,255,.7),0 0 60px rgba(255,80,200,.35),0 2px 6px rgba(0,0,0,.9); user-select:none; pointer-events:none; }
    #hud{ position:absolute; left:calc(12px + var(--safe-left)); top:calc(12px + var(--safe-top)); display:flex; gap:10px; align-items:flex-start; z-index:10; }
    .pill{ border-radius:999px; padding:10px 14px; font-weight:900; letter-spacing:.4px; background:rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.16); backdrop-filter:blur(14px) saturate(140%); -webkit-backdrop-filter:blur(14px) saturate(140%); box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 14px 30px rgba(0,0,0,.35); color:rgba(255,255,255,.92); user-select:none; }
    #coordPill{ display:none; } #coordPill.show{ display:block; }
    .coordSmall{ font-size:12px; color:rgba(255,255,255,.7); font-weight:800; letter-spacing:1px; }
    .coordBig{ font-size:14px; margin-top:4px; }
    #bryanTip{ position:absolute; left:50%; top:calc(10px + var(--safe-top)); transform:translateX(-50%); z-index:10; display:none; background:rgba(0,0,0,.72); border:1px solid rgba(255,59,189,.3); border-radius:12px; padding:8px 16px; font-size:12px; font-weight:700; letter-spacing:.3px; color:rgba(255,255,255,.7); text-align:center; line-height:1.6; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); pointer-events:none; white-space:nowrap; }
    #bryanTip.show{ display:block; }
    #bryanBtn{ position:absolute; left:calc(10px + var(--safe-left)); bottom:calc(10px + var(--safe-bottom)); z-index:20; border-radius:999px; padding:6px 10px; font-size:9px; font-weight:1000; letter-spacing:1.4px; text-transform:uppercase; color:rgba(255,255,255,.45); background:rgba(0,0,0,.30); border:1px solid rgba(255,255,255,.10); backdrop-filter:blur(10px) saturate(140%); -webkit-backdrop-filter:blur(10px) saturate(140%); cursor:pointer; -webkit-tap-highlight-color:transparent; }
    #bryanBtn.on{ color:#fff; border-color:rgba(255,255,255,.22); box-shadow:0 0 0 2px rgba(255,59,189,.18),0 0 18px rgba(255,59,189,.25); }
    #bryanBtn:active{ transform:scale(.96); }
    #backBtn{ position:absolute; right:calc(8px + var(--safe-right)); bottom:calc(8px + var(--safe-bottom)); z-index:20; appearance:none; border:0; border-radius:999px; padding:5px 12px; font-size:11px; font-weight:1000; letter-spacing:.5px; cursor:pointer; color:#000; background:linear-gradient(180deg,var(--pink2),var(--pink)); box-shadow:0 4px 10px rgba(255,59,189,.28),0 0 0 1px rgba(255,59,189,.15),0 0 14px rgba(255,59,189,.28); opacity:0.75; -webkit-tap-highlight-color:transparent; transform:translateZ(0); transition:opacity 200ms; }
    #backBtn:hover{ opacity:1; }
    #backBtn:active{ transform:scale(.96); opacity:1; }
    @media (min-width:900px) and (pointer:fine){ #backBtn{ padding:7px 14px; font-size:12px; opacity:0.85; } #bryanBtn{ padding:8px 12px; font-size:10px; color:rgba(255,255,255,.6); } }
    @media (pointer:coarse){ .hudTitle{ display:none; } #bryanBtn{ display:none; } #hud{ display:none; } }
    #app.inTransition #bryanBtn,#app.inTransition #hud,#app.inTransition #backBtn{ display:none !important; }
    #cpScrim{ position:fixed; inset:0; z-index:55; background:rgba(0,0,0,.48); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); display:none; }
    #cpScrim.show{ display:block; }
    #cpPopup{ position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:60; min-width:260px; max-width:360px; width:min(92vw,360px); background:linear-gradient(150deg,rgba(8,3,26,.98) 0%,rgba(3,8,34,.98) 100%); border-radius:24px; padding:22px 24px 20px; backdrop-filter:blur(28px); -webkit-backdrop-filter:blur(28px); text-align:center; border:1px solid rgba(255,255,255,.12); box-shadow:0 0 0 1px rgba(255,255,255,.05),0 32px 90px rgba(0,0,0,.85),0 0 80px rgba(160,60,255,.14), inset 0 1px 0 rgba(255,255,255,.10); display:none; pointer-events:auto; }
    #cpPopup.show{ display:block; animation:popIn 300ms cubic-bezier(.34,1.46,.64,1) both; }
    @keyframes popIn{ from{ opacity:0; transform:translate(-50%,-50%) scale(.80); } to{ opacity:1; transform:translate(-50%,-50%) scale(1); } }
    #cpPopupBar{ height:3px; border-radius:999px; margin:0 auto 16px; width:55%; opacity:.92; }
    .cp-week-label{ font-family:'Bowlby One',sans-serif; font-size:clamp(9px,1.5vw,11px); letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,.38); margin:0 0 3px; }
    #cpPopupTitle{ font-family:'Bowlby One',sans-serif; font-size:clamp(18px,3vw,26px); letter-spacing:.5px; margin:0 0 4px; color:#fff; line-height:1.2; }
    #cpPopupDate{ font-size:clamp(11px,1.8vw,14px); font-weight:700; color:rgba(255,255,255,.55); margin:0 0 4px; letter-spacing:.3px; }
    #cpWeekBadge{ display:inline-block; font-size:clamp(10px,1.6vw,12px); font-weight:900; letter-spacing:1.2px; text-transform:uppercase; border-radius:999px; padding:3px 11px; margin-bottom:16px; opacity:0; transition:opacity .25s ease; }
    #cpWeekBadge.visible{ opacity:1; }
    .cp-icons{ display:flex; justify-content:center; gap:clamp(10px,3vw,18px); margin-bottom:18px; }
    .cp-icon-btn{ display:flex; flex-direction:column; align-items:center; gap:7px; background:none; border:none; cursor:pointer; padding:0; -webkit-tap-highlight-color:transparent; transition:transform 120ms ease; }
    .cp-icon-btn:active{ transform:scale(.90); }
    .cp-icon-img{ width:clamp(52px,12vw,70px); height:clamp(52px,12vw,70px); object-fit:contain; border-radius:16px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.14); padding:7px; box-shadow:0 4px 20px rgba(0,0,0,.55),0 0 28px rgba(180,100,255,.10); transition:box-shadow 140ms ease,border-color 140ms ease,transform 140ms ease; }
    .cp-icon-btn:hover .cp-icon-img{ border-color:rgba(255,255,255,.30); box-shadow:0 6px 28px rgba(0,0,0,.65),0 0 36px rgba(180,100,255,.28); transform:translateY(-2px); }
    .cp-icon-label{ font-size:clamp(8px,1.4vw,10px); font-weight:900; letter-spacing:.7px; text-transform:uppercase; color:rgba(255,255,255,.48); line-height:1.25; text-align:center; max-width:76px; }
    #cpCloseBtn{ appearance:none; border:0; border-radius:999px; padding:9px 26px; font-size:13px; font-weight:900; cursor:pointer; color:#000; background:linear-gradient(180deg,var(--pink2),var(--pink)); box-shadow:0 4px 18px rgba(255,59,189,.42),0 0 28px rgba(255,59,189,.18); transition:transform 100ms; }
    #cpCloseBtn:active{ transform:scale(.95); }
    #fade{ position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity 520ms ease; z-index:200; }
    #fade.on{ opacity:1; }
    @media (prefers-reduced-motion:reduce){ #startGhost{ animation:none; } .rotateIcon{ animation:none; transform:rotate(-90deg); } #fade{ transition:none; } .sp{ animation:none; opacity:.6; } }
  </style>
</head>
<body>
<div id="app">
  <div id="rotateOverlay" role="alert" aria-live="polite">
    <span class="rotateIcon">📱</span>
    <div class="rotateGlow"></div>
    <h1 class="rotateTitle">よこにしてね！</h1>
    <p class="rotateSub">めいろをあそぶには<br>スマホを<strong style="color:#ff79d7">よこむき</strong>にしてください</p>
  </div>
  <div id="overlay1" class="overlay" aria-label="めいろへいく？">
    <h1 class="overlayHeading">ブーハーめいろにいく？</h1>
    <div class="btnRow">
      <button id="returnBtn" class="btnBlue" type="button">いかない</button>
      <div class="sparkleWrap">
        <div class="sparkleField" id="confirmSparkles" aria-hidden="true"></div>
        <button id="continueBtn" class="btnPink" type="button">いく！</button>
      </div>
    </div>
  </div>
  <div id="videoWrap" aria-hidden="true">
    <video id="toMazeVideo" preload="auto" playsinline webkit-playsinline>
      <source src="assets/video/ttmaze.mp4" type="video/mp4" />
    </video>
  </div>
  <div id="overlay2" class="overlay" aria-label="スタート">
    <h1 class="overlayHeading">ブーハーをタッチしてはじめよう！</h1>
    <button id="mazeStartBtn" class="ghostBtnWrap" type="button" aria-label="スタート">
      <div class="ghostSparkleField" id="startSparkles" aria-hidden="true"></div>
      <img id="startGhost" alt="ブーハー" />
    </button>
  </div>
  <section id="mazeScene" aria-label="めいろ">
    <div id="stage">
      <img id="mazeImg" src="assets/img/maze.png" alt="めいろ" />
      <canvas id="mazeCanvas"></canvas>
      <div id="travelLock"></div>
      <div id="grid"></div>
    </div>
    <div id="hud">
      <div class="hudTitle">BOOHA<br>ADVENTURE</div>
      <div id="coordPill" class="pill">
        <div class="coordSmall">画像座標 (1600×900)</div>
        <div class="coordBig" id="coordText">x: —  y: —</div>
        <div class="coordSmall" style="margin-top:6px;opacity:.85;">クリックでコピー</div>
      </div>
    </div>
    <div id="bryanTip">
      座標は <strong>画像サイズ 1600×900</strong> で固定されています。<br>
      マウスを動かして座標を確認し、クリックでコピーできます。
    </div>
    <button id="bryanBtn" type="button" aria-label="Bryan mode">BRYAN</button>
    <button id="backBtn" type="button" aria-label="もどる">もどる</button>
  </section>
  <div id="cpScrim"></div>
  <div id="cpPopup" role="dialog" aria-modal="true" aria-labelledby="cpPopupTitle">
    <div id="cpPopupBar"></div>
    <p class="cp-week-label" id="cpWeekLabel">今週のブーハー</p>
    <h2 id="cpPopupTitle">GAMES</h2>
    <p id="cpPopupDate"></p>
    <div id="cpWeekBadge"></div>
    <div class="cp-icons">
      <button class="cp-icon-btn" id="iconPreBoo" type="button" aria-label="プレブー">
        <img class="cp-icon-img" src="assets/img/pre-boo.png" alt="プレブー" />

      </button>
      <button class="cp-icon-btn" id="iconBooTree" type="button" aria-label="ブーカリキュラム">
        <img class="cp-icon-img" src="assets/img/boo-tree.png" alt="ブーカリキュラム" />
        <span class="cp-icon-label">ブーカリ<br>キュラム</span>
      </button>
      <button class="cp-icon-btn" id="iconContTree" type="button" aria-label="ブーコンティニュアム">
        <img class="cp-icon-img" src="assets/img/cont-tree.png" alt="ブーコンティニュアム" />
        <span class="cp-icon-label">ブーコン<br>ティニュアム</span>
      </button>
    </div>
    <button id="cpCloseBtn" type="button">とじる ✕</button>
  </div>
  <div id="fade" aria-hidden="true"></div>
</div>
<audio id="bgMusic" src="assets/audio/sneaky.mp3" loop preload="auto"></audio>
<script type="module">

import { getCurrentCurriculumWeek, getAcademicWeekNumber } from './js/calendar.js';

const BRYAN_PASS = 'him141amra803';
const IMG_W = 1600;
const IMG_H = 900;

const CURRENT_WEEK_DATA = getCurrentCurriculumWeek();
const CURRENT_WEEK = getAcademicWeekNumber(CURRENT_WEEK_DATA);

const OPEN_WEEKS = [
  Math.max(1, CURRENT_WEEK - 1),
  CURRENT_WEEK,
  Math.min(48, CURRENT_WEEK + 1)
];

const GHOST_TRAVEL_MS = 3800;

// ── Ghost intro: slow elegant descent then glide to checkpoint ──
// One smooth continuous animation, no abrupt phase switches.
// Phase 1 (dropping): ghost floats down from above with gentle horizontal sway — slow & dreamlike
// Phase 2 (hovering): brief pause floating at center, gently bobbing
// Phase 3 (settling): smooth cubic ease glide to checkpoint
const INTRO_GLOW_MS   = 2600;
const INTRO_DROP_MS   = 3800;   // phase 1: slow dreamy descent
const INTRO_HOVER_MS  = 1200;   // phase 2: hover & breathe at center
const INTRO_SETTLE_MS = 2200;   // phase 3: long smooth glide to CP
const INTRO_TOP_CENTER_START = { ix: IMG_W / 2, iy: -100 };
const INTRO_HOVER_LAND = { ix: IMG_W / 2, iy: 300 }; // where ghost hovers

const GHOSTS = [
  'assets/img/booha_ghost.png',
  'assets/img/blue-boo.png',
  'assets/img/green-boo.png',
  'assets/img/pink-boo.png',
  'assets/img/purple-boo.png'
];

// ── Trees — drawn preserving natural aspect ratio ──
// Target width in image-space pixels (scales with map).
// 2.5× ghost diameter in image-space = 2.5 * (56px / coverScale) but we keep
// it simple: define a target IMAGE-SPACE width and let getCover do the rest.
const HW_TREE_IW = 100;   // homework tree target width in image-space px
const KR_TREE_IW = 78;   // karasuki tree target width in image-space px

const MONTH_COLORS = [
  ['#ff3bbd','#ff79d7'],['#ff6b3b','#ffaa5e'],['#3bc8ff','#a8edff'],
  ['#3bff8a','#b2ffda'],['#ffd700','#fff176'],['#3b6fff','#90aaff'],
  ['#a03bff','#d49aff'],['#ff9f3b','#ffd08a'],['#3bffee','#a8fff8'],
  ['#c8ff3b','#e8ffaa'],['#ff3b6f','#ff85a1'],
];

const CHECKPOINTS = [
  {w: 1, ix: 493, iy:350},{w: 2, ix:891, iy:402},{w: 3, ix:1156, iy:354},
  {w: 4, ix: 952, iy:453},{w: 5, ix: 635, iy:377},{w: 6, ix: 624, iy:576},
  {w: 7, ix:1219, iy:500},{w: 8, ix:1049, iy:369},{w: 9, ix:1025, iy:579},
  {w:10, ix: 443, iy:478},{w:11, ix:1189, iy:565},{w:12, ix: 755, iy:564},
  {w:13, ix: 938, iy:354},{w:14, ix: 592, iy:434},{w:15, ix: 894, iy:601},
  {w:16, ix: 816, iy:393},{w:17, ix:1204, iy:397},{w:18, ix: 444, iy:542},
  {w:19, ix: 761, iy:354},{w:20, ix:1200, iy:453},{w:21, ix: 716, iy:436},
  {w:22, ix:1226, iy:370},{w:23, ix: 872, iy:502},{w:24, ix: 432, iy:385},
  {w:25, ix:1010, iy:412},{w:26, ix: 613, iy:482},{w:27, ix:1127, iy:453},
  {w:28, ix: 559, iy:392},{w:29, ix:1095, iy:502},{w:30, ix: 500, iy:438},

// Karasuki state machine:
// Phase 0: show img1, wait 25s
// Phase 1: crossfade img1→img2 (1.2s)
// Phase 2: show img2, wait 25s
// Phase 3: crossfade img2→img1 (1.2s)
// Phase 4: visible img1, slowly fade OUT (1.5s) — puff of crosses
// Phase 5: INVISIBLE, wait 15s
// Phase 6: fade back IN (1.5s)
// → back to phase 0
let karasukiPhase=0, karasukiBlend=0, karasukiOpacity=1, karasukiLastSwap=0;
const KARASUKI_SWAP_MS=25000, KARASUKI_FADE_MS=1200, KARASUKI_GONE_MS=15000, KARASUKI_PUFF_MS=1500;
// Puff particles: burst when tree disappears
let karasukiPuffParticles=[];

function spawnKarasukiPuff(cx,cy){
  karasukiPuffParticles=[];
  for(let i=0;i<28;i++){
    const angle=Math.random()*Math.PI*2;
    const speed=1.2+Math.random()*2.8;
    karasukiPuffParticles.push({
      x:cx,y:cy,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-1.5,
      life:1,size:3+Math.random()*5,
      color:i%3===0?'#aaffcc':i%3===1?'#dd99ff':'#9933ff'
    });
  }
}

function tickKarasuki(now,cx,cy){
  if(karasukiLastSwap===0){karasukiLastSwap=now;return;}
  const el=now-karasukiLastSwap;
  if(karasukiPhase===0){
    karasukiOpacity=1;karasukiBlend=0;
    if(el>=KARASUKI_SWAP_MS){karasukiPhase=1;karasukiLastSwap=now;}
  } else if(karasukiPhase===1){
    karasukiBlend=Math.min(el/KARASUKI_FADE_MS,1);
    if(karasukiBlend>=1){karasukiPhase=2;karasukiLastSwap=now;}
  } else if(karasukiPhase===2){
    karasukiOpacity=1;karasukiBlend=1;
    if(el>=KARASUKI_SWAP_MS){karasukiPhase=3;karasukiLastSwap=now;}
  } else if(karasukiPhase===3){
    karasukiBlend=Math.max(1-el/KARASUKI_FADE_MS,0);
    if(karasukiBlend<=0){karasukiPhase=4;karasukiLastSwap=now;}
  } else if(karasukiPhase===4){
    // Fade out with puff
    karasukiOpacity=Math.max(1-el/KARASUKI_PUFF_MS,0);
    if(el>50&&karasukiPuffParticles.length===0) spawnKarasukiPuff(cx,cy);
    if(karasukiOpacity<=0){karasukiPhase=5;karasukiLastSwap=now;karasukiOpacity=0;}
  } else if(karasukiPhase===5){
    karasukiOpacity=0;
    if(el>=KARASUKI_GONE_MS){karasukiPhase=6;karasukiLastSwap=now;}
  } else if(karasukiPhase===6){
    karasukiOpacity=Math.min(el/KARASUKI_PUFF_MS,1);
    if(karasukiOpacity>=1){karasukiPhase=0;karasukiLastSwap=now;karasukiPuffParticles=[];}
  }
  // Tick puff particles
  for(const p of karasukiPuffParticles){
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.04;p.life-=0.018;
  }
  karasukiPuffParticles=karasukiPuffParticles.filter(p=>p.life>0);
}

// Wanderers
const GHOST_SIZE=56,WANDER_TRAIL_MAX=60;
let wanderers=[];

function buildWanderers(){
  wanderers=[];
  for(let gi=0;gi<GHOSTS.length;gi++){
    if(gi===activeGhostIdx)continue;
    wanderers.push(createWanderer(gi,wanderers.length*1400));
  }
}

function createWanderer(ghostIdx,delayMs){
  const side=Math.floor(Math.random()*4);
  let sx,sy;
  switch(side){ case 0:sx=Math.random()*window.innerWidth;sy=-GHOST_SIZE;break; case 1:sx=window.innerWidth+GHOST_SIZE;sy=Math.random()*window.innerHeight;break; case 2:sx=Math.random()*window.innerWidth;sy=window.innerHeight+GHOST_SIZE;break; default:sx=-GHOST_SIZE;sy=Math.random()*window.innerHeight; }
  const exitSide=(side+2)%4;
  let tx,ty;
  switch(exitSide){ case 0:tx=Math.random()*window.innerWidth;ty=-GHOST_SIZE;break; case 1:tx=window.innerWidth+GHOST_SIZE;ty=Math.random()*window.innerHeight;break; case 2:tx=Math.random()*window.innerWidth;ty=window.innerHeight+GHOST_SIZE;break; default:tx=-GHOST_SIZE;ty=Math.random()*window.innerHeight; }
  const dur=14000+Math.random()*12000;
  return{ghostIdx,sx,sy,tx,ty,startTime:null,delayMs,dur,wobbleAmp:18+Math.random()*24,wobbleFreq:.25+Math.random()*.35,wobblePhase:Math.random()*Math.PI*2,bobAmp:5+Math.random()*6,bobFreq:1.2+Math.random()*.8,trail:[],done:false,cx:sx,cy:sy,opacity:0};
}

function tickWanderers(nowMs){
  for(let i=0;i<wanderers.length;i++){
    const w=wanderers[i];
    if(w.done)continue;
    if(w.startTime===null){if(nowMs<w.delayMs)continue;w.startTime=nowMs;}
    const elapsed=nowMs-w.startTime,t=Math.min(elapsed/w.dur,1),et=easeInOut(t);
    const dx=w.tx-w.sx,dy=w.ty-w.sy,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;
    const sec=nowMs/1000,wob=Math.sin(sec*w.wobbleFreq*Math.PI*2+w.wobblePhase)*w.wobbleAmp,bob=Math.sin(sec*w.bobFreq*Math.PI*2)*w.bobAmp;
    const bx=w.sx+dx*et+nx*wob,by=w.sy+dy*et+ny*wob+bob;
    w.opacity=Math.min(t*6,1,(1-t)*6)*.82;
    if(Math.random()<.35){
      const col=MONTH_COLORS[Math.floor(Math.random()*MONTH_COLORS.length)];
      w.trail.push({x:bx,y:by,life:1,size:2+Math.random()*3.5,color:col[Math.random()<.5?0:1],dx:(Math.random()-.5)*.3,dy:-Math.random()*.4});
      if(w.trail.length>WANDER_TRAIL_MAX)w.trail.shift();
    }
    w.cx=bx;w.cy=by;
    if(t>=1)w.done=true;
  }
  for(let i=0;i<wanderers.length;i++){
    if(wanderers[i].done){
      const gi=wanderers[i].ghostIdx;
      const delay=performance.now()+3000+Math.random()*8000;
      wanderers[i]=createWanderer(gi,delay);wanderers[i].startTime=null;
    }
  }
}

function easeInOut(t){ return t<.5?2*t*t:-1+(4-2*t)*t; }

function drawWanderers(nowMs){
  for(const w of wanderers){
    if(w.opacity<=0)continue;
    const img=ghostImgs[w.ghostIdx];
    if(!img||!img.complete||!img.naturalWidth)continue;
    const gR=GHOST_SIZE/2,gx=w.cx,gy=w.cy;
    const col1=MONTH_COLORS[w.ghostIdx%MONTH_COLORS.length][0],col2=MONTH_COLORS[w.ghostIdx%MONTH_COLORS.length][1];
    const sec=nowMs/1000,pulseG=.5+.5*Math.sin(sec*2.1+w.ghostIdx*.8);
    ctx.save();
    for(let pi=w.trail.length-1;pi>=0;pi--){
      const p=w.trail[pi];
      const gr=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*2.3);
      gr.addColorStop(0,p.color);gr.addColorStop(1,'transparent');
      ctx.globalAlpha=p.life*.35*w.opacity;ctx.fillStyle=gr;ctx.beginPath();ctx.arc(p.x,p.y,p.size*2.3,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=p.life*.70*w.opacity;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,p.size*.34,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;p.life-=.018;p.x+=p.dx;p.y+=p.dy;
    }
    w.trail=w.trail.filter(p=>p.life>0);
    ctx.globalAlpha=w.opacity*(.18+pulseG*.09);
    const ga=ctx.createRadialGradient(gx,gy+3,0,gx,gy+3,gR*2);
    ga.addColorStop(0,col1);ga.addColorStop(.5,col2);ga.addColorStop(1,'transparent');
    ctx.fillStyle=ga;ctx.beginPath();ctx.arc(gx,gy+3,gR*2,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=w.opacity;ctx.drawImage(img,gx-gR,gy-gR,gR*2,gR*2);
    ctx.globalAlpha=1;ctx.restore();
  }
}

// Easing functions
function ease(t){ return t<.5?2*t*t:-1+(4-2*t)*t; }
function easeOutCubic(t){ return 1-Math.pow(1-t,3); }
function easeInOutCubic(t){ return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; }

// ── Draw trees ──────────────────────────────────────────────────────────────
function drawTrees(now){
  if(!mazeStarted)return;
  const sec=now/1000;
  const{scale:cvScale}=getCover();

  // Helper: get CSS draw rect for a tree image, centered on image-space point (ix,iy)
  // targetIW = desired width in image-space units (preserves aspect ratio)
  function treeRect(img,ix,iy,targetIW){
    const{x,y}=imgToCSS(ix,iy);
    const nat=img.naturalWidth&&img.naturalHeight?img.naturalWidth/img.naturalHeight:1;
    const cssW=targetIW*cvScale;
    const cssH=cssW/nat;
    return{x,y,w:cssW,h:cssH};
  }

  // ── Homework tree (x979, y305) — welcoming warm glow ──────────────────────
  if(homeworkImg.complete&&homeworkImg.naturalWidth>0){
    const r=treeRect(homeworkImg,979,305,HW_TREE_IW);
    const cx=r.x, cy=r.y;
    const pulse=.5+.5*Math.sin(sec*1.4), pulse2=.5+.5*Math.sin(sec*.9+1.1);
    ctx.save();
    // Soft ground shadow ellipse
    ctx.globalAlpha=.14+pulse*.04;
    const sg=ctx.createRadialGradient(cx,cy+r.h*.42,0,cx,cy+r.h*.42,r.w*.9);
    sg.addColorStop(0,'rgba(0,0,0,.5)');sg.addColorStop(1,'transparent');
    ctx.fillStyle=sg;ctx.beginPath();ctx.ellipse(cx,cy+r.h*.44,r.w*.7,r.h*.18,0,0,Math.PI*2);ctx.fill();
    // Wide warm amber aura
    ctx.globalAlpha=.08+pulse*.05;
    const a1=ctx.createRadialGradient(cx,cy,0,cx,cy,r.w*2.2);
    a1.addColorStop(0,'#ffe066');a1.addColorStop(.4,'#ffbb33');a1.addColorStop(1,'transparent');
    ctx.fillStyle=a1;ctx.beginPath();ctx.arc(cx,cy,r.w*2.2,0,Math.PI*2);ctx.fill();
    // Mid warm glow
    ctx.globalAlpha=.18+pulse2*.12;
    const a2=ctx.createRadialGradient(cx,cy-r.h*.2,0,cx,cy-r.h*.2,r.w*1.4);
    a2.addColorStop(0,'#fff9a0');a2.addColorStop(.5,'#ffdd55');a2.addColorStop(1,'transparent');
    ctx.fillStyle=a2;ctx.beginPath();ctx.arc(cx,cy-r.h*.2,r.w*1.4,0,Math.PI*2);ctx.fill();
    // Inner lantern core
    ctx.globalAlpha=.25+pulse*.16;
    const a3=ctx.createRadialGradient(cx,cy-r.h*.25,0,cx,cy-r.h*.25,r.w*.72);
    a3.addColorStop(0,'#ffffff');a3.addColorStop(.35,'#ffe888');a3.addColorStop(1,'transparent');
    ctx.fillStyle=a3;ctx.beginPath();ctx.arc(cx,cy-r.h*.25,r.w*.72,0,Math.PI*2);ctx.fill();
    // Twinkling sparkle crosses
    for(let i=0;i<6;i++){
      const angle=(i/6)*Math.PI*2+sec*.4;
      const twinkle=.4+.6*Math.abs(Math.sin(sec*2.2+i*1.1));
      const orb=r.w*(.65+.12*Math.sin(sec*.8+i));
      const fx=cx+Math.cos(angle)*orb, fy=(cy-r.h*.2)+Math.sin(angle)*orb*.6;
      ctx.globalAlpha=twinkle*.58;ctx.strokeStyle='#fff8c0';ctx.lineWidth=1.0;
      ctx.shadowBlur=6;ctx.shadowColor='#ffe566';
      const sl=3+twinkle*2.5;
      ctx.beginPath();ctx.moveTo(fx,fy-sl);ctx.lineTo(fx,fy+sl);ctx.moveTo(fx-sl,fy);ctx.lineTo(fx+sl,fy);ctx.stroke();
      ctx.shadowBlur=0;
    }
    // Draw image at natural ratio
    ctx.globalAlpha=1;
    ctx.drawImage(homeworkImg, cx-r.w/2, cy-r.h/2, r.w, r.h);
    ctx.restore();
  }

  // ── Karasuki tree (x535, y300) — spooky glow + crossfade + disappear ──────
  {
    const refImg = karasuki1Img.complete&&karasuki1Img.naturalWidth>0 ? karasuki1Img
                 : karasuki2Img.complete&&karasuki2Img.naturalWidth>0 ? karasuki2Img : null;
    const{x:cx,y:cy}=imgToCSS(535,300);
    // Compute draw rect using the available image
    let drawW=KR_TREE_IW*cvScale, drawH=drawW;
    if(refImg) drawH=drawW/( refImg.naturalWidth/refImg.naturalHeight );

    // Tick state machine (pass CSS center for puff spawn)
    tickKarasuki(now,cx,cy);

    const flicker=.82+.18*Math.sin(sec*7.3)*Math.sin(sec*4.1+.7);
    const pulse=.5+.5*Math.sin(sec*.85), pulse2=.5+.5*Math.sin(sec*1.7+2.0);
    // All spooky glow and particles use karasukiOpacity so they fade with the tree
    const kOp=karasukiOpacity;

    ctx.save();
    if(kOp>0){
      // Ground mist
      ctx.globalAlpha=(.18+pulse*.06)*kOp;
      const sg=ctx.createRadialGradient(cx,cy+drawH*.42,0,cx,cy+drawH*.42,drawW*1.2);
      sg.addColorStop(0,'rgba(40,0,60,.75)');sg.addColorStop(1,'transparent');
      ctx.fillStyle=sg;ctx.beginPath();ctx.ellipse(cx,cy+drawH*.44,drawW*.8,drawH*.17,0,0,Math.PI*2);ctx.fill();
      // Far purple fog
      ctx.globalAlpha=(.07+pulse*.04)*flicker*kOp;
      const s1=ctx.createRadialGradient(cx,cy,0,cx,cy,drawW*2.6);
      s1.addColorStop(0,'#6600aa');s1.addColorStop(.45,'#330066');s1.addColorStop(1,'transparent');
      ctx.fillStyle=s1;ctx.beginPath();ctx.arc(cx,cy,drawW*2.6,0,Math.PI*2);ctx.fill();
      // Sickly green mid
      ctx.globalAlpha=(.13+pulse2*.10)*flicker*kOp;
      const s2=ctx.createRadialGradient(cx,cy-drawH*.2,0,cx,cy-drawH*.2,drawW*1.4);
      s2.addColorStop(0,'#44ff66');s2.addColorStop(.4,'#00aa33');s2.addColorStop(1,'transparent');
      ctx.fillStyle=s2;ctx.beginPath();ctx.arc(cx,cy-drawH*.2,drawW*1.4,0,Math.PI*2);ctx.fill();
      // Inner purple core
      ctx.globalAlpha=(.20+pulse*.14)*flicker*kOp;
      const s3=ctx.createRadialGradient(cx,cy-drawH*.25,0,cx,cy-drawH*.25,drawW*.68);
      s3.addColorStop(0,'#ddaaff');s3.addColorStop(.4,'#8833cc');s3.addColorStop(1,'transparent');
      ctx.fillStyle=s3;ctx.beginPath();ctx.arc(cx,cy-drawH*.25,drawW*.68,0,Math.PI*2);ctx.fill();
      // Rising wisps
      for(let i=0;i<5;i++){
        const wt=((sec*.22+i*.2)%1);
        const wx=cx+Math.sin(sec*1.4+i*1.25)*drawW*.6;
        const wy=(cy+drawH*.3)-wt*drawH*1.3;
        const wa=(wt<.2?wt/.2:wt>.7?(1-wt)/.3:1)*kOp;
        ctx.globalAlpha=wa*.22*flicker;
        const wg=ctx.createRadialGradient(wx,wy,0,wx,wy,10+Math.sin(sec+i)*3);
        wg.addColorStop(0,i%2===0?'#88ffaa':'#cc88ff');wg.addColorStop(1,'transparent');
        ctx.fillStyle=wg;ctx.beginPath();ctx.arc(wx,wy,10+Math.sin(sec+i)*3,0,Math.PI*2);ctx.fill();
      }
      // Orbiting spooky crosses (burst outward when disappearing)
      const crossR = karasukiPhase===4 ? drawW*(.80+(1-kOp)*2.5)
                   : karasukiPhase===6 ? drawW*(.80+(1-kOp)*2.5)
                   : drawW*.80;
      for(let i=0;i<4;i++){
        const angle=(i/4)*Math.PI*2+sec*.55, twinkle=.3+.7*Math.abs(Math.sin(sec*1.8+i*.9));
        const r=crossR*(1+.12*Math.sin(sec*.6+i));
        const fx=cx+Math.cos(angle)*r, fy=(cy-drawH*.2)+Math.sin(angle)*r*.7;
        ctx.globalAlpha=twinkle*.50*flicker*kOp;
        ctx.strokeStyle=i%2===0?'#aaffcc':'#dd99ff';ctx.lineWidth=1.0;
        ctx.shadowBlur=8;ctx.shadowColor=i%2===0?'#00ff66':'#9933ff';
        const sl=3+twinkle*2.8;
        ctx.beginPath();ctx.moveTo(fx,fy-sl);ctx.lineTo(fx,fy+sl);ctx.moveTo(fx-sl,fy);ctx.lineTo(fx+sl,fy);ctx.stroke();
        ctx.shadowBlur=0;
      }
      // Draw tree images with crossfade, modulated by karasukiOpacity
      if(karasuki1Img.complete&&karasuki1Img.naturalWidth>0&&karasukiBlend<1){
        ctx.globalAlpha=(1-karasukiBlend)*kOp;
        ctx.drawImage(karasuki1Img,cx-drawW/2,cy-drawH/2,drawW,drawH);
      }
      if(karasuki2Img.complete&&karasuki2Img.naturalWidth>0&&karasukiBlend>0){
        ctx.globalAlpha=karasukiBlend*kOp;
        ctx.drawImage(karasuki2Img,cx-drawW/2,cy-drawH/2,drawW,drawH);
      }
    }
    // Puff particles (drawn even when kOp=0, they have their own life)
    for(const p of karasukiPuffParticles){
      const pg=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*2);
      pg.addColorStop(0,p.color);pg.addColorStop(1,'transparent');
      ctx.globalAlpha=p.life*.7;ctx.fillStyle=pg;ctx.beginPath();ctx.arc(p.x,p.y,p.size*2,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=p.life*.9;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,p.size*.3,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;ctx.restore();
  }
}

// ── Draw frame ───────────────────────────────────────────────────────────────
function drawFrame(now){
  ctx.clearRect(0,0,cssW,cssH);
  if(!mazeStarted)return;
  const sec=now/1000,cpState={};

  if(introPhase==='allGlow'){
    const el=now-introGlowStart,showEnd=INTRO_GLOW_MS*.62;
    let baseA=el<showEnd?1:Math.max(0,1-(el-showEnd)/(INTRO_GLOW_MS-showEnd));
    CHECKPOINTS.forEach(cp=>{cpState[cp.w]={alpha:OPEN_WEEKS.includes(cp.w)?1:baseA*.78,extra:1.5};});
    if(el>=INTRO_GLOW_MS){
      introPhase='dropping';introDropStart=now;
      ghostIX=INTRO_TOP_CENTER_START.ix;ghostIY=INTRO_TOP_CENTER_START.iy;
      ghostVisible=true;setTravelLock(true);
    }

  } else if(introPhase==='dropping'){
    OPEN_WEEKS.forEach(w=>{cpState[w]={alpha:1,extra:1.0};});
    const prog=Math.min((now-introDropStart)/INTRO_DROP_MS,1);
    // Smooth cubic ease — no overshoot, dreamy float down
    const et=easeOutCubic(prog);
    // Very gentle lateral sway — one slow, smooth sine wave
    const sway=Math.sin(prog*Math.PI)*30;
    ghostIX=INTRO_TOP_CENTER_START.ix+sway;
    ghostIY=INTRO_TOP_CENTER_START.iy+(INTRO_HOVER_LAND.iy-INTRO_TOP_CENTER_START.iy)*et;
    if(Math.random()<.25)addTrail(ghostIX,ghostIY);
    if(prog>=1){
      introHoverIX=ghostIX;introHoverIY=ghostIY;
      introPhase='hovering';introHoverStart=now;
    }

  } else if(introPhase==='hovering'){
    OPEN_WEEKS.forEach(w=>{cpState[w]={alpha:1,extra:1.0};});
    const prog=Math.min((now-introHoverStart)/INTRO_HOVER_MS,1);
    // Just breathe in place — tiny vertical bob, no position change
    ghostIX=introHoverIX;
    ghostIY=introHoverIY; // bob is applied in the draw section already
    if(prog>=1){
      introPhase='settling';introSettleStart=now;
    }

  } else if(introPhase==='settling'){
    OPEN_WEEKS.forEach(w=>{cpState[w]={alpha:1,extra:1.0};});
    const prog=Math.min((now-introSettleStart)/INTRO_SETTLE_MS,1);
    // Smooth cubic — glides elegantly to checkpoint
    const et=easeInOutCubic(prog);
    ghostIX=introHoverIX+(startCP.ix-introHoverIX)*et;
    ghostIY=introHoverIY+(startCP.iy-introHoverIY)*et;
    if(Math.random()<.22)addTrail(ghostIX,ghostIY);
    if(prog>=1){
      introPhase='done';ghostIX=startCP.ix;ghostIY=startCP.iy;
      ghostSrcIX=ghostIX;ghostSrcIY=ghostIY;ghostDstIX=ghostIX;ghostDstIY=ghostIY;ghostT=1;
      setTravelLock(false);showPopupAtCP(startCP);
    }

  } else if(introPhase==='done'){
    OPEN_WEEKS.forEach(w=>{cpState[w]={alpha:1,extra:0};});
    if(bryanOn) CHECKPOINTS.forEach(cp=>{if(!cpState[cp.w])cpState[cp.w]={alpha:.65,extra:.15};});
    if(ghostT<1){
      const el=now-ghostAnimStart;ghostT=Math.min(el/GHOST_TRAVEL_MS,1);
      const et=ease(ghostT);
      ghostIX=ghostSrcIX+(ghostDstIX-ghostSrcIX)*et;ghostIY=ghostSrcIY+(ghostDstIY-ghostSrcIY)*et;
      if(Math.random()<.28)addTrail(ghostIX,ghostIY);
      if(ghostT>=1&&pendingPopupCP){ghostIX=ghostDstIX;ghostIY=ghostDstIY;setTravelLock(false);showPopupAtCP(pendingPopupCP);pendingPopupCP=null;}
    }
  }

  // Trees (behind everything else)
  drawTrees(now);

  // Wanderers
  tickWanderers(now);drawWanderers(now);

  // Trail
  for(let i=trail.length-1;i>=0;i--){
    const p=trail[i];const{x,y}=imgToCSS(p.ix,p.iy);
    const gr=ctx.createRadialGradient(x,y,0,x,y,p.size*2.3);
    gr.addColorStop(0,p.color);gr.addColorStop(1,'transparent');
    ctx.globalAlpha=p.life*.40;ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,p.size*2.3,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=p.life*.80;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,p.size*.34,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;p.life-=.016;p.ix+=p.dx;p.iy+=p.dy;
  }
  trail=trail.filter(p=>p.life>0);

  // Checkpoints
  const{scale:coverScale}=getCover();
  CHECKPOINTS.forEach((cp,cpIdx)=>{
    const state=cpState[cp.w];if(!state||state.alpha<=.01)return;
    const{x,y}=imgToCSS(cp.ix,cp.iy);
    const col1=monthPrimary(cp.w),col2=monthSecondary(cp.w);
    const pulse=.5+.5*Math.sin(sec*2.1+cp.w*.73),pulse2=.5+.5*Math.sin(sec*1.35+cp.w*.41+1.3);
    const baseR=7,glowR=baseR+pulse*3.5*(1+state.extra*.6),alpha=state.alpha;
    ctx.save();
    ctx.globalAlpha=alpha*(.14+pulse*.10);
    const hazeR=glowR*4.5,haze=ctx.createRadialGradient(x,y,0,x,y,hazeR);
    haze.addColorStop(0,col1);haze.addColorStop(.5,col1);haze.addColorStop(1,'transparent');
    ctx.fillStyle=haze;ctx.beginPath();ctx.arc(x,y,hazeR,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=alpha*(.10+pulse2*.09);
    const haze2=ctx.createRadialGradient(x+glowR*.3,y-glowR*.2,0,x,y,hazeR*.8);
    haze2.addColorStop(0,col2);haze2.addColorStop(.5,col2);haze2.addColorStop(1,'transparent');
    ctx.fillStyle=haze2;ctx.beginPath();ctx.arc(x,y,hazeR*.8,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=alpha*(.48+pulse2*.22);
    const midR=glowR*2.0,midG=ctx.createRadialGradient(x,y,glowR*.28,x,y,midR);
    midG.addColorStop(0,'transparent');midG.addColorStop(.35,col1);midG.addColorStop(.65,col2);midG.addColorStop(1,'transparent');
    ctx.fillStyle=midG;ctx.beginPath();ctx.arc(x,y,midR,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=alpha*(.85+pulse*.15);
    const coronaR=glowR*1.10,corona=ctx.createRadialGradient(x,y,0,x,y,coronaR);
    corona.addColorStop(0,'#fff');corona.addColorStop(.2,col1);corona.addColorStop(.62,col2);corona.addColorStop(1,'transparent');
    ctx.fillStyle=corona;ctx.beginPath();ctx.arc(x,y,coronaR,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=alpha*(.95+pulse*.05);ctx.shadowBlur=24;ctx.shadowColor=col1;ctx.fillStyle=col1;
    ctx.beginPath();ctx.arc(x,y,glowR*.44,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=14;ctx.shadowColor=col2;ctx.fillStyle=col2;ctx.beginPath();ctx.arc(x,y,glowR*.26,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.globalAlpha=alpha;
    const coreG=ctx.createRadialGradient(x,y,0,x,y,glowR*.16);
    coreG.addColorStop(0,'rgba(255,255,255,1)');coreG.addColorStop(.7,'rgba(255,255,255,.75)');coreG.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=coreG;ctx.beginPath();ctx.arc(x,y,glowR*.16,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=alpha*(.42+pulse*.30);ctx.strokeStyle='rgba(255,255,255,0.95)';ctx.lineWidth=.9;ctx.shadowBlur=9;ctx.shadowColor=col1;
    const starLen=glowR*(.72+pulse*.28),dL=starLen*.38;
    ctx.beginPath();
    ctx.moveTo(x,y-starLen*.18);ctx.lineTo(x,y-starLen);ctx.moveTo(x,y+starLen*.18);ctx.lineTo(x,y+starLen);
    ctx.moveTo(x-starLen*.18,y);ctx.lineTo(x-starLen,y);ctx.moveTo(x+starLen*.18,y);ctx.lineTo(x+starLen,y);
    ctx.moveTo(x-dL*.1,y-dL*.1);ctx.lineTo(x-dL,y-dL);ctx.moveTo(x+dL*.1,y-dL*.1);ctx.lineTo(x+dL,y-dL);
    ctx.moveTo(x-dL*.1,y+dL*.1);ctx.lineTo(x-dL,y+dL);ctx.moveTo(x+dL*.1,y+dL*.1);ctx.lineTo(x+dL,y+dL);
    ctx.stroke();ctx.shadowBlur=0;
    CP_FAIRIES[cpIdx].forEach(f=>{
      const angle=f.angle+sec*f.speed,twinkle=.35+.65*Math.abs(Math.sin(sec*f.twinkleSpeed+f.twinklePhase));
      const r=f.orbit*coverScale*(.82+state.extra*.08)*(.92+.08*Math.sin(sec*1.1+f.phase));
      const fx=x+Math.cos(angle)*r,fy=y+Math.sin(angle)*r*.84;
      const fColor=f.useSecondary?col2:col1,fAlpha=twinkle*alpha*(.70+state.extra*.15),fSize=f.size*coverScale*(.65+twinkle*.45);
      ctx.globalAlpha=fAlpha*.42;
      const fg=ctx.createRadialGradient(fx,fy,0,fx,fy,fSize*3.2);
      fg.addColorStop(0,fColor);fg.addColorStop(1,'transparent');
      ctx.fillStyle=fg;ctx.beginPath();ctx.arc(fx,fy,fSize*3.2,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=fAlpha;ctx.strokeStyle='#fff';ctx.lineWidth=fSize*.55;ctx.shadowBlur=6;ctx.shadowColor=fColor;
      const sl=fSize*1.9;ctx.beginPath();ctx.moveTo(fx,fy-sl);ctx.lineTo(fx,fy+sl);ctx.moveTo(fx-sl,fy);ctx.lineTo(fx+sl,fy);ctx.stroke();
      ctx.globalAlpha=fAlpha;ctx.fillStyle='#fff';ctx.shadowBlur=5;ctx.shadowColor=fColor;ctx.beginPath();ctx.arc(fx,fy,fSize*.48,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    });
    ctx.globalAlpha=1;ctx.restore();
  });

  // Active ghost
  if(ghostVisible){
    const bob=Math.sin(sec*1.85)*3.5;
    const{x:gx,y:gy}=imgToCSS(ghostIX,ghostIY);
    const gR=28,pulseG=.5+.5*Math.sin(sec*2.1),gcol1=monthPrimary(activeWeek),gcol2=monthSecondary(activeWeek);
    ctx.save();
    ctx.globalAlpha=.20+pulseG*.10;
    const ga=ctx.createRadialGradient(gx,gy+3,0,gx,gy+3,gR*2.0);
    ga.addColorStop(0,gcol1);ga.addColorStop(.5,gcol2);ga.addColorStop(1,'transparent');
    ctx.fillStyle=ga;ctx.beginPath();ctx.arc(gx,gy+3,gR*2.0,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=.14+pulseG*.06;
    const gs=ctx.createRadialGradient(gx,gy+gR*.7,0,gx,gy+gR*.7,gR*.85);
    gs.addColorStop(0,'rgba(0,0,0,.5)');gs.addColorStop(1,'transparent');
    ctx.fillStyle=gs;ctx.beginPath();ctx.arc(gx,gy+gR*.7,gR*.85,0,Math.PI*2);ctx.fill();
    ctx.restore();
    ctx.save();
    const activeImg=ghostImgs[activeGhostIdx];
    if(activeImg&&activeImg.complete&&activeImg.naturalWidth>0)ctx.drawImage(activeImg,gx-gR,gy-gR+bob,gR*2,gR*2);
    else{ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(gx,gy+bob,gR*.7,0,Math.PI*2);ctx.fill();}
    ctx.restore();
  }

  // Bryan crosshair
  if(bryanOn&&bMouseX>=0){
    ctx.save();ctx.strokeStyle='rgba(255,255,255,.50)';ctx.lineWidth=1;ctx.shadowBlur=8;ctx.shadowColor='rgba(255,255,255,.25)';ctx.setLineDash([5,5]);
    ctx.beginPath();ctx.moveTo(0,bMouseY);ctx.lineTo(cssW,bMouseY);ctx.stroke();
    ctx.beginPath();ctx.moveTo(bMouseX,0);ctx.lineTo(bMouseX,cssH);ctx.stroke();
    ctx.restore();
  }
}

function loop(now){drawFrame(now);rafHandle=requestAnimationFrame(loop);}

const HIT_R=40;
function hitTest(clientX,clientY){
  const rect=canvas.getBoundingClientRect();
  const cx=clientX-rect.left,cy=clientY-rect.top;
  const{ix,iy}=cssToImg(cx,cy);
  const pool=bryanOn?CHECKPOINTS:CHECKPOINTS.filter(c=>OPEN_WEEKS.includes(c.w));
  let best=null,bestD=Infinity;
  pool.forEach(cp=>{const d=Math.hypot(cp.ix-ix,cp.iy-iy);if(d<HIT_R&&d<bestD){bestD=d;best=cp;}});
  return best;
}

function showPopupAtCP(cp){
  const diff=cp.w-CURRENT_WEEK;
  cpWeekLabel.textContent=diff===0?'今週のブーハー':diff<0?'先週のブーハー':'来週のブーハー';
  const col1=monthPrimary(cp.w),col2=monthSecondary(cp.w);
  cpPopupBar.style.background=`linear-gradient(90deg,${col1},${col2})`;
  cpPopupBar.style.boxShadow=`0 0 14px ${col1}88,0 0 28px ${col2}55`;
  cpTitle.textContent='GAMES';
  const weekStart=new Date(CURRENT_WEEK_DATA.weekStart);
  const start=new Date(weekStart);start.setDate(start.getDate()+(cp.w-CURRENT_WEEK)*7);
  const end=new Date(start);end.setDate(end.getDate()+6);
  const en=start.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' – '+end.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const jp=start.toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'})+'–'+end.toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'});
  cpPopupDate.innerHTML=`${en}<br><span style="font-size:0.88em;opacity:0.7">${jp}</span>`;
  cpWeekBadge.classList.remove('visible');cpWeekBadge.style.background='';cpWeekBadge.style.color='';cpWeekBadge.textContent='';
  if(diff===0){cpWeekBadge.textContent='★ THIS WEEK / 今週 ★';cpWeekBadge.style.background=`linear-gradient(90deg,${col1},${col2})`;cpWeekBadge.style.color='#000';cpWeekBadge.classList.add('visible');}
  else if(diff<0){cpWeekBadge.textContent='← LAST WEEK / 先週';cpWeekBadge.style.background='rgba(255,255,255,0.12)';cpWeekBadge.style.color='rgba(255,255,255,0.75)';cpWeekBadge.classList.add('visible');}
  else{cpWeekBadge.textContent='NEXT WEEK / 来週 →';cpWeekBadge.style.background='rgba(255,255,255,0.12)';cpWeekBadge.style.color='rgba(255,255,255,0.75)';cpWeekBadge.classList.add('visible');}
  cpScrim.classList.add('show');cpPopup.classList.remove('show');void cpPopup.offsetWidth;cpPopup.classList.add('show');
}

function buildSparkles(container,count=24,wide=false){
  container.innerHTML='';
  for(let i=0;i<count;i++){
    const sp=document.createElement('div');sp.className='sp';
    const angle=(i/count)*Math.PI*2,r=wide?35+Math.random()*28:28+Math.random()*18;
    const cx=50+Math.cos(angle)*r,cy=50+Math.sin(angle)*r;
    const size=wide?3+Math.random()*4:2+Math.random()*3,dur=1.3+Math.random()*1.8,delay=-(Math.random()*dur);
    sp.style.cssText=`--size:${size}px;--x:${cx}%;--y:${cy}%;--dur:${dur}s;--delay:${delay}s;`;
    container.appendChild(sp);
  }
}
buildSparkles(confirmSp,24);buildSparkles(startSp,36,true);

returnBtn.addEventListener('click',()=>{fadeOut();setTimeout(()=>goToHub(),FADE_MS);});

let videoPlayed=false;
continueBtn.addEventListener('click',async()=>{
  if(videoPlayed)return;videoPlayed=true;
  overlay1.classList.add('hidden');overlay1.addEventListener('transitionend',()=>overlay1.classList.add('gone'),{once:true});
  app.classList.add('inTransition');videoWrap.classList.add('show');
  try{toMazeVideo.currentTime=0;}catch(e){}
  try{await toMazeVideo.play();}catch(e){showOverlay2();}
});

let o2shown=false;
function showOverlay2(){
  if(o2shown)return;o2shown=true;
  try{toMazeVideo.pause();toMazeVideo.currentTime=0;}catch(e){}
  videoWrap.classList.remove('show');overlay2.classList.add('show');app.classList.add('inTransition');resizeCanvas();
}
toMazeVideo.addEventListener('ended',showOverlay2);toMazeVideo.addEventListener('error',showOverlay2);
toMazeVideo.addEventListener('timeupdate',()=>{const d=toMazeVideo.duration;if(!isFinite(d)||d<=0)return;if(d-toMazeVideo.currentTime<=.5)showOverlay2();});

let mazeLaunched=false;
mazeStartBtn.addEventListener('click',async()=>{
  if(mazeLaunched)return;mazeLaunched=true;
  overlay2.classList.add('hidden');overlay2.addEventListener('transitionend',()=>overlay2.remove(),{once:true});
  app.classList.remove('inTransition');
  mazeStarted=true;ghostVisible=false;
  ghostIX=INTRO_TOP_CENTER_START.ix;ghostIY=INTRO_TOP_CENTER_START.iy;
  karasukiLastSwap=performance.now();
  introPhase='allGlow';introGlowStart=performance.now();
  resizeCanvas();buildWanderers();startLoop();
  try{bgMusic.volume=.65;await bgMusic.play();}catch(e){console.warn('Music blocked',e);}
});

backBtn.addEventListener('click',()=>{
  if(ghostLocked)return;
  try{bgMusic.pause();bgMusic.currentTime=0;}catch(e){}
  fadeOut();setTimeout(()=>goToHub(),FADE_MS);
});

function fadeOut(){fade.classList.add('on');}

document.addEventListener('visibilitychange',()=>{
  if(document.hidden){try{toMazeVideo.pause();}catch(e){}try{bgMusic.pause();}catch(e){}}
  else{if(videoPlayed&&!o2shown)try{toMazeVideo.play();}catch(e){}if(mazeLaunched)try{bgMusic.play();}catch(e){}}
});

if(sessionStorage.getItem('booha_return_to_checkpoint')==='1') restoreMazeFromCheckpoint();
else resizeCanvas();

</script>
</body>
</html>
