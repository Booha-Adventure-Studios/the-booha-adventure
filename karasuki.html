
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karasuki</title>

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

#karasukiApp{
  position:relative;
  width:100vw;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000;
  overflow:hidden;
}

#roomStage{
  position:relative;
  width:min(100vw, calc(100vh * 16 / 9));
  aspect-ratio:16/9;
  overflow:hidden;
  background:#000;
}

.room{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  will-change:transform;
}

#player{
  position:absolute;
  width:5%;
  aspect-ratio:1/1;
  background:url("assets/karasuki/player/booha_idle.png") center/contain no-repeat;
  pointer-events:none;
  z-index:10;
  will-change:left,top,transform;
}

#prompt{
  position:absolute;
  left:50%;
  bottom:4%;
  transform:translateX(-50%);
  z-index:30;
  padding:.65rem 1rem;
  border-radius:999px;
  background:rgba(0,0,0,.7);
  color:#fff;
  font-weight:800;
  font-size:clamp(12px, 1.3vw, 18px);
  letter-spacing:.04em;
  box-shadow:0 0 18px rgba(255,255,255,.15);
  pointer-events:none;
  opacity:0;
  transition:opacity .18s ease;
}

#prompt.show{
  opacity:1;
}

#overlay{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.82);
  z-index:40;
}

#overlay.hidden{
  display:none;
}

#overlayPanel{
  position:relative;
  width:min(92vw, 1200px);
  height:min(90vh, 900px);
  display:flex;
  justify-content:center;
  align-items:center;
}

#overlayImage{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  display:block;
  border-radius:18px;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.overlay-hotspot{
  position:absolute;
  cursor:pointer;
  border-radius:12px;
  background:rgba(255,255,255,.001);
}

.overlay-hotspot:hover{
  outline:2px solid rgba(255,255,255,.3);
}

#closeOverlay{
  position:absolute;
  top:14px;
  right:14px;
  z-index:5;
  border:0;
  border-radius:999px;
  padding:.7rem 1rem;
  font-weight:900;
  cursor:pointer;
}

#fade{
  position:absolute;
  inset:0;
  background:#000;
  opacity:0;
  pointer-events:none;
  z-index:35;
  transition:opacity .25s linear;
}

#fade.active{
  opacity:1;
}

/* optional debug collision */
.debug-box{
  position:absolute;
  border:2px dashed rgba(255,0,0,.45);
  background:rgba(255,0,0,.08);
  pointer-events:none;
  z-index:8;
}
</style>
</head>
<body>

<div id="karasukiApp">
  <div id="roomStage">
    <div id="roomA" class="room"></div>
    <div id="roomB" class="room"></div>
    <div id="debugLayer"></div>
    <div id="player"></div>
    <div id="prompt">ENTER</div>
  </div>

  <div id="fade"></div>

  <div id="overlay" class="hidden">
    <div id="overlayPanel">
      <button id="closeOverlay" type="button">Close</button>
      <img id="overlayImage" alt="">
      <div id="overlayHotspots"></div>
    </div>
  </div>
</div>

<script src="js/karasuki-data.js"></script>
<script src="js/karasuki.js"></script>
</body>
</html>
