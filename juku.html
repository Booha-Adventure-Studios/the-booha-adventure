
<!DOCTYPE html>
<html lang="ja" class="token-checking">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Juku — The Booha Adventure</title>
<style>
  /* token.js removes .token-checking from <html> when session is valid */
  html.token-checking body { visibility: hidden; }

  /* juku gate: body stays hidden until membership is verified */
  body { visibility: hidden; }
  body.juku-verified { visibility: visible; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #1a1610;
    color: #e8dfc8;
    font-family: "DM Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }

  .juku-tree {
    width: min(70vw, 340px);
    height: auto;
    margin-bottom: 24px;
  }

  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 8px;
    letter-spacing: 0.05em;
  }

  p {
    font-size: 15px;
    line-height: 1.8;
    color: #b8ac8f;
    margin: 4px 0;
  }

  .en {
    font-size: 13px;
    color: #8a8069;
  }
</style>

<!-- Core stack first — same order as every protected page -->
<script src="js/token.js"></script>
</head>
<body>

  <img class="juku-tree" src="img/juku-tree.png" alt="English Juku">

  <h1>英語塾、まもなく開講。</h1>
  <p>この扉のむこうで、席が待っているよ。</p>
  <p class="en">English Juku — opening soon.<br>Your seat is waiting.</p>

<script>
(function () {
  // ── Juku gate ─────────────────────────────────────────────
  // Fail-closed: membership must be proven, not assumed.
  // Reads localStorage only — b_3910() sets an in-memory flag
  // and is therefore rejected here by design.

  var KEY_JUKU = 'booha_is_juku';
  var verified = false;

  function fail() {
    if (verified) return;
    window.location.replace('index.html');
  }

  function check() {
    if (localStorage.getItem(KEY_JUKU) === '1') {
      verified = true;
      document.body.classList.add('juku-verified');
      return true;
    }
    return false;
  }

  // token.js verifies async; the flag may be written moments
  // after this script runs. Poll briefly, then fail closed.
  if (!check()) {
    var tries = 0;
    var poll = setInterval(function () {
      tries++;
      if (check()) {
        clearInterval(poll);
      } else if (tries >= 10) {   // 10 × 500ms = 5-second timeout
        clearInterval(poll);
        fail();
      }
    }, 500);
  }
})();
</script>

</body>
</html>
