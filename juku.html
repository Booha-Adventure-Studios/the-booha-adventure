
<!DOCTYPE html>
<html lang="ja" class="token-checking">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Juku — The Booha Adventure</title>
<style>
  /* token.js removes .token-checking from <html> when session is valid */
  html.token-checking body { visibility: hidden; }

  /* juku gate: body stays hidden until membership is verified */
  body { visibility: hidden; }
  body.juku-verified { visibility: visible; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #1a1610;
    color: #e8dfc8;
    font-family: "DM Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    box-sizing: border-box;
  }

  #juku-root {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
  }

  .juku-panel {
    max-width: 560px;
    width: 100%;
    text-align: center;
    padding: 24px 18px;
  }

  .juku-crest { width: min(34vw, 150px); height: auto; margin-bottom: 14px; }

  h1 {
    font-size: 24px; font-weight: 700; margin: 0 0 6px;
    letter-spacing: .06em; color: #f2ecd8;
  }
  .juku-eyebrow {
    font-size: 11px; letter-spacing: .28em; text-transform: uppercase;
    color: #b9a86a; margin: 0 0 4px;
  }
  .juku-sub  { font-size: 15px; color: #b8ac8f; margin: 4px 0; }
  .juku-sub2 { font-size: 14px; color: #8a8069; margin: 10px 0 0; line-height: 1.8; }
  .en { font-size: 12.5px; color: #6f684f; }

  .juku-count {
    font-variant-numeric: tabular-nums;
    font-size: 34px; font-weight: 700; letter-spacing: .04em;
    color: #e8c46a; margin: 14px 0 4px;
  }
  .juku-count.big { font-size: 52px; }

  /* ── slot menu ── */
  .juku-slot-list { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
  .juku-slot-btn {
    appearance: none; cursor: pointer;
    background: rgba(255,255,255,.05);
    border: 1px solid #4a4030; color: #e8dfc8;
    border-radius: 12px; padding: 16px;
    font: 600 16px "DM Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    position: relative; transition: transform .12s ease;
  }
  .juku-slot-btn:active { transform: scale(.96); }
  .juku-slot-btn.live { border-color: #b9d977; box-shadow: 0 0 18px rgba(185,217,119,.25); }
  .live-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #b9d977; margin-left: 10px;
    box-shadow: 0 0 8px #b9d977; vertical-align: middle;
    animation: jkLive 1.6s ease-in-out infinite;
  }
  @keyframes jkLive { 0%,100%{ opacity:.5; } 50%{ opacity:1; } }

  .juku-back-btn {
    appearance: none; cursor: pointer; margin-top: 22px;
    background: transparent; border: 1px solid #4a4030; color: #b8ac8f;
    border-radius: 8px; padding: 10px 26px;
    font: 600 13px "DM Sans", sans-serif;
  }

  /* ── progress spine ── */
  .juku-spine {
    position: fixed; top: 0; left: 0; right: 0; height: 6px;
    display: flex; gap: 2px; z-index: 50;
    background: rgba(0,0,0,.4);
  }
  .jsp-cell { background: rgba(232,196,106,.12); }
  .jsp-cell.done { background: rgba(232,196,106,.45); }
  .jsp-cell.now  {
    background: linear-gradient(90deg,#e8c46a,#fff3c0,#e8c46a);
    background-size: 200% 100%;
    animation: jspNow 2.4s linear infinite;
    box-shadow: 0 0 10px rgba(232,196,106,.6);
  }
  @keyframes jspNow { 0%{background-position:0% 0} 100%{background-position:200% 0} }

 /* ── exit X + nav (outside lesson only) ── */
  .juku-x {
    position: fixed; top: 14px; right: 16px; z-index: 60;
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.06); border: 1px solid #4a4030;
    color: #b8ac8f; font-size: 18px; text-decoration: none;
  }
  .juku-nav { display: flex; gap: 12px; justify-content: center; margin-top: 26px; }
  .juku-nav-btn {
    flex: 1; max-width: 200px; text-decoration: none;
    background: rgba(255,255,255,.05);
    border: 1px solid #4a4030; color: #b8ac8f;
    border-radius: 12px; padding: 12px;
    font: 600 14px "DM Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    text-align: center; line-height: 1.5;
  }

  /* ── survey submit / done ── */
  .juku-submit {
    appearance: none; cursor: pointer; display: block;
    width: 100%; margin-top: 6px;
    background: linear-gradient(160deg,#fff3c0,#e8c46a,#b9d977);
    border: 0; color: #2a2005;
    border-radius: 12px; padding: 15px;
    font: 800 17px "DM Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    box-shadow: 0 4px 18px rgba(232,196,106,.35);
    transition: opacity .2s ease, transform .1s ease;
  }
  .juku-submit:active { transform: scale(.96); }
  .juku-submit.off { opacity: .3; pointer-events: none; }
  .juku-done {
    text-align: center; margin-top: 8px; padding: 18px;
    border: 1px solid rgba(185,217,119,.4); border-radius: 14px;
    background: rgba(185,217,119,.06);
  }
  .juku-done-jp { font-size: 19px; font-weight: 800; color: #b9d977; margin: 0 0 2px; }
  .juku-edit {
    appearance: none; cursor: pointer; margin-top: 12px;
    background: transparent; border: 1px solid #4a4030; color: #8a8069;
    border-radius: 8px; padding: 8px 20px;
    font: 600 12.5px "DM Sans", sans-serif;
  }

  /* ── survey / prediction ── */
  
  .juku-survey { margin-top: 20px; text-align: left; }
  .juku-q { margin-bottom: 20px; }
  .juku-q-jp { font-size: 15px; font-weight: 700; color: #e8dfc8; margin: 0 0 2px; }
  .juku-q-en { font-size: 11.5px; color: #6f684f; margin: 0 0 8px; }
  .juku-opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .juku-opt {
    appearance: none; cursor: pointer;
    background: rgba(255,255,255,.05);
    border: 1px solid #4a4030; color: #b8ac8f;
    border-radius: 999px; padding: 9px 16px;
    font: 600 13.5px "DM Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    transition: transform .1s ease;
  }
  .juku-opt:active { transform: scale(.94); }
  .juku-opt.sel {
    background: linear-gradient(160deg,#fff3c0,#e8c46a);
    color: #2a2005; border-color: #e8c46a;
    box-shadow: 0 0 14px rgba(232,196,106,.4);
  }

/* ── sentence order test ── */
  .juku-item-count { font-size: 12px; letter-spacing: .12em; color: #8a8069; margin: 0 0 4px; }
  .juku-item-jp { font-size: 17px; font-weight: 700; color: #e8dfc8; margin: 0 0 14px; }
  .juku-answer {
    min-height: 52px; padding: 10px;
    border: 1px dashed #4a4030; border-radius: 12px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    justify-content: center; margin-bottom: 14px;
    background: rgba(0,0,0,.25);
  }
  .juku-answer-hint { font-size: 12.5px; color: #6f684f; }
  .juku-bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 16px; }
  .juku-chip {
    appearance: none; cursor: pointer;
    background: rgba(255,255,255,.07);
    border: 1px solid #5a4e38; color: #e8dfc8;
    border-radius: 10px; padding: 10px 14px;
    font: 700 16px "DM Sans", sans-serif;
    transition: transform .1s ease, opacity .15s ease;
  }
  .juku-chip:active { transform: scale(.93); }
  .juku-chip.used { opacity: .18; pointer-events: none; }
  .juku-chip.placed { background: rgba(232,196,106,.16); border-color: #e8c46a; }
  .juku-test-actions { display: flex; gap: 10px; justify-content: center; }
  .juku-clear {
    appearance: none; cursor: pointer;
    background: transparent; border: 1px solid #4a4030; color: #8a8069;
    border-radius: 10px; padding: 12px 20px;
    font: 600 14px "DM Sans", "Hiragino Kaku Gothic ProN", sans-serif;
  }
  .juku-lock {
    appearance: none; cursor: pointer;
    background: linear-gradient(160deg,#fff3c0,#e8c46a);
    border: 0; color: #2a2005;
    border-radius: 10px; padding: 12px 26px;
    font: 800 15px "DM Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    box-shadow: 0 4px 16px rgba(232,196,106,.35);
  }
  .juku-lock.off { opacity: .3; pointer-events: none; }
  .juku-demo-badge {
    display: inline-block; margin-bottom: 10px;
    font: 800 10px "DM Sans", sans-serif; letter-spacing: .2em;
    color: #ff8866; border: 1px solid #ff8866; border-radius: 6px;
    padding: 3px 8px;
  }

 /* ── task area ── */
  .juku-task { margin-top: 22px; }
  .juku-paper { font-size: 17px; line-height: 2; color: #b8ac8f; }

  /* ── Stage 3b ── */
  .juku-choices { display: flex; flex-direction: column; gap: 10px; margin: 14px 0; }
  .juku-choice { padding: 12px 16px; border-radius: 12px; border: 2px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.06); color: inherit; font: inherit; text-align: left; }
  .juku-choice.picked { border-color: currentColor; background: rgba(255,255,255,.16); }
  .juku-play { margin: 6px 0 10px; padding: 8px 18px; border-radius: 999px;
    border: 2px solid rgba(255,255,255,.3); background: rgba(255,255,255,.08);
    color: inherit; font: inherit; }
  .juku-passage { text-align: left; line-height: 1.75; padding: 12px 14px;
    border-radius: 12px; background: rgba(255,255,255,.05); margin-bottom: 10px;
    max-height: 34vh; overflow-y: auto; }
  .juku-read-text { text-align: left; line-height: 1.7; margin-bottom: 8px; }
  .juku-item-word { font-size: 1.6em; font-weight: 700; margin: 8px 0; }
  .juku-item-def { line-height: 1.6; margin: 8px 0; }
  .juku-item-q { opacity: .9; margin: 4px 0 8px; }
  .juku-chip.letter { min-width: 2.1em; text-align: center; }
  @media (prefers-reduced-motion: reduce) {
    .live-dot, .jsp-cell.now { animation: none; }
  }
</style>

<!-- Load order (sacred): token gate → calendar.js → juku stack -->
<script src="js/token.js"></script>
</head>
<body>

  <div id="juku-root"></div>

<script>
(function () {
  // ── Juku gate ─────────────────────────────────────────────
  // Fail-closed: membership must be proven, not assumed.
  // Reads localStorage only — b_3910() sets an in-memory flag
  // and is therefore rejected here by design.

  var KEY_JUKU = 'booha_is_juku';
  var verified = false;

  function fail() {
    if (verified) return;
    window.location.replace('index.html');
  }

  function check() {
    if (localStorage.getItem(KEY_JUKU) === '1') {
      verified = true;
      document.body.classList.add('juku-verified');
      loadEngine();
      return true;
    }
    return false;
  }

  // The engine loads ONLY after the gate passes — sequentially,
  // preserving load order: calendar → config → engine → phases.
  function loadEngine() {
   var files = ['js/calendar.js', 'js/juku-config.js', 'js/juku-engine.js', 'js/juku-tests.js', 'js/juku-phases.js'];
    
    (function next(i) {
      if (i >= files.length) return;
      var s = document.createElement('script');
      s.src = files[i];
      s.onload = function () { next(i + 1); };
      document.body.appendChild(s);
    })(0);
  }

  // token.js verifies async; the flag may be written moments
  // after this script runs. Poll briefly, then fail closed.
  if (!check()) {
    var tries = 0;
    var poll = setInterval(function () {
      tries++;
      if (check()) {
        clearInterval(poll);
      } else if (tries >= 10) {   // 10 × 500ms = 5-second timeout
        clearInterval(poll);
        fail();
      }
    }, 500);
  }
})();
</script>

</body>
</html>
