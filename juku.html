
<!DOCTYPE html>
<html lang="ja" class="token-checking">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Juku — The Booha Adventure</title>
<style>
  /* token.js removes .token-checking from <html> when session is valid */
  html.token-checking body { visibility: hidden; }

  /* juku gate: body stays hidden until membership is verified */
  body { visibility: hidden; }
  body.juku-verified { visibility: visible; }

  body {
    --phase-top: #171224;
    --phase-bottom: #08141d;
    --phase-glow: rgba(104, 185, 196, .18);
    --phase-accent: #e8c46a;
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 50% -8%, var(--phase-glow), transparent 38rem),
      radial-gradient(circle at 12% 88%, rgba(232,196,106,.08), transparent 25rem),
      linear-gradient(155deg, var(--phase-top), var(--phase-bottom));
    color: #e8dfc8;
    font-family: "DM Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    box-sizing: border-box;
    overflow-x: hidden;
    transition: background-color .8s ease;
  }
  body::before,
  body::after {
    content: "";
    position: fixed;
    z-index: 0;
    pointer-events: none;
    border-radius: 50%;
    filter: blur(2px);
    opacity: .7;
  }
  body::before {
    width: 28rem; height: 28rem; left: -17rem; top: 18%;
    border: 1px solid color-mix(in srgb, var(--phase-accent) 35%, transparent);
    box-shadow:
      0 0 0 42px color-mix(in srgb, var(--phase-accent) 5%, transparent),
      0 0 0 94px color-mix(in srgb, var(--phase-accent) 3%, transparent);
  }
  body::after {
    width: 20rem; height: 20rem; right: -13rem; bottom: 5%;
    background: radial-gradient(circle, var(--phase-glow), transparent 66%);
  }
  body[data-juku-phase="menu"],
  body[data-juku-phase="lobby"] {
    --phase-top: #20172c; --phase-bottom: #071b20;
    --phase-glow: rgba(232,196,106,.19); --phase-accent: #e8c46a;
  }
  body[data-juku-phase="dictation"] {
    --phase-top: #10172e; --phase-bottom: #06141c;
    --phase-glow: rgba(75,181,212,.2); --phase-accent: #7fc4ce;
  }
  body[data-juku-phase="reading"] {
    --phase-top: #13251f; --phase-bottom: #0a1515;
    --phase-glow: rgba(185,217,119,.16); --phase-accent: #b9d977;
  }
  body[data-juku-phase="order"],
  body[data-juku-phase="vocab"] {
    --phase-top: #23172e; --phase-bottom: #11101e;
    --phase-glow: rgba(186,128,213,.16); --phase-accent: #c7a2e8;
  }
  body[data-juku-phase="mixed"],
  body[data-juku-phase="predict"] {
    --phase-top: #292015; --phase-bottom: #17101d;
    --phase-glow: rgba(232,140,106,.15); --phase-accent: #e8c46a;
  }
  body[data-juku-phase="interval"] {
    --phase-top: #10252b; --phase-bottom: #07171c;
    --phase-glow: rgba(127,196,206,.14); --phase-accent: #7fc4ce;
  }
  body[data-juku-phase="results"],
  body[data-juku-phase="closed"] {
    --phase-top: #282117; --phase-bottom: #14141e;
    --phase-glow: rgba(232,196,106,.22); --phase-accent: #e8c46a;
  }

  #juku-root {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
    position: relative;
    z-index: 1;
  }

.juku-panel {
    max-width: 560px;
    width: 100%;
    box-sizing: border-box;
    text-align: center;
    padding: 24px 18px;
    position: relative;
    z-index: 10;
    background:
      linear-gradient(145deg, rgba(22,25,38,.9), rgba(12,17,25,.84));
    border: 1px solid rgba(232,196,106,.16);
    border-radius: 22px;
    box-shadow:
      0 24px 70px rgba(0,0,0,.44),
      inset 0 1px 0 rgba(255,255,255,.045);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  .juku-crest { width: min(34vw, 150px); height: auto; margin-bottom: 14px; }
  .juku-crest-wrap {
    width: min(45vw, 190px); aspect-ratio: 1; margin: -10px auto 3px;
    display: grid; place-items: center; position: relative; isolation: isolate;
  }
  .juku-crest-wrap::before,
  .juku-crest-wrap::after,
  .juku-crest-rune {
    content: ""; position: absolute; border-radius: 50%; pointer-events: none;
  }
  .juku-crest-wrap::before {
    inset: 10%; z-index: -1;
    background: radial-gradient(circle, rgba(255,232,153,.35), rgba(232,196,106,.1) 45%, transparent 70%);
    filter: blur(7px);
    animation: jkCrestGlow 3.8s ease-in-out infinite;
  }
  .juku-crest-wrap::after {
    inset: 7%; z-index: -1; border: 1px solid rgba(232,196,106,.3);
    box-shadow: 0 0 24px rgba(232,196,106,.22), inset 0 0 20px rgba(232,196,106,.12);
  }
  .juku-crest-rune {
    inset: 0; z-index: -2;
    background:
      repeating-conic-gradient(from 0deg, rgba(232,196,106,.42) 0 1deg, transparent 1deg 22.5deg);
    -webkit-mask: radial-gradient(circle, transparent 0 62%, #000 63% 65%, transparent 66%);
    mask: radial-gradient(circle, transparent 0 62%, #000 63% 65%, transparent 66%);
    animation: jkRuneTurn 38s linear infinite;
  }
  .juku-crest-wrap .juku-crest {
    width: 82%; margin: 0; filter: drop-shadow(0 8px 16px rgba(0,0,0,.48));
  }
  @keyframes jkCrestGlow {
    0%,100% { opacity:.55; transform:scale(.94); }
    50% { opacity:1; transform:scale(1.05); }
  }
  @keyframes jkRuneTurn { to { transform: rotate(360deg); } }

  h1 {
    font-size: 24px; font-weight: 700; margin: 0 0 6px;
    letter-spacing: .06em; color: #f2ecd8;
  }
  .juku-eyebrow {
    font-size: 11px; letter-spacing: .28em; text-transform: uppercase;
    color: #b9a86a; margin: 0 0 4px;
  }
  .juku-sub  { font-size: 15px; color: #b8ac8f; margin: 4px 0; }
  .juku-sub2 { font-size: 14px; color: #8a8069; margin: 10px 0 0; line-height: 1.8; }
  .en { font-size: 12.5px; color: #6f684f; }

  .juku-count {
    font-variant-numeric: tabular-nums;
    font-size: 34px; font-weight: 700; letter-spacing: .04em;
    color: #e8c46a; margin: 14px 0 4px;
  }
  .juku-count.big { font-size: 52px; }

  /* ── slot menu ── */
  .juku-slot-list { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
  .juku-slot-btn {
    appearance: none; cursor: pointer;
    background: rgba(255,255,255,.05);
    border: 1px solid #4a4030; color: #e8dfc8;
    border-radius: 12px; padding: 16px;
    font: 600 16px "DM Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    position: relative; transition: transform .12s ease;
  }
  .juku-slot-btn:active { transform: scale(.96); }
  .juku-slot-btn.live { border-color: #b9d977; box-shadow: 0 0 18px rgba(185,217,119,.25); }
  .live-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #b9d977; margin-left: 10px;
    box-shadow: 0 0 8px #b9d977; vertical-align: middle;
    animation: jkLive 1.6s ease-in-out infinite;
  }
  @keyframes jkLive { 0%,100%{ opacity:.5; } 50%{ opacity:1; } }

  .juku-back-btn {
    appearance: none; cursor: pointer; margin-top: 22px;
    background: transparent; border: 1px solid #4a4030; color: #b8ac8f;
    border-radius: 8px; padding: 10px 26px;
    font: 600 13px "DM Sans", sans-serif;
  }

  /* ── progress spine ── */
  .juku-spine {
    position: fixed; top: 0; left: 0; right: 0; height: 26px;
    display: flex; gap: 3px; z-index: 50; padding: 10px 10px 0;
    box-sizing: border-box;
    background: linear-gradient(180deg, rgba(4,7,13,.9), transparent);
  }
  .jsp-cell {
    height: 3px; position: relative; border-radius: 999px;
    background: rgba(232,196,106,.13);
  }
  .jsp-cell.done { background: rgba(232,196,106,.48); }
  .jsp-cell.now {
    background: linear-gradient(90deg,#e8c46a,#fff3c0,#e8c46a);
    background-size: 200% 100%;
    animation: jspNow 2.4s linear infinite;
    box-shadow: 0 0 10px rgba(232,196,106,.6);
  }
  .jsp-node {
    position: absolute; right: -4px; top: 50%; width: 7px; height: 7px;
    border-radius: 50%; transform: translateY(-50%);
    background: #332d24; border: 1px solid rgba(232,196,106,.35);
    box-shadow: 0 0 0 2px rgba(4,7,13,.8);
  }
  .jsp-cell.done .jsp-node { background: #e8c46a; }
  .jsp-cell.now .jsp-node {
    width: 11px; height: 11px; right: -6px;
    background: #fff3c0; border-color: #fff3c0;
    box-shadow: 0 0 0 3px rgba(232,196,106,.16), 0 0 14px #e8c46a;
  }
  .jsp-cell.now .jsp-node::after {
    content: ""; position: absolute; inset: -6px; border-radius: 50%;
    border: 1px solid rgba(255,243,192,.5);
    animation: jkNodePulse 1.8s ease-out infinite;
  }
  @keyframes jspNow { 0%{background-position:0% 0} 100%{background-position:200% 0} }
  @keyframes jkNodePulse {
    0% { transform:scale(.55); opacity:1; }
    100% { transform:scale(1.4); opacity:0; }
  }

 /* ── exit X + nav (outside lesson only) ── */
  .juku-x {
    position: fixed; top: 14px; right: 16px; z-index: 60;
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.06); border: 1px solid #4a4030;
    color: #b8ac8f; font-size: 18px; text-decoration: none;
  }
  .juku-nav { display: flex; gap: 12px; justify-content: center; margin-top: 26px; }
  .juku-nav-btn {
    flex: 1; max-width: 200px; text-decoration: none;
    background: rgba(255,255,255,.05);
    border: 1px solid #4a4030; color: #b8ac8f;
    border-radius: 12px; padding: 12px;
    font: 600 14px "DM Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    text-align: center; line-height: 1.5;
  }

  /* ── survey submit / done ── */
  .juku-submit {
    appearance: none; cursor: pointer; display: block;
    width: 100%; margin-top: 6px;
    background: linear-gradient(160deg,#fff3c0,#e8c46a,#b9d977);
    border: 0; color: #2a2005;
    border-radius: 12px; padding: 15px;
    font: 800 17px "DM Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    box-shadow: 0 4px 18px rgba(232,196,106,.35);
    transition: opacity .2s ease, transform .1s ease;
  }
  .juku-submit:active { transform: scale(.96); }
  .juku-submit.off { opacity: .3; pointer-events: none; }
  
  .juku-done {
    text-align: center; margin-top: 8px; padding: 10px 14px;
    border: 1px solid rgba(185,217,119,.4); border-radius: 14px;
    background: linear-gradient(145deg, rgba(36,36,31,.94), rgba(19,25,29,.94));
    display: inline-block;
    box-shadow: 0 4px 24px rgba(0,0,0,.5);
  }
  .juku-locked-card {
    width: min(100%, 350px); box-sizing: border-box; padding: 18px 18px 15px;
    position: relative; overflow: hidden;
    border-color: rgba(127,196,206,.46);
    box-shadow: 0 14px 38px rgba(0,0,0,.36), inset 0 0 32px rgba(127,196,206,.055);
    animation: jkLockArrive .35s cubic-bezier(.2,.9,.25,1.2) both;
  }
  .juku-locked-card::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(110deg, transparent 20%, rgba(255,255,255,.07) 44%, transparent 63%);
    transform: translateX(-120%);
    animation: jkLockSheen .9s .15s ease-out both;
  }
  .juku-lock-seal {
    width: 48px; height: 48px; margin: 0 auto 9px; border-radius: 50%;
    display: grid; place-items: center; position: relative;
    border: 1px solid rgba(127,196,206,.65);
    background: radial-gradient(circle, rgba(127,196,206,.2), rgba(12,23,31,.9));
    box-shadow: 0 0 18px rgba(127,196,206,.24);
  }
  .juku-lock-seal::before {
    content: ""; width: 13px; height: 15px; border: 2px solid #bde5ea;
    border-radius: 3px; box-sizing: border-box;
    box-shadow: inset 0 -7px 0 rgba(189,229,234,.2);
  }
  .juku-lock-seal::after {
    content: ""; position: absolute; width: 10px; height: 8px;
    margin-top: -15px; border: 2px solid #bde5ea; border-bottom: 0;
    border-radius: 8px 8px 0 0;
  }
  @keyframes jkLockArrive {
    from { opacity:0; transform:scale(.94) translateY(7px); }
    to { opacity:1; transform:none; }
  }
  @keyframes jkLockSheen { to { transform:translateX(120%); } }
  
  .juku-done-jp { font-size: 16px; font-weight: 800; color: #b9d977; margin: 0 0 2px; }
  
  .juku-edit {
    appearance: none; cursor: pointer; margin-top: 12px;
    background: transparent; border: 1px solid #4a4030; color: #8a8069;
    border-radius: 8px; padding: 8px 20px;
    font: 600 12.5px "DM Sans", sans-serif;
  }

  /* ── survey / prediction ── */
  
  .juku-survey { margin-top: 20px; text-align: left; }
  .juku-q { margin-bottom: 20px; }
  .juku-q-jp { font-size: 15px; font-weight: 700; color: #e8dfc8; margin: 0 0 2px; }
  .juku-q-en { font-size: 11.5px; color: #6f684f; margin: 0 0 8px; }
  .juku-opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .juku-opt {
    appearance: none; cursor: pointer;
    background: rgba(255,255,255,.05);
    border: 1px solid #4a4030; color: #b8ac8f;
    border-radius: 999px; padding: 9px 16px;
    font: 600 13.5px "DM Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    transition: transform .1s ease;
  }
  .juku-opt:active { transform: scale(.94); }
  .juku-opt.sel {
    background: linear-gradient(160deg,#fff3c0,#e8c46a);
    color: #2a2005; border-color: #e8c46a;
    box-shadow: 0 0 14px rgba(232,196,106,.4);
  }

/* ── sentence order test ── */
  .juku-item-count { font-size: 12px; letter-spacing: .12em; color: #8a8069; margin: 0 0 4px; }
  .juku-item-jp { font-size: 17px; font-weight: 700; color: #e8dfc8; margin: 0 0 14px; }
  .juku-answer {
    min-height: 52px; padding: 10px;
    border: 1px dashed #4a4030; border-radius: 12px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    justify-content: center; margin-bottom: 14px;
    background: rgba(0,0,0,.25);
  }
  .juku-answer-hint { font-size: 12.5px; color: #6f684f; }
  .juku-bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 16px; }
  .juku-chip {
    appearance: none; cursor: pointer;
    background: rgba(255,255,255,.07);
    border: 1px solid #5a4e38; color: #e8dfc8;
    border-radius: 10px; padding: 10px 14px;
    font: 700 16px "DM Sans", sans-serif;
    transition: transform .1s ease, opacity .15s ease;
  }
  .juku-chip:active { transform: scale(.93); }
  .juku-chip.used { opacity: .18; pointer-events: none; }
  .juku-chip.placed { background: rgba(232,196,106,.16); border-color: #e8c46a; }
  .juku-test-actions { display: flex; gap: 10px; justify-content: center; }
  .juku-clear {
    appearance: none; cursor: pointer;
    background: transparent; border: 1px solid #4a4030; color: #8a8069;
    border-radius: 10px; padding: 12px 20px;
    font: 600 14px "DM Sans", "Hiragino Kaku Gothic ProN", sans-serif;
  }
  .juku-lock {
    appearance: none; cursor: pointer;
    background: linear-gradient(160deg,#fff3c0,#e8c46a);
    border: 0; color: #2a2005;
    border-radius: 10px; padding: 12px 26px;
    font: 800 15px "DM Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    box-shadow: 0 4px 16px rgba(232,196,106,.35);
  }
  .juku-lock.off { opacity: .3; pointer-events: none; }
  .juku-demo-badge {
    display: inline-block; margin-bottom: 10px;
    font: 800 10px "DM Sans", sans-serif; letter-spacing: .2em;
    color: #ff8866; border: 1px solid #ff8866; border-radius: 6px;
    padding: 3px 8px;
  }

 /* ── task area ── */
  .juku-task { margin-top: 22px; }
  .juku-paper { font-size: 17px; line-height: 2; color: #b8ac8f; }

  /* ── Stage 3b ── */
  .juku-choices { display: flex; flex-direction: column; gap: 10px; margin: 14px 0; }
  .juku-choice { padding: 12px 16px; border-radius: 12px; border: 2px solid rgba(255,255,255,.25);
    background: linear-gradient(135deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
    color: inherit; font: inherit; text-align: left; }
  .juku-choice.picked {
    border-color: var(--phase-accent);
    background: linear-gradient(135deg, rgba(232,196,106,.18), rgba(127,196,206,.09));
    box-shadow: 0 0 18px rgba(232,196,106,.11);
  }
  .juku-play {
    margin: 6px 0 10px; padding: 9px 18px; border-radius: 999px;
    display: inline-flex; gap: 10px; align-items: center; justify-content: center;
    border: 1px solid rgba(127,196,206,.52);
    background: linear-gradient(145deg, rgba(127,196,206,.16), rgba(255,255,255,.045));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 5px 18px rgba(0,0,0,.22);
    color: #d8f3f4; font: 750 14px "DM Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    cursor: pointer; transition: transform .12s ease, box-shadow .2s ease;
  }
  .juku-play:active { transform:scale(.96); }
  .juku-play.is-playing { box-shadow: 0 0 22px rgba(127,196,206,.3); }
  .juku-audio-rune {
    width: 25px; height: 18px; display: flex; gap: 3px;
    align-items: center; justify-content: center;
  }
  .juku-audio-rune i {
    display: block; width: 3px; border-radius: 999px; background: #bde5ea;
    box-shadow: 0 0 5px rgba(189,229,234,.45);
  }
  .juku-audio-rune i:nth-child(1) { height:7px; }
  .juku-audio-rune i:nth-child(2) { height:15px; }
  .juku-audio-rune i:nth-child(3) { height:10px; }
  .juku-play.is-playing .juku-audio-rune i { animation: jkSoundBar .65s ease-in-out infinite alternate; }
  .juku-play.is-playing .juku-audio-rune i:nth-child(2) { animation-delay:-.32s; }
  .juku-play.is-playing .juku-audio-rune i:nth-child(3) { animation-delay:-.5s; }
  @keyframes jkSoundBar { to { height:18px; filter:brightness(1.35); } }
  .juku-passage { text-align: left; line-height: 1.75; padding: 12px 14px;
    border-radius: 12px; background: rgba(255,255,255,.05); margin-bottom: 10px;
    max-height: 34vh; overflow-y: auto; }
  .juku-read-text { text-align: left; line-height: 1.7; margin-bottom: 8px; }
  .juku-item-word { font-size: 1.6em; font-weight: 700; margin: 8px 0; }
  .juku-item-def { line-height: 1.6; margin: 8px 0; }
  .juku-item-q { opacity: .9; margin: 4px 0 8px; }
  .juku-open-response {
    display: block; box-sizing: border-box; width: 100%; margin: 12px 0 8px;
    padding: 13px 14px; border: 2px solid #5a4e38; border-radius: 12px;
    background: rgba(0,0,0,.28); color: #f2ecd8;
    font: 600 17px/1.55 "DM Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    resize: vertical; outline: none;
  }
  .juku-open-response:focus {
    border-color: var(--phase-accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--phase-accent) 14%, transparent);
  }
  .juku-open-response::placeholder { color: #6f684f; }
  .juku-chip.letter { min-width: 2.1em; text-align: center; }
  .juku-preflight {
    margin: 14px auto 0; padding: 9px 12px; max-width: 420px;
    border-radius: 10px; font-size: 12px; line-height: 1.45;
    color: #b8ac8f; background: rgba(255,255,255,.045);
  }
  .juku-preflight.ready { color: #b9d977; background: rgba(185,217,119,.08); }
  .juku-preflight.failed { color: #ffd0d0; background: rgba(176,0,32,.25); }

  /* ── reading round + teacher observation ── */
  .juku-reading-round { text-align: left; }
  .juku-reading-instruction {
    margin: 0 0 2px; text-align: center; font-size: 16px; font-weight: 800;
    color: #e8c46a;
  }
  .juku-book-rune {
    width: 58px; height: 43px; margin: 0 auto 11px; position: relative;
    display: flex; gap: 3px; perspective: 100px;
    filter: drop-shadow(0 0 12px rgba(185,217,119,.18));
  }
  .juku-book-rune span {
    flex: 1; border: 1px solid rgba(185,217,119,.7);
    background: linear-gradient(135deg, rgba(185,217,119,.18), rgba(255,255,255,.035));
  }
  .juku-book-rune span:first-child {
    border-radius: 10px 2px 3px 5px; transform:rotateY(10deg);
  }
  .juku-book-rune span:last-child {
    border-radius: 2px 10px 5px 3px; transform:rotateY(-10deg);
  }
  .juku-book-rune::after {
    content: ""; position:absolute; width:2px; height:38px; top:3px; left:28px;
    background: linear-gradient(transparent, #b9d977, transparent);
    box-shadow: 0 0 8px rgba(185,217,119,.45);
  }
  .juku-reading-round > .en { display: block; text-align: center; line-height: 1.5; }
  .juku-reading-passage {
    margin: 14px 0; padding: 17px 18px; border-radius: 14px;
    background: rgba(255,255,255,.055); border: 1px solid #4a4030;

<!-- Load order (sacred): token gate → calendar.js → juku stack -->
<script src="js/token.js"></script>
</head>
<body>

  <div id="juku-root"></div>

<script>
(function () {
  // ── Juku gate ─────────────────────────────────────────────
  // Fail-closed: membership must be proven for the CURRENT token, not read
  // from a previous student's cached flag. token.js writes booha_is_juku and
  // only then dispatches booha:identityReady.

  var KEY_JUKU = 'booha_is_juku';
  var decided = false;

  function fail() {
    if (decided) return;
    decided = true;
    window.location.replace('index.html');
  }

  function decideFromFreshIdentity() {
    if (decided) return;
    if (localStorage.getItem(KEY_JUKU) === '1') {
      decided = true;
      document.body.classList.add('juku-verified');
      loadEngine();
      return;
    }
    fail();
  }

  // The engine loads ONLY after the gate passes — sequentially,
  // preserving load order: calendar → config → engine → phases.
  function loadEngine() {
   var files = ['js/calendar.js', 'js/juku-config.js', 'js/juku-engine.js',
                'js/sync-client.js', 'js/juku-ghosts.js', 'js/juku-tests.js',
                'js/juku-results.js', 'js/juku-phases.js'];
    
    (function next(i) {
      if (i >= files.length) return;
      var s = document.createElement('script');
      s.src = files[i];
      s.onload = function () { next(i + 1); };
      document.body.appendChild(s);
    })(0);
  }

  // Offline grace also reaches this signal, but only when token.js has a
  // previously verified userId. A slow network remains on token.js's
  // connecting screen instead of being mistaken for a non-Juku student.
  if (window.BOOHA_IDENTITY_READY) decideFromFreshIdentity();
  else document.addEventListener(
    'booha:identityReady', decideFromFreshIdentity, { once: true });
})();
</script>

</body>
