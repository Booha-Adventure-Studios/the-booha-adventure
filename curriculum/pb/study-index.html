<style>
:root {
  --bg: #180d28;

  /* Tile 1 — Bubblegum Pink */
  --c1-bg:     linear-gradient(145deg, #cc2278 0%, #6e0c40 55%, #a01860 100%);
  --c1-border: #ff88cc;
  --c1-halo:   rgba(255,136,204,.65);
  --c1-ring-a: #ff55bb;
  --c1-ring-b: #ffccee;
  --c1-mote:   #ffddee;

  /* Tile 2 — Sunny Yellow */
  --c2-bg:     linear-gradient(145deg, #c88000 0%, #6a4000 55%, #a06200 100%);
  --c2-border: #ffe566;
  --c2-halo:   rgba(255,229,102,.65);
  --c2-ring-a: #ffcc00;
  --c2-ring-b: #fff0aa;
  --c2-mote:   #fff5cc;

  /* Tile 3 — Sky Blue */
  --c3-bg:     linear-gradient(145deg, #1878cc 0%, #083870 55%, #0e58a8 100%);
  --c3-border: #88ddff;
  --c3-halo:   rgba(136,221,255,.65);
  --c3-ring-a: #44bbff;
  --c3-ring-b: #ccf0ff;
  --c3-mote:   #ddf4ff;

  /* Tile 4 — Mint Green */
  --c4-bg:     linear-gradient(145deg, #159060 0%, #064830 55%, #0c6e48 100%);
  --c4-border: #88ffcc;
  --c4-halo:   rgba(136,255,204,.65);
  --c4-ring-a: #44ddaa;
  --c4-ring-b: #bbffee;
  --c4-mote:   #ccffee;

  --white:     #ffffff;
  --white-dim: rgba(255,255,255,.65);

  --tile-w: 162px;
  --tile-h: 162px;
  --tile-r: 32px;

  --font-head: 'Ranchers', cursive;
  --font-ui:   'Nunito', sans-serif;
  --font-jp:   'Noto Sans JP', sans-serif;
}

@property --angle {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: false;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--white);
  overflow: hidden;
}

#app {
  position: relative;
  z-index: 1;
  height: 100dvh;
  max-height: 100vh;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}

#bg-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* Soft radial glows */
.bg-glow {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
  filter: blur(90px);
  opacity: .13;
}
.bg-glow.g1 {
  width: 480px; height: 340px;
  background: radial-gradient(ellipse, #ff55bb, transparent 70%);
  top: -80px; left: -100px;
  animation: glowDrift 18s ease-in-out infinite;
}
.bg-glow.g2 {
  width: 380px; height: 280px;
  background: radial-gradient(ellipse, #44bbff, transparent 70%);
  bottom: -60px; right: -80px;
  animation: glowDrift 22s ease-in-out 3s infinite reverse;
}
.bg-glow.g3 {
  width: 320px; height: 260px;
  background: radial-gradient(ellipse, #44ddaa, transparent 70%);
  top: 38%; left: 50%;
  transform: translateX(-50%);
  animation: glowDrift 16s ease-in-out 6s infinite;
}
@keyframes glowDrift {
  0%,100% { transform: translate(0,0); }
  33%  { transform: translate(22px,-16px); }
  66%  { transform: translate(-14px,12px); }
}

/* Polka-dot texture overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: .028;
  background-image:
    radial-gradient(circle, #fff 1px, transparent 1px),
    radial-gradient(circle, #fff 1px, transparent 1px);
  background-size: 28px 28px;
  background-position: 0 0, 14px 14px;
}

/* ── Layout ── */
#welcome {
  position: relative;
  z-index: 1;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 32px 20px 32px;
  gap: 0;
  animation: fadeUp 1.1s cubic-bezier(.22,.8,.36,1) both;
}

/* ── Icon ── */
.boo-icon-wrap {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 14px;
}
.boo-icon-wrap::before {
  content: '';
  position: absolute;
  inset: -20px;
  border-radius: 50%;
  background: conic-gradient(
    from 0deg,
    #ff55bb 0%, #ffcc00 25%, #44bbff 50%, #44ddaa 75%, #ff55bb 100%
  );
  opacity: .2;
  filter: blur(12px);
  animation: haloSpin 9s linear infinite;
  z-index: -1;
}
@keyframes haloSpin { to { transform: rotate(360deg); } }

.boo-icon {
  width: clamp(60px, 12vw, 90px);
  height: auto;
  filter:
    drop-shadow(0 0 26px rgba(255,85,187,.65))
    drop-shadow(0 0 8px rgba(255,85,187,.35))
    drop-shadow(0 4px 16px rgba(0,0,0,.7));
  animation: floatIcon 4.2s cubic-bezier(.45,.05,.55,.95) infinite;
}
@keyframes floatIcon {
  0%,100% { transform: translateY(0) rotate(-1.5deg); }
  50%     { transform: translateY(-10px) rotate(1.5deg); }
}

/* ── Title ── */
.title-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  margin-bottom: 6px;
}

.title-en {
  font-family: var(--font-head);
  font-size: clamp(40px, 8.5vw, 76px);
  letter-spacing: 3px;
  line-height: 1;
  color: var(--white);
  text-transform: uppercase;
  text-shadow:
    0 0 36px rgba(255,85,187,.55),
    0 0 12px rgba(255,85,187,.28),
    3px 3px 0 rgba(0,0,0,.3),
    0 4px 14px rgba(0,0,0,.8);
}

.title-en-underline {
  width: 82%;
  height: 4px;
  margin: 5px auto 0;
  border-radius: 99px;
  background: linear-gradient(90deg, #ff55bb, #ffcc00, #44bbff, #44ddaa, #ff55bb);
  background-size: 300% 100%;
  animation: candySlide 5s linear infinite;
  filter: drop-shadow(0 1px 5px rgba(255,85,187,.5));
}
@keyframes candySlide {
  0%   { background-position: 0%   50%; }
  100% { background-position: 300% 50%; }
}

.title-sub {
  font-family: var(--font-jp);
  font-weight: 400;
  font-size: clamp(10px, 1.6vw, 13px);
  letter-spacing: 4px;
  color: rgba(255,255,255,.42);
  margin-top: 9px;
}

/* ── Week badge ── */
.week-badge {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  background: rgba(255,255,255,.08);
  border: 1.5px solid rgba(255,255,255,.18);
  border-radius: 99px;
  padding: 6px 20px 6px 14px;
  margin: 12px 0 18px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.week-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: linear-gradient(135deg, #ff55bb, #ffcc00);
  box-shadow: 0 0 8px rgba(255,85,187,.7);
  animation: dotPulse 2s ease-in-out infinite;
  flex-shrink: 0;
}
@keyframes dotPulse {
  0%,100% { transform: scale(1);    box-shadow: 0 0 8px  rgba(255,85,187,.6); }
  50%     { transform: scale(1.4);  box-shadow: 0 0 18px rgba(255,85,187,.9); }
}
.week-text {
  font-family: var(--font-ui);
  font-weight: 900;
  font-size: clamp(12px, 2.2vw, 16px);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--white);
}

/* ── Tiles ── */
.deck-links {
  display: grid;
  grid-template-columns: repeat(2, var(--tile-w));
  gap: 1.15rem;
  padding: 2px 0 0;
}

a.deck {
  width: var(--tile-w);
  height: var(--tile-h);
  border-radius: var(--tile-r);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  overflow: visible;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  touch-action: pan-y manipulation;
  transition: transform .22s cubic-bezier(.34,1.56,.64,1);
  transform: translateZ(0);
  z-index: 1;
  cursor: pointer;
}
a.deck:hover { transform: translateY(-5px) scale(1.05); }

a.deck.c1 { --tile-bg:var(--c1-bg); --border-c:var(--c1-border); --halo:var(--c1-halo); --ring-a:var(--c1-ring-a); --ring-b:var(--c1-ring-b); --mote-c:var(--c1-mote); }
a.deck.c2 { --tile-bg:var(--c2-bg); --border-c:var(--c2-border); --halo:var(--c2-halo); --ring-a:var(--c2-ring-a); --ring-b:var(--c2-ring-b); --mote-c:var(--c2-mote); }
a.deck.c3 { --tile-bg:var(--c3-bg); --border-c:var(--c3-border); --halo:var(--c3-halo); --ring-a:var(--c3-ring-a); --ring-b:var(--c3-ring-b); --mote-c:var(--c3-mote); }
a.deck.c4 { --tile-bg:var(--c4-bg); --border-c:var(--c4-border); --halo:var(--c4-halo); --ring-a:var(--c4-ring-a); --ring-b:var(--c4-ring-b); --mote-c:var(--c4-mote); }

a.deck::before {
  content: "";
  position: absolute;
  inset: -5px;
  border-radius: calc(var(--tile-r) + 6px);
  background: conic-gradient(
    from var(--angle, 0deg),
    var(--ring-a) 0%, var(--ring-b) 25%,
    var(--ring-a) 50%, var(--ring-b) 75%,
    var(--ring-a) 100%
  );
  opacity: .42;
  z-index: -1;
  filter: blur(3px);
  animation: spinRing 9s linear infinite;
  pointer-events: none;
}

a.deck::after {
  content: "";
  position: absolute;
  inset: -50px;
  border-radius: 50%;
  z-index: -2;
  pointer-events: none;
  opacity: 0;
  transform: scale(.5) translateZ(0);
  transition: opacity .3s, transform .3s;
  background: radial-gradient(circle, var(--halo) 0%, transparent 65%);
}
a.deck:hover::after {
  opacity: .75;
  transform: scale(1.1) translateZ(0);
}

a.deck .clip {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  overflow: hidden;
  z-index: 2;
  border: 2.5px solid var(--border-c);
  box-shadow:
    0 16px 42px rgba(0,0,0,.65),
    0 0 0 1px rgba(255,255,255,.1) inset,
    0 1px 0 rgba(255,255,255,.22) inset;
}

a.deck .inner {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px 10px 14px;
  gap: 3px;
  background: var(--tile-bg);
  text-align: center;
  container-type: inline-size; 
}

/* Gloss top shine */
a.deck .inner::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 42%;
  border-radius: inherit;
  background: linear-gradient(180deg, rgba(255,255,255,.2) 0%, transparent 100%);
  pointer-events: none;
}

/* Shimmer sweep on hover */
a.deck .inner::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(118deg, transparent 28%, rgba(255,255,255,.13) 50%, transparent 72%);
  background-size: 200% 200%;
  background-position: 160% 0;
  pointer-events: none;
  transition: background-position .48s ease;
}
a.deck:hover .inner::after { background-position: -60% 100%; }

/* ── Three-layer label ── */
.tile-label-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}

.label-en {
  font-family: var(--font-head);
  font-weight: 700;
  font-size: clamp(12px, 12cqi, 22px);
  letter-spacing: .5px;
  color: var(--white);
  text-shadow: 0 1px 8px rgba(0,0,0,.7), 2px 2px 0 rgba(0,0,0,.22);
  line-height: 1;
  text-transform: uppercase;
}

/* Hiragana reading — thin, airy */
.label-hira {
  font-family: var(--font-jp);
  font-weight: 400;
  font-size: clamp(9px, 4cqi, 12px);
  color: rgba(255,255,255,.68);
  letter-spacing: 2.5px;
  line-height: 1;
}

/* Kanji — bolder, slightly larger */
.label-kanji {
  font-family: var(--font-jp);
  font-weight: 900;
  font-size: clamp(13px, 6.5cqi, 17px);
  color: rgba(255,255,255,.9);
  letter-spacing: 1px;
  line-height: 1;
  text-shadow: 0 1px 6px rgba(0,0,0,.5);
}

/* Sparkle layer */
a.deck .sparkles {
  position: absolute;
  inset: 0;
  z-index: 9;
  pointer-events: none;
  border-radius: inherit;
  overflow: hidden;
}
.mote {
  position: absolute;
  border-radius: 50%;
  opacity: 0;
  animation: moteFly var(--dur,.8s) ease-out forwards;
  background: radial-gradient(circle, var(--mote-c,#fff) 0%, transparent 68%);
}
@keyframes moteFly {
  0%   { opacity:0;  transform:translate(-50%,-50%) scale(.12); }
  12%  { opacity:1;  transform:translate(-50%,-50%) scale(1.4); }
  60%  { opacity:.9; }
  100% { opacity:0;  transform:translate(var(--tx,0), var(--ty,-50px)) scale(.2); }
}

/* ── Tap / Playing ── */
a.deck.tap { transform: scale(.9); transition: transform .1s ease; }

a.deck.playing {
  z-index: 999;
  animation:
    bloom      .45s cubic-bezier(.34,1.56,.64,1) forwards,
    beatBounce .38s ease-in-out .45s infinite;
}
a.deck.playing::after {
  opacity: 1;
  transform: scale(1.35) translateZ(0);
  animation: haloFlash .38s ease-in-out infinite;
}
a.deck.playing::before {
  opacity: 1;
  animation: spinRing .6s linear infinite;
}
a.deck.playing .inner { animation: innerFlash  .38s ease-in-out infinite; }
a.deck.playing .clip  { animation: borderFlash .19s ease-in-out infinite; }

@keyframes bloom {
  0%   { transform: scale(1); }
  55%  { transform: scale(1.2) translateY(-8px); }
  100% { transform: scale(1.1) translateY(-5px); }
}
@keyframes beatBounce {
  0%,100% { transform: scale(1.1)  translateY(-5px); }
  40%     { transform: scale(1.19) translateY(-10px) rotate(1.5deg); }
  70%     { transform: scale(1.04) translateY(-3px)  rotate(-1.1deg); }
}
@keyframes innerFlash {
  0%,100% { filter: brightness(1)   saturate(1); }
  45%     { filter: brightness(1.8) saturate(1.7) contrast(1.1); }
}
@keyframes haloFlash {
  0%,100% { opacity:.55; transform: scale(1.1) translateZ(0); }
  45%     { opacity:1;   transform: scale(1.65) translateZ(0); }
}
@keyframes borderFlash {
  0%,100% {
    box-shadow:
      0 16px 42px rgba(0,0,0,.65),
      0 0 0 1px rgba(255,255,255,.1) inset,
      0 1px 0 rgba(255,255,255,.22) inset;
  }
  50% {
    box-shadow:
      0 16px 42px rgba(0,0,0,.65),
      0 0 0 2px rgba(255,255,255,.55) inset,
      0 0 30px 7px var(--border-c);
  }
}

@keyframes spinRing { to { --angle: 360deg; } }
@keyframes fadeUp   { from{opacity:0;transform:translateY(22px);} to{opacity:1;transform:translateY(0);} }
@keyframes tileIn   { from{opacity:0;transform:translateY(28px) scale(.82);} to{opacity:1;transform:translateY(0) scale(1);} }

.deck-links a.deck              { animation: tileIn .68s cubic-bezier(.22,.8,.36,1) both; }
.deck-links a.deck:nth-child(1) { animation-delay: .22s; }
.deck-links a.deck:nth-child(2) { animation-delay: .34s; }
.deck-links a.deck:nth-child(3) { animation-delay: .46s; }
.deck-links a.deck:nth-child(4) { animation-delay: .58s; }

/* ── Close button ── */
#btn-close {
  position: fixed;
  top: 18px; right: 18px;
  z-index: 9999;
  width: 50px; height: 50px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,.25);
  background: rgba(24,13,40,.6);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform .2s cubic-bezier(.34,1.56,.64,1), border-color .2s, background .2s;
  animation: closePulse 3s ease-in-out infinite;
}
#btn-close:hover {
  transform: scale(1.18) rotate(90deg);
  border-color: rgba(255,136,204,.8);
  background: rgba(255,85,187,.18);
}
#btn-close:active { transform: scale(.88) rotate(90deg); }
#btn-close svg {
  width: 20px; height: 20px;
  stroke: #fff; stroke-width: 2.8; stroke-linecap: round;
  filter: drop-shadow(0 0 6px rgba(255,136,204,.75));
}
@keyframes closePulse {
  0%,100% { box-shadow: 0 0 12px rgba(255,85,187,.15), 0 0 28px rgba(255,85,187,.05); }
  50%     { box-shadow: 0 0 22px rgba(255,85,187,.35), 0 0 52px rgba(255,85,187,.12); }
}

/* ── Responsive ── */
@media (prefers-reduced-motion: reduce) {
  .boo-icon, a.deck::before, a.deck.playing,
  .bg-glow, .boo-icon-wrap::before,
  .title-en-underline { animation: none !important; }
  a.deck.playing .inner { animation: none !important; }
  .mote { animation: none !important; opacity: 0; }
}
@media (max-width: 390px) {
  :root { --tile-w: 144px; --tile-h: 148px; --tile-r: 26px; }
}
@media (orientation: landscape) and (max-height: 500px) {
  :root { --tile-w: 126px; --tile-h: 126px; }
  #welcome { padding: 10px 16px 10px; }
  .boo-icon { width: 36px; }
  .boo-icon-wrap { margin-bottom: 6px; }
  .title-en { font-size: clamp(20px, 4vw, 30px); }
  .week-badge { margin: 6px 0 10px; }
  .deck-links { grid-template-columns: repeat(4, var(--tile-w)); gap: .75rem; }
}
</style>
</head>

<body>
<div id="app">

<div class="bg-glow g1" aria-hidden="true"></div>
<div class="bg-glow g2" aria-hidden="true"></div>
<div class="bg-glow g3" aria-hidden="true"></div>

<canvas id="bg-canvas" aria-hidden="true"></canvas>

<button id="btn-close" aria-label="Back to hub">
  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <line x1="5" y1="5" x2="19" y2="19"/>
    <line x1="19" y1="5" x2="5" y2="19"/>
  </svg>
</button>

<section id="welcome">

  <div class="boo-icon-wrap">
    <img class="boo-icon" src="../../assets/img/boo-tree.png" alt="Pre-Boo" onerror="this.style.display='none'">
  </div>

  <div class="title-group">
    <h1 class="title-en">Pre-Boo</h1>
    <div class="title-en-underline" aria-hidden="true"></div>
    <p class="title-sub">スタディデッキ &nbsp;·&nbsp; Study Decks</p>
  </div>

  <div class="week-badge">
    <span class="week-dot" aria-hidden="true"></span>
    <span class="week-text" id="week-label">Loading…</span>
  </div>

  <div class="deck-links">

    <a id="vocab" class="deck c1" href="#">
      <div class="clip">
        <div class="inner">
          <div class="tile-label-wrap">
            <span class="label-en">Vocab</span>
            <span class="label-hira">ごい</span>
            <span class="label-kanji">語彙</span>
          </div>
        </div>
        <div class="sparkles" aria-hidden="true"></div>
      </div>
    </a>

    <a id="sentences" class="deck c2" href="#">
      <div class="clip">
        <div class="inner">
          <div class="tile-label-wrap">
            <span class="label-en">Sentences</span>
            <span class="label-hira">ぶん</span>
            <span class="label-kanji">文</span>
          </div>
        </div>
        <div class="sparkles" aria-hidden="true"></div>
      </div>
    </a>

    <a id="questions" class="deck c3" href="#">
      <div class="clip">
        <div class="inner">
          <div class="tile-label-wrap">
            <span class="label-en">Questions</span>
            <span class="label-hira">しつもん</span>
            <span class="label-kanji">質問</span>
          </div>
        </div>
        <div class="sparkles" aria-hidden="true"></div>
      </div>
    </a>

<!-- ── Background particles ── -->
<script>
(function () {
  const canvas = document.getElementById('bg-canvas');
  const ctx    = canvas.getContext('2d');
  const COLORS = [
    '#ff55bb','#ffaadd','#ff88cc',
    '#ffcc00','#ffe566','#fff0aa',
    '#44bbff','#88ddff','#ccf0ff',
    '#44ddaa','#88ffcc','#bbffee',
    '#ffffff','rgba(255,255,255,.6)'
  ];
  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);
  const PARTS = [];
  function makePart(scatter) {
    const height = canvas.height || 700;
    const y = scatter ? Math.random() * height : height + 12;
    return {
      x:     Math.random() * (canvas.width  || 400),
      y,
      r:     .55 + Math.random() * 2.1,
      vx:    (Math.random() - .5) * .2,
      vy:    -.04 - Math.random() * .17,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      alpha: .10 + Math.random() * .28,
      life:  scatter ? 1 - (y / height) : 0,
    };
  }
  for (let i = 0; i < 82; i++) PARTS.push(makePart(true));
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < PARTS.length; i++) {
      const p = PARTS[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life += Math.abs(p.vy) / ((canvas.height || 700) + 24);
      if (p.x < -12) p.x = canvas.width + 12;
      else if (p.x > canvas.width + 12) p.x = -12;
      if (p.y < -12) { PARTS[i] = makePart(false); continue; }
      const a = p.alpha * Math.sin(Math.min(1, p.life) * Math.PI);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = a;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>

<!-- ── Tile interaction ── -->
<script>
let lockedUI = false;
let moteInterval = null;

function resetUI() {
  lockedUI = false;
  if (moteInterval) { clearInterval(moteInterval); moteInterval = null; }
  document.querySelectorAll('a.deck').forEach(el => {
    el.classList.remove('playing', 'tap');
    el.style.pointerEvents = '';
  });
}

window.addEventListener('pageshow', ev => {
  if (ev.persisted || sessionStorage.getItem('booha_deck_open')) {
    resetUI();
    sessionStorage.removeItem('booha_deck_open');
  }
});
if (sessionStorage.getItem('booha_deck_open')) {
  resetUI();
  sessionStorage.removeItem('booha_deck_open');
}

function burstMotes(anchor, count) {
  const box = anchor.querySelector('.sparkles');
  if (!box) return;
  for (let i = 0; i < (count || 16); i++) {
    const m   = document.createElement('div');
    m.className = 'mote';
    const sz  = 4 + Math.random() * 12;
    const x   = 8  + Math.random() * 84;
    const y   = 8  + Math.random() * 84;
    const tx  = (Math.random() - .5) * 88 + 'px';
    const ty  = -(18 + Math.random() * 62) + 'px';
    const dur = (.32 + Math.random() * .52) + 's';
    m.style.cssText =
      'width:'+sz+'px;height:'+sz+'px;left:'+x+'%;top:'+y+'%;' +
      '--tx:'+tx+';--ty:'+ty+';--dur:'+dur+';' +
      'animation-delay:'+(Math.random()*.09).toFixed(3)+'s';
    box.appendChild(m);
  }
  setTimeout(() => { box.innerHTML = ''; }, 960);
}

function startMusicShow(anchor) {
  moteInterval = setInterval(() => {
    if (!anchor.classList.contains('playing')) {
      clearInterval(moteInterval); moteInterval = null; return;
    }
    burstMotes(anchor, 9);
  }, 215);
  burstMotes(anchor, 22);
}

function goToDeck(anchor) {
  if (lockedUI) return;
  lockedUI = true;
  const url = anchor.getAttribute('href');
  if (!url || url === '#') { lockedUI = false; return; }
  anchor.classList.add('tap');
  setTimeout(() => anchor.classList.remove('tap'), 110);
  document.querySelectorAll('a.deck').forEach(el => {
    if (el !== anchor) el.style.pointerEvents = 'none';
  });
  anchor.classList.add('playing');
  startMusicShow(anchor);
  sessionStorage.setItem('booha_deck_open', '1');
  setTimeout(() => { window.location.href = url; }, 1000);
}

document.querySelectorAll('a.deck').forEach(a => {
  a.addEventListener('click', e => { e.preventDefault(); goToDeck(a); }, { passive: false });
});
</script>
