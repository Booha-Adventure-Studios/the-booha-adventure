<style>
:root {
  --bg: #fff0f8;
  --bg2: #ffe4f4;
  --pink:    #ff6eb4;
  --pink2:   #ff9ed2;
  --pink3:   #ffcce8;
  --lavender:#cc88ff;
  --mint:    #88ffcc;
  --sky:     #88ddff;
  --peach:   #ffb088;
  --lemon:   #fff088;
  --coral:   #ff8899;
  --lilac:   #ddaaff;
  --card-h:  140px;
  --font-title: 'Luckiest Guy', cursive;
  --font-jp: 'M PLUS Rounded 1c', sans-serif;
}

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }

body {
  font-family: var(--font-jp);
  background: var(--bg);
  color: #3a1a2e;
  min-height: 100dvh;
  overflow-y: auto;
  overflow-x: hidden;
  padding-bottom: 3rem;
}

/* ── POLKA DOT BACKGROUND ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: radial-gradient(circle, #ffb0d8 1.5px, transparent 1.5px);
  background-size: 28px 28px;
  opacity: 0.35;
  pointer-events: none;
  z-index: 0;
}

/* ── FLOATING CLOUDS ── */
.cloud {
  position: fixed;
  border-radius: 50px;
  background: rgba(255,255,255,0.7);
  filter: blur(2px);
  pointer-events: none;
  z-index: 0;
}
.cloud::before,.cloud::after {
  content:'';position:absolute;background:inherit;border-radius:50%;
}
.cloud-1 { width:120px;height:44px;top:8%;left:-20px;animation:cloudDrift 18s linear infinite; }
.cloud-1::before { width:60px;height:60px;top:-28px;left:16px; }
.cloud-1::after  { width:44px;height:44px;top:-18px;left:50px; }
.cloud-2 { width:90px;height:34px;top:22%;right:-10px;animation:cloudDrift2 22s linear infinite; }
.cloud-2::before { width:46px;height:46px;top:-22px;left:12px; }
.cloud-2::after  { width:34px;height:34px;top:-14px;left:38px; }
.cloud-3 { width:100px;height:38px;top:60%;left:-15px;animation:cloudDrift 26s linear infinite 4s; }
.cloud-3::before { width:50px;height:50px;top:-24px;left:14px; }
.cloud-3::after  { width:40px;height:40px;top:-16px;left:44px; }
@keyframes cloudDrift  { from{transform:translateX(-10px);} to{transform:translateX(calc(100vw + 140px));} }
@keyframes cloudDrift2 { from{transform:translateX(10px);}  to{transform:translateX(calc(-100vw - 110px));} }

/* ── SPARKLES ── */
.sparkle {
  position: fixed;
  pointer-events: none;
  z-index: 1;
  font-size: 0;
  width: 8px; height: 8px;
  background: var(--c, #ff6eb4);
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  animation: sparkleFloat var(--st, 4s) var(--sd, 0s) ease-in-out infinite;
  opacity: 0;
}
@keyframes sparkleFloat {
  0%   { opacity:0; transform:translateY(0) scale(0.5) rotate(0deg); }
  20%  { opacity:1; }
  80%  { opacity:0.8; }
  100% { opacity:0; transform:translateY(-60px) scale(1.2) rotate(180deg); }
}

/* ── HEADER ── */
.header {
  position: relative;
  z-index: 10;
  text-align: center;
  padding: 1.8rem 1rem 0.6rem;
}

/* ── CLOSE BTN ── */
.close-btn {
  position: absolute;
  top: 1.2rem; right: 1.2rem;
  width: 46px; height: 46px;
  border-radius: 50%;
  background: white;
  border: 3px solid var(--pink);
  color: var(--pink);
  font-size: 1.2rem;
  font-family: var(--font-title);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  text-decoration: none;
  z-index: 20;
  box-shadow: 0 4px 0 #ffb0d8, 0 6px 16px rgba(255,110,180,0.2);
  transition: transform 0.15s, box-shadow 0.15s;
  line-height: 1;
}
.close-btn:hover {
  transform: rotate(12deg) scale(1.1);
  box-shadow: 0 2px 0 #ffb0d8, 0 4px 12px rgba(255,110,180,0.3);
}
.close-btn:active { transform: scale(0.9); box-shadow: none; }

/* ── TITLE ── */
.title-main {
  font-family: var(--font-title);
  font-size: clamp(32px, 8vw, 62px);
  letter-spacing: 0.04em;
  color: var(--pink);
  text-shadow:
    3px 3px 0 #ffb0d8,
    6px 6px 0 rgba(255,110,180,0.15);
  line-height: 1;
  animation: titleWobble 3s ease-in-out infinite;
}
@keyframes titleWobble {
  0%,100% { transform: rotate(-1deg); }
  50%     { transform: rotate(1deg); }
}

.title-sub {
  font-family: var(--font-jp);
  font-size: clamp(11px, 2.2vw, 15px);
  color: #cc88aa;
  letter-spacing: 0.1em;
  margin-top: 4px;
  font-weight: 700;
}

.week-pill {
  display: inline-block;
  margin: 8px auto 0;
  padding: 5px 18px;
  border-radius: 30px;
  background: white;
  border: 2.5px solid var(--pink2);
  font-family: var(--font-title);
  font-size: clamp(12px, 2.5vw, 16px);
  color: var(--pink);
  letter-spacing: 0.05em;
  box-shadow: 0 3px 0 #ffccdd, 0 4px 12px rgba(255,110,180,0.15);
}

/* ── WAVY DIVIDER ── */
.wavy-divider {
  position: relative;
  z-index: 5;
  width: 100%;
  overflow: hidden;
  line-height: 0;
  margin: 10px 0 0;
  height: 20px;
}
.wavy-divider svg { display: block; width: 100%; height: 20px; }

/* ── SELECT LABEL ── */
.select-label {
  text-align: center;
  font-family: var(--font-title);
  font-size: clamp(13px, 2.8vw, 18px);
  color: var(--lavender);
  letter-spacing: 0.15em;
  padding: 6px 0 2px;
  position: relative;
  z-index: 10;
  text-shadow: 2px 2px 0 rgba(204,136,255,0.2);
}

/* ── GRID ── */
.grid-wrap {
  position: relative;
  z-index: 10;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  padding: 0.8rem 0.9rem 2.5rem;
  max-width: 680px;
  margin: 0 auto;
}

/* ── TILES ── */
.tile {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: var(--card-h);
  border-radius: 22px;
  text-decoration: none;
  cursor: pointer;
  overflow: hidden;
  transition: transform 0.18s cubic-bezier(.34,1.56,.64,1), box-shadow 0.18s;
  -webkit-tap-highlight-color: transparent;
  border: 3px solid rgba(255,255,255,0.9);
}

.tile:nth-child(1) { background: linear-gradient(145deg, #ffb8d8, #ff80c0); box-shadow: 0 6px 0 #e060a0, 0 8px 20px rgba(255,110,180,0.25); --tc: #fff; }
.tile:nth-child(2) { background: linear-gradient(145deg, #c8aaff, #aa77ff); box-shadow: 0 6px 0 #8844cc, 0 8px 20px rgba(170,119,255,0.25); --tc: #fff; }
.tile:nth-child(3) { background: linear-gradient(145deg, #88eeff, #44ccff); box-shadow: 0 6px 0 #2299cc, 0 8px 20px rgba(68,204,255,0.25); --tc: #1a3a4a; }
.tile:nth-child(4) { background: linear-gradient(145deg, #ffeeaa, #ffcc44); box-shadow: 0 6px 0 #cc9900, 0 8px 20px rgba(255,204,68,0.3); --tc: #4a3000; }
.tile:nth-child(5) { background: linear-gradient(145deg, #aaffdd, #44ddaa); box-shadow: 0 6px 0 #22aa77, 0 8px 20px rgba(68,221,170,0.25); --tc: #0a2e1e; }
.tile:nth-child(6) { background: linear-gradient(145deg, #ffccaa, #ff9966); box-shadow: 0 6px 0 #cc5533, 0 8px 20px rgba(255,153,102,0.25); --tc: #3a1500; }
.tile:nth-child(7) { background: linear-gradient(145deg, #ffaabb, #ff6688); box-shadow: 0 6px 0 #cc2244, 0 8px 20px rgba(255,102,136,0.25); --tc: #fff; }
.tile:nth-child(8) { background: linear-gradient(145deg, #aaddff, #66bbff); box-shadow: 0 6px 0 #2277cc, 0 8px 20px rgba(102,187,255,0.25); --tc: #0a2040; }
.tile:nth-child(9) { background: linear-gradient(145deg, #ddaaff, #bb77ff); box-shadow: 0 6px 0 #7733cc, 0 8px 20px rgba(187,119,255,0.25); --tc: #fff; }

.tile:hover {
  transform: translateY(-6px) scale(1.04) rotate(-1deg);
  filter: brightness(1.08);
}

.tile:active { transform: translateY(2px) scale(0.96); box-shadow: 0 2px 0 transparent !important; }

/* ── Weekly star overlay (PB variant: preserves 3D button shadow) ── */
.tile-stars{
  position:absolute; top:7px; right:9px;
  font-size:15px; letter-spacing:2px; line-height:1;
  color:#ffd54f;
  text-shadow:-1px -1px 0 rgba(0,0,0,.55), 1px -1px 0 rgba(0,0,0,.55),
              -1px 1px 0 rgba(0,0,0,.55), 1px 1px 0 rgba(0,0,0,.55);
  pointer-events:none; z-index:2;
}
.tile.gold3{ animation:goldPulse 2.6s ease-in-out infinite; }
@keyframes goldPulse{
  0%,100%{ filter:drop-shadow(0 0 6px rgba(255,200,60,.45)); }
  50%    { filter:drop-shadow(0 0 16px rgba(255,200,60,.85)); }
} 

/* shine */
.tile::before {
  content: '';
  position: absolute;
  top: -50%; left: -70%;
  width: 50%; height: 200%;
  background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,0.5) 50%, transparent 70%);
  transform: skewX(-15deg);
  transition: left 0.5s ease;
  pointer-events: none;
  z-index: 2;
}
.tile:hover::before { left: 140%; }

/* rounded inner highlight */
.tile::after {
  content: '';
  position: absolute;
  top: 4px; left: 8px; right: 8px;
  height: 36%;
  border-radius: 12px;
  background: rgba(255,255,255,0.3);
  pointer-events: none;
  z-index: 1;
}

.tile-content {
  position: relative;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  text-align: center;
  padding: 0 6px;
  width: 100%;
}

.tile-en {
  font-family: var(--font-title);
  font-size: clamp(13px, 2.8vw, 17px);
  color: #3a1a2e;
  text-shadow:
    0 2px 0 rgba(255,255,255,0.75),
    0 4px 8px rgba(0,0,0,0.18);
  line-height: 1.1;
  letter-spacing: 0.03em;
}

.tile-hira {
  font-family: var(--font-jp);
  font-size: clamp(10px, 2vw, 13px);
  color: #3a1a2e;
  opacity: 0.95;
  font-weight: 800;
  line-height: 1.2;
  text-shadow:
    0 1px 0 rgba(255,255,255,0.7),
    0 2px 4px rgba(0,0,0,0.16);
}

.tile-jp {
  font-family: var(--font-jp);
  font-size: clamp(9px, 1.7vw, 11px);
  color: #3a1a2e;
  opacity: 0.8;
  font-weight: 700;
  line-height: 1.2;
  text-shadow:
    0 1px 0 rgba(255,255,255,0.65),
    0 2px 4px rgba(0,0,0,0.14);
}

/* ── EFFECTS ── */
.kaboom-ring {
  position: fixed; border-radius: 50%;
  border: 3px solid #ff6eb4;
  pointer-events: none; z-index: 9998; opacity: 0.9;
  animation: ringExpand 0.55s cubic-bezier(0.2,0.8,0.4,1) forwards;
}
@keyframes ringExpand {
  from { transform: translate(-50%,-50%) scale(0); opacity: 0.9; }
  to   { transform: translate(-50%,-50%) scale(5); opacity: 0; }
}
.burst-dot {
  position: fixed; border-radius: 50%;
  pointer-events: none; z-index: 9999;
  animation: burstFly var(--dur,0.7s) ease-out forwards;
}
@keyframes burstFly {
  0%   { transform: translate(-50%,-50%) scale(1); opacity: 1; }
  100% { transform: translate(-50%,-50%) translate(var(--bx),var(--by)) scale(0.1); opacity: 0; }
}
.tile.warp { animation: tileWarp 0.3s ease-out forwards; }
@keyframes tileWarp {
  0%  { transform: scale(1) rotate(0); }
  45% { transform: scale(1.2) rotate(-3deg); filter: brightness(1.5); }
  100%{ transform: scale(1) rotate(0); }
}

#swipeScreen {
  position: fixed; inset: 0;
  background: #fff0f8;
  z-index: 9997;
  transform: translateY(100%);
  transition: transform 0.12s ease-in;
  pointer-events: none;
}
#swipeScreen.go { transform: translateY(0); }

@media (max-width: 500px) {
  .grid-wrap { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0.7rem 0.8rem 2rem; }
  :root { --card-h: 122px; }
}
</style>

<body>

<div class="cloud cloud-1"></div>
<div class="cloud cloud-2"></div>
<div class="cloud cloud-3"></div>

<header class="header">

<div class="select-label">CHOOSE YOUR GAME!</div>

<div class="grid-wrap" id="gameGrid">

<script type="module">
import { getWeekParam, getPageContext } from '../../js/nav.js';

const week = getWeekParam();
const ctx  = getPageContext();
if (!week || !ctx) { window.location.assign('../../index.html#hub'); }

function formatWeekLabel(id) {
  const parts = id.split('_');

  const monthMap = {
    jan:"January",
    feb:"February",
    mar:"March",
    apr:"April",
    may:"May",
    jun:"June",
    jul:"July",
    aug:"August",
    sep:"September",
    oct:"October",
    nov:"November",
    dec:"December"
  };

  const month = monthMap[parts[1]] || parts[1];
  const week  = (parts[2] || "").replace('w','');

  return `${month} Week ${week}`;
}  

document.getElementById('weekLabel').textContent = formatWeekLabel(week);

/* sparkles */
(function(){
  const C = ['#ff6eb4','#cc88ff','#88ffcc','#ffb088','#fff088','#ff8899','#88ddff'];
  for (let i = 0; i < 20; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.style.left = Math.random()*100+'vw';
    s.style.top  = (20 + Math.random()*75)+'vh';
    s.style.setProperty('--c',  C[i % C.length]);
    s.style.setProperty('--st', (3+Math.random()*4)+'s');
    s.style.setProperty('--sd', (Math.random()*5)+'s');
    s.style.width = s.style.height = (6+Math.random()*8)+'px';
    document.body.appendChild(s);
  }
})();

const DOT_C = ['#ff6eb4','#cc88ff','#44ccff','#ffcc44','#44ddaa','#ff9966','#ff6688','#66bbff','#bb77ff'];
function kaboom(cx, cy, color) {
  const ring = document.createElement('div');
  ring.className = 'kaboom-ring';
  ring.style.cssText = `left:${cx}px;top:${cy}px;width:52px;height:52px;border-color:${color};`;
  document.body.appendChild(ring);
  ring.addEventListener('animationend', () => ring.remove());
  for (let i = 0; i < 16; i++) {
    const a = (i/16)*Math.PI*2, d = 40+Math.random()*65;
    const dot = document.createElement('div');
    dot.className = 'burst-dot';
    dot.style.cssText = `left:${cx}px;top:${cy}px;width:8px;height:8px;background:${DOT_C[i%DOT_C.length]};`;
    dot.style.setProperty('--bx', (Math.cos(a)*d).toFixed(1)+'px');
    dot.style.setProperty('--by', (Math.sin(a)*d).toFixed(1)+'px');
    dot.style.setProperty('--dur', (0.4+Math.random()*0.4)+'s');
    document.body.appendChild(dot);
    dot.addEventListener('animationend', () => dot.remove());
  }
}

let locked = false;
const swipe = document.getElementById('swipeScreen');
const RING_C = ['#ff80c0','#aa77ff','#44ccff','#ffcc44','#44ddaa','#ff9966','#ff6688','#66bbff','#bb77ff'];
const tiles = [...document.querySelectorAll('.tile')];

document.getElementById('gameGrid').addEventListener('click', e => {
  const tile = e.target.closest('.tile');
  if (!tile || locked) return;
  e.preventDefault();
  locked = true;
  const idx = tiles.indexOf(tile);
  const r = tile.getBoundingClientRect();
  const cx = r.left+r.width/2, cy = r.top+r.height/2;
  tile.classList.add('warp');
  kaboom(cx, cy, RING_C[idx]||'#ff6eb4');
  setTimeout(() => { document.body.style.transition='background 0.1s'; document.body.style.background='#fff'; }, 280);
  setTimeout(() => { document.body.style.background='var(--bg)'; swipe.classList.add('go'); }, 380);
  setTimeout(() => {
    window.location.href = `/the-booha-adventure/game.html?week=${encodeURIComponent(week)}&game=${encodeURIComponent(tile.dataset.game)}`;
  }, 560);
});

document.getElementById('closeBtn').addEventListener('click', function(e) {
  e.preventDefault();
  if (locked) return;
  locked = true;

  const r = this.getBoundingClientRect();
  kaboom(r.left + r.width / 2, r.top + r.height / 2, '#ff2288');

  sessionStorage.setItem('booha_reopen_popup', '1');
  sessionStorage.setItem('booha_return_week', week);

  setTimeout(() => { swipe.classList.add('go'); }, 280);

  setTimeout(() => {
    window.location.href = `/the-booha-adventure/maze.html?week=${encodeURIComponent(week)}`;
  }, 480);
});

  
</script>
 
<script>
/* ── Weekly star overlay ─────────────────────────────────
   Reads weekly.gameStars ONLY (resets Monday via core boot).
   ⚠️ Never read scores[...].stars here — that is the
   all-time best and would survive the weekly reset. ── */
(function () {
  'use strict';
  var CURR = 'pb';
  document.addEventListener('booha:ready', function () {
    var scores = window.BoohaAdventure && BoohaAdventure.scores;
    if (!scores) return;
    document.querySelectorAll('.tile[data-game]').forEach(function (tile) {
      var saveId = CURR + ':' + tile.dataset.game.replace(/-/g, '_');
      var stars  = 0;
      try { stars = scores.weeklyStarsForGame(saveId) || 0; } catch (e) {}
      if (!stars) return; /* untouched tiles stay bare */
      var badge = document.createElement('span');
      badge.className   = 'tile-stars';
      badge.textContent = '★★★'.slice(0, stars);
      tile.appendChild(badge);
      if (stars === 3) tile.classList.add('gold3');
    });
  });
})();
</script>
</body>
</html>
