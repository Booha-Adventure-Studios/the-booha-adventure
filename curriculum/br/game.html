
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Booha Game</title>

<style>
html,body{
  margin:0;
  padding:0;
  background:#000;
  color:#fff;
  font-family:sans-serif;
  height:100%;
}

#gameContainer{
  width:100%;
  height:100%;
  position:relative;
}
</style>
</head>

<body>

<div id="gameContainer"></div>
<div id="app"></div>  

<script type="module">
  import { getWeekParam, getGameParam, parseWeekSlug } from "../../js/nav.js";

  const app = document.getElementById("app");

  function fail(message) {
    app.innerHTML = `<div style="padding:24px;color:white;">${message}</div>`;
    throw new Error(message);
  }

  async function init() {
    const week = getWeekParam();
    const game = getGameParam();

    if (!week) fail("Missing week parameter.");
    if (!game) fail("Missing game parameter.");

    const parsed = parseWeekSlug(week);
    if (!parsed) fail("Invalid week format.");

    const gamesPath = `/content/${parsed.curriculum}/${parsed.monthDir}/games.json`;
    const res = await fetch(gamesPath, { cache: "no-store" });

    if (!res.ok) fail(`Could not load games.json: ${gamesPath}`);

    const data = await res.json();
    const gameConfig = (data.games || []).find(item => item.id === game);

    if (!gameConfig) fail(`Game not found: ${game}`);

    window.BOOHA_GAME_CONTEXT = {
      weekId: week,
      curriculum: parsed.curriculum,
      monthShort: parsed.monthShort,
      monthDir: parsed.monthDir,
      weekNumber: parsed.weekNumber,
      contentWeek: parsed.contentWeek,
      gameId: gameConfig.id,
      title: gameConfig.title,
      engine: gameConfig.engine,
      contentType: gameConfig.contentType,
      contentPath: `/content/${parsed.curriculum}/${parsed.monthDir}/${gameConfig.contentType}.json`
    };

    await import(`../../games/${gameConfig.engine}.js`);
  }

  init().catch(err => {
    console.error(err);
    if (app) {
      app.innerHTML = `<div style="padding:24px;color:white;">Game failed to load.</div>`;
    }
  });
</script>

</body>
</html>
