<style>
:root {
  --bg: #060010;
  --green:  #aaff22;
  --pink:   #ff2288;
  --blue:   #0088ff;
  --gold:   #ffcc00;
  --teal:   #00ffcc;
  --orange: #ff6600;
  --purple: #cc44ff;
  --red:    #ff3344;
  --sky:    #22ddff;
  --card-h: 136px;
  --font-title: 'Wendy One', sans-serif;
  --font-jp: 'M PLUS Rounded 1c', sans-serif;
}

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }

body {
  font-family: var(--font-jp);
  background: var(--bg);
  color: #fff;
  min-height: 100dvh;
  overflow-y: auto;
  overflow-x: hidden;
  padding-bottom: 3rem;
}

/* scanlines */
body::before {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px);
  pointer-events: none; z-index: 9000;
}

/* scrolling grid */
.floor-grid {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(0,136,255,0.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,136,255,0.07) 1px, transparent 1px);
  background-size: 40px 40px;
  animation: gridScroll 10s linear infinite;
}
@keyframes gridScroll { from{background-position:0 0;} to{background-position:0 40px;} }

/* glow orbs */
.orb { position:fixed; border-radius:50%; filter:blur(90px); pointer-events:none; z-index:0; animation:orbDrift var(--t,14s) ease-in-out infinite alternate; }
.orb-1{width:400px;height:400px;background:rgba(170,255,34,0.1);top:-80px;left:-60px;--t:13s;}
.orb-2{width:340px;height:340px;background:rgba(255,34,136,0.09);bottom:-50px;right:-70px;--t:17s;}
.orb-3{width:260px;height:260px;background:rgba(0,136,255,0.09);top:40%;left:50%;--t:11s;}
@keyframes orbDrift{from{transform:translate(0,0)scale(1);}to{transform:translate(28px,38px)scale(1.1);}}

/* floating particles */
.particle {
  position: fixed; border-radius: 2px;
  pointer-events: none; z-index: 1;
  animation: particleRise var(--pt,6s) var(--pd,0s) linear infinite;
  opacity: 0;
}
@keyframes particleRise {
  0%   { opacity:0; transform:translateY(0) rotate(0deg); }
  10%  { opacity:0.7; }
  90%  { opacity:0.5; }
  100% { opacity:0; transform:translateY(-100vh) rotate(360deg); }
}

/* ── HEADER ── */
.header {
  position: relative; z-index: 10;
  text-align: center;
  padding: 1.6rem 1rem 0.4rem;
}

.close-btn {
  position: absolute; top:1.1rem; right:1.1rem;
  width:46px; height:46px; border-radius:50%;
  background:rgba(0,0,0,0.6);
  border:2px solid rgba(255,255,255,0.25);
  color:#fff; font-size:1.2rem;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; text-decoration:none; z-index:20;
  transition:background 0.2s,transform 0.2s,border-color 0.2s;
  backdrop-filter:blur(10px); line-height:1;
  box-shadow:0 0 14px rgba(255,34,136,0.2);
}
.close-btn:hover{background:rgba(255,34,136,0.35);border-color:var(--pink);transform:scale(1.1) rotate(8deg);box-shadow:0 0 22px rgba(255,34,136,0.5);}

.title-main {
  font-family: var(--font-title);
  font-size: clamp(30px, 7.5vw, 58px);
  letter-spacing: 0.06em;
  line-height: 1;
  background: linear-gradient(120deg, var(--green), var(--sky), var(--pink), var(--gold), var(--teal), var(--green));
  background-size: 300% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: rainbowShift 3s linear infinite;
  filter: drop-shadow(0 0 8px rgba(170,255,34,0.35));
}
@keyframes rainbowShift{0%{background-position:0% center;}100%{background-position:300% center;}}

.title-sub {
  font-family: var(--font-jp);
  font-size: clamp(11px, 2.2vw, 15px);
  color: rgba(255,255,255,0.45);
  letter-spacing: 0.12em;
  margin-top: 3px;
}

.week-pill {
  display: inline-block;
  margin: 7px auto 0;
  padding: 4px 16px;
  border-radius: 20px;
  border: 1.5px solid rgba(170,255,34,0.35);
  background: rgba(170,255,34,0.07);
  font-family: var(--font-title);
  font-size: clamp(11px, 2vw, 14px);
  color: var(--green);
  letter-spacing: 0.06em;
  box-shadow: 0 0 12px rgba(170,255,34,0.12);
}

/* neon divider */
.neon-divider {
  display: flex; align-items: center; justify-content: center;
  gap: 10px; margin: 10px auto 0; max-width: 300px;
}
.neon-line { flex:1; height:1.5px; background:linear-gradient(90deg,transparent,rgba(170,255,34,0.5),transparent); }
.neon-dot  { width:6px; height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); animation:dotPulse 1.4s ease-in-out infinite; }
.neon-dot:nth-child(3){animation-delay:0.2s;background:var(--sky);box-shadow:0 0 8px var(--sky);}
.neon-dot:nth-child(5){animation-delay:0.4s;background:var(--pink);box-shadow:0 0 8px var(--pink);}
@keyframes dotPulse{0%,100%{transform:scale(1);opacity:0.6;}50%{transform:scale(1.6);opacity:1;}}

.select-label {
  text-align:center;
  font-family: var(--font-title);
  font-size: clamp(12px, 2.5vw, 16px);
  color: var(--gold);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  padding: 7px 0 2px;
  position: relative; z-index: 10;
  text-shadow: 0 0 12px rgba(255,204,0,0.5);
  animation: blinkLabel 2s step-end infinite;
}
@keyframes blinkLabel{0%,100%{opacity:1;}50%{opacity:0.3;}}

/* ── SCORE BLOCKS ── */
.score-bar {
  display:flex; justify-content:center; gap:5px;
  padding: 0 1rem 2px;
  position: relative; z-index: 10;
}
.score-block {
  width:14px; height:14px; border-radius:2px;
  animation: blockPulse 1.5s ease-in-out infinite;
}
.score-block:nth-child(1){background:var(--green);  animation-delay:0s;}
.score-block:nth-child(2){background:var(--sky);    animation-delay:0.1s;}
.score-block:nth-child(3){background:var(--gold);   animation-delay:0.2s;}
.score-block:nth-child(4){background:var(--purple); animation-delay:0.3s;}
.score-block:nth-child(5){background:var(--teal);   animation-delay:0.4s;}
.score-block:nth-child(6){background:var(--orange); animation-delay:0.5s;}
.score-block:nth-child(7){background:var(--pink);   animation-delay:0.6s;}
.score-block:nth-child(8){background:var(--blue);   animation-delay:0.7s;}
.score-block:nth-child(9){background:var(--red);    animation-delay:0.8s;}
@keyframes blockPulse{0%,100%{opacity:0.35;transform:scaleY(1);}50%{opacity:1;transform:scaleY(1.7);}}

/* ── GRID ── */
.grid-wrap {
  position:relative; z-index:10;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  padding:0.6rem 0.9rem 2.5rem;
  max-width:700px; margin:0 auto;
}

/* ── TILES ── */
.tile {
  position:relative; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  height:var(--card-h); border-radius:16px;
  text-decoration:none; cursor:pointer; overflow:hidden;
  transition:transform 0.15s ease,filter 0.15s;
  -webkit-tap-highlight-color:transparent;
  border:2px solid var(--tn, rgba(255,255,255,0.15));
}

.tile:nth-child(1){background:linear-gradient(145deg,#001800,#003300);--tn:var(--green);box-shadow:0 0 16px rgba(170,255,34,0.2),inset 0 0 20px rgba(170,255,34,0.04);}
.tile:nth-child(2){background:linear-gradient(145deg,#000e1a,#001e36);--tn:var(--sky);box-shadow:0 0 16px rgba(34,221,255,0.2),inset 0 0 20px rgba(34,221,255,0.04);}
.tile:nth-child(3){background:linear-gradient(145deg,#1a1400,#332800);--tn:var(--gold);box-shadow:0 0 16px rgba(255,204,0,0.2),inset 0 0 20px rgba(255,204,0,0.04);}
.tile:nth-child(4){background:linear-gradient(145deg,#12001e,#24003c);--tn:var(--purple);box-shadow:0 0 16px rgba(204,68,255,0.2),inset 0 0 20px rgba(204,68,255,0.04);}
.tile:nth-child(5){background:linear-gradient(145deg,#001410,#002820);--tn:var(--teal);box-shadow:0 0 16px rgba(0,255,204,0.2),inset 0 0 20px rgba(0,255,204,0.04);}
.tile:nth-child(6){background:linear-gradient(145deg,#180500,#300e00);--tn:var(--orange);box-shadow:0 0 16px rgba(255,102,0,0.2),inset 0 0 20px rgba(255,102,0,0.04);}
.tile:nth-child(7){background:linear-gradient(145deg,#180008,#300014);--tn:var(--pink);box-shadow:0 0 16px rgba(255,34,136,0.2),inset 0 0 20px rgba(255,34,136,0.04);}
.tile:nth-child(8){background:linear-gradient(145deg,#000818,#001030);--tn:var(--blue);box-shadow:0 0 16px rgba(0,136,255,0.2),inset 0 0 20px rgba(0,136,255,0.04);}
.tile:nth-child(9){background:linear-gradient(145deg,#180000,#300000);--tn:var(--red);box-shadow:0 0 16px rgba(255,51,68,0.2),inset 0 0 20px rgba(255,51,68,0.04);}

.tile:hover{transform:translateY(-5px) scale(1.04);filter:brightness(1.25);}
 
.tile:active{transform:scale(0.94);}

/* ── Weekly star overlay ── */
.tile-stars{
  position:absolute; top:7px; right:9px;
  font-size:15px; letter-spacing:2px; line-height:1;
  color:#ffd54f;
  text-shadow:0 0 6px rgba(255,190,40,.9), 0 1px 2px rgba(0,0,0,.8);
  pointer-events:none; z-index:2;
}
.tile.gold3{ border-color:#ffd54f; animation:goldPulse 2.6s ease-in-out infinite; }
@keyframes goldPulse{
  0%,100%{ box-shadow:0 0 14px rgba(255,200,60,.40), inset 0 0 18px rgba(255,200,60,.08); }
  50%    { box-shadow:0 0 26px rgba(255,200,60,.70), inset 0 0 26px rgba(255,200,60,.14); }
}

.tile::before{
  content:'';position:absolute;top:-55%;left:-75%;
  width:50%;height:210%;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,0.15) 50%,transparent 70%);
  transform:skewX(-18deg);transition:left 0.5s;pointer-events:none;z-index:2;
}
.tile:hover::before{left:140%;}

.tile-content{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding:0 6px;width:100%;}

.tile-en {
  font-family:var(--font-title);
  font-size:clamp(13px,2.8vw,17px);
  color:#fff;
  text-shadow:0 0 10px var(--tn),0 1px 4px rgba(0,0,0,0.5);
  line-height:1.1; letter-spacing:0.03em;
}
.tile-hira {
  font-family:var(--font-jp);
  font-size:clamp(10px,2vw,13px);
  color:rgba(255,255,255,0.85);
  font-weight:800; line-height:1.2;
}
.tile-jp {
  font-family:var(--font-jp);
  font-size:clamp(9px,1.7vw,11px);
  color:rgba(255,255,255,0.45);
  font-weight:400; line-height:1.2;
}

/* ── EFFECTS ── */
.kaboom-ring{position:fixed;border-radius:50%;border:3px solid #fff;pointer-events:none;z-index:9998;opacity:0.9;animation:ringExpand 0.55s cubic-bezier(0.2,0.8,0.4,1) forwards;}
@keyframes ringExpand{from{transform:translate(-50%,-50%) scale(0);opacity:0.9;}to{transform:translate(-50%,-50%) scale(5);opacity:0;}}
.burst-dot{position:fixed;border-radius:50%;pointer-events:none;z-index:9999;animation:burstFly var(--dur,0.7s) ease-out forwards;}
@keyframes burstFly{0%{transform:translate(-50%,-50%) scale(1);opacity:1;}100%{transform:translate(-50%,-50%) translate(var(--bx),var(--by)) scale(0.1);opacity:0;}}
.tile.warp{animation:tileWarp 0.3s ease-out forwards;}
@keyframes tileWarp{0%{transform:scale(1);}45%{transform:scale(1.2);filter:brightness(1.6) saturate(1.8);}100%{transform:scale(1);}}

#swipeScreen{position:fixed;inset:0;background:#000;z-index:9997;transform:translateY(100%);transition:transform 0.12s ease-in;pointer-events:none;}
#swipeScreen.go{transform:translateY(0);}

@media(max-width:500px){
  .grid-wrap{grid-template-columns:repeat(2,1fr);gap:10px;padding:0.6rem 0.75rem 2rem;}
  :root{--card-h:120px;}
}
</style>
</head>

<script type="module">
import { getWeekParam, getPageContext } from '../../js/nav.js';

const week = getWeekParam();
const ctx  = getPageContext();
if (!week || !ctx) { window.location.assign('../../index.html#hub'); }

function formatWeekLabel(id) {
  const parts = id.split('_');

  const monthMap = {
    jan:"January",
    feb:"February",
    mar:"March",
    apr:"April",
    may:"May",
    jun:"June",
    jul:"July",
    aug:"August",
    sep:"September",
    oct:"October",
    nov:"November",
    dec:"December"
  };

  const month = monthMap[parts[1]] || parts[1];
  const week  = (parts[2] || "").replace('w','');

  return `${month} Week ${week}`;
}  

document.getElementById('weekLabel').textContent = formatWeekLabel(week);

/* particles */
(function(){
  const C = ['#aaff22','#22ddff','#ff2288','#ffcc00','#00ffcc','#cc44ff','#ff6600','#0088ff'];
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random()*100+'vw';
    p.style.top  = (10 + Math.random()*85)+'vh';
    p.style.background = C[i % C.length];
    p.style.width  = (2+Math.random()*3)+'px';
    p.style.height = (2+Math.random()*3)+'px';
    p.style.setProperty('--pt', (4+Math.random()*8)+'s');
    p.style.setProperty('--pd', (Math.random()*8)+'s');
    document.body.appendChild(p);
  }
})();

const DOT_C = ['#aaff22','#22ddff','#ffcc00','#cc44ff','#00ffcc','#ff6600','#ff2288','#0088ff','#ff3344'];
function kaboom(cx, cy, color) {
  const ring = document.createElement('div');
  ring.className = 'kaboom-ring';
  ring.style.cssText = `left:${cx}px;top:${cy}px;width:54px;height:54px;border-color:${color};`;
  document.body.appendChild(ring);
  ring.addEventListener('animationend', () => ring.remove());
  for (let i = 0; i < 18; i++) {
    const a = (i/18)*Math.PI*2, d = 48+Math.random()*68;
    const dot = document.createElement('div');
    dot.className = 'burst-dot';
    dot.style.cssText = `left:${cx}px;top:${cy}px;width:8px;height:8px;background:${DOT_C[i%DOT_C.length]};`;
    dot.style.setProperty('--bx', (Math.cos(a)*d).toFixed(1)+'px');
    dot.style.setProperty('--by', (Math.sin(a)*d).toFixed(1)+'px');
    dot.style.setProperty('--dur', (0.45+Math.random()*0.45)+'s');
    document.body.appendChild(dot);
    dot.addEventListener('animationend', () => dot.remove());
  }
}

let locked = false;
const swipe = document.getElementById('swipeScreen');
const RING_C = ['#aaff22','#22ddff','#ffcc00','#cc44ff','#00ffcc','#ff6600','#ff2288','#0088ff','#ff3344'];
const tiles = [...document.querySelectorAll('.tile')];

document.getElementById('gameGrid').addEventListener('click', e => {
  const tile = e.target.closest('.tile');
  if (!tile || locked) return;
  e.preventDefault();
  locked = true;
  const idx = tiles.indexOf(tile);
  const r = tile.getBoundingClientRect();
  tile.classList.add('warp');
  kaboom(r.left+r.width/2, r.top+r.height/2, RING_C[idx]||'#fff');
  setTimeout(() => { document.body.style.transition='background 0.08s'; document.body.style.background='#fff'; }, 280);
  setTimeout(() => { document.body.style.background='var(--bg)'; swipe.classList.add('go'); }, 380);
  setTimeout(() => {
    window.location.href = `/the-booha-adventure/game.html?week=${encodeURIComponent(week)}&game=${encodeURIComponent(tile.dataset.game)}`;
  }, 560);
});

document.getElementById('closeBtn').addEventListener('click', function(e) {
  e.preventDefault();
  if (locked) return;
  locked = true;

  const r = this.getBoundingClientRect();
  kaboom(r.left + r.width / 2, r.top + r.height / 2, '#ff2288');

  sessionStorage.setItem('booha_reopen_popup', '1');
  sessionStorage.setItem('booha_return_week', week);

  setTimeout(() => { swipe.classList.add('go'); }, 280);

  setTimeout(() => {
    window.location.href = `/the-booha-adventure/maze.html?week=${encodeURIComponent(week)}`;
  }, 480);
});

  
</script>
</body>

<script>
/* ── Weekly star overlay ─────────────────────────────────
   Reads weekly.gameStars ONLY (resets Monday via core boot).
   ⚠️ Never read scores[...].stars here — that is the
   all-time best and would survive the weekly reset. ── */
(function () {
  'use strict';
  var CURR = 'br';
  document.addEventListener('booha:ready', function () {
    var scores = window.BoohaAdventure && BoohaAdventure.scores;
    if (!scores) return;
    document.querySelectorAll('.tile[data-game]').forEach(function (tile) {
      var saveId = CURR + ':' + tile.dataset.game.replace(/-/g, '_');
      var stars  = 0;
      try { stars = scores.weeklyStarsForGame(saveId) || 0; } catch (e) {}
      if (!stars) return; /* untouched tiles stay bare */
      var badge = document.createElement('span');
      badge.className   = 'tile-stars';
      badge.textContent = '★★★'.slice(0, stars);
      tile.appendChild(badge);
      if (stars === 3) tile.classList.add('gold3');
    });
  });
})();
</script> 
</html>
