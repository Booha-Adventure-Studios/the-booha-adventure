
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Boo-Continuum</title>
<meta name="theme-color" content="#07080f">
<link href="https://fonts.googleapis.com/css2?family=Grenze:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />

<style>
:root {
  --bg: #07080f;

  /* Tile 1 — Crimson Codex */
  --c1-bg:     linear-gradient(145deg, #7a1020 0%, #300608 55%, #560c18 100%);
  --c1-border: #d4404c;
  --c1-halo:   rgba(212,64,76,.55);
  --c1-ring-a: #c03040;
  --c1-ring-b: #e89090;
  --c1-mote:   #f0c0c4;

  /* Tile 2 — Amber Folio */
  --c2-bg:     linear-gradient(145deg, #7a5000 0%, #321e00 55%, #5a3800 100%);
  --c2-border: #d4a040;
  --c2-halo:   rgba(212,160,64,.55);
  --c2-ring-a: #c08820;
  --c2-ring-b: #e8cc80;
  --c2-mote:   #f0dca0;

  /* Tile 3 — Slate Violet */
  --c3-bg:     linear-gradient(145deg, #2e1a60 0%, #100828 55%, #200c48 100%);
  --c3-border: #8868cc;
  --c3-halo:   rgba(136,104,204,.55);
  --c3-ring-a: #6644b8;
  --c3-ring-b: #b8a0e8;
  --c3-mote:   #d4c8f4;

  /* Tile 4 — Iron Teal */
  --c4-bg:     linear-gradient(145deg, #0c4050 0%, #041820 55%, #083040 100%);
  --c4-border: #3898b8;
  --c4-halo:   rgba(56,152,184,.55);
  --c4-ring-a: #2080a8;
  --c4-ring-b: #80c4d8;
  --c4-mote:   #b0dce8;

  --white:     #f0ece4;
  --white-dim: rgba(240,236,228,.52);

  --tile-w: 158px;
  --tile-h: 158px;
  --tile-r: 16px;

  --font-head: 'Grenze', serif;
  --font-jp:   'Noto Sans JP', sans-serif;
}

@property --angle {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: false;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--font-head);
  background: var(--bg);
  color: var(--white);
  overflow: hidden;
}

#app {
  position: relative;
  z-index: 1;
  height: 100dvh;
  max-height: 100vh;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}

#bg-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* ── Atmospheric depth layers ── */

/* Faint vignette to deepen corners */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at 50% 50%,
    transparent 40%,
    rgba(0,0,0,.55) 100%
  );
}

/* Cross-hatched parchment grain */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: .038;
  background-image:
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 3px,
      rgba(240,236,228,.6) 3px,
      rgba(240,236,228,.6) 4px
    ),
    repeating-linear-gradient(
      90deg,
      transparent,
      transparent 3px,
      rgba(240,236,228,.6) 3px,
      rgba(240,236,228,.6) 4px
    );
  background-size: 32px 32px;
}

/* Moody ambient glows — slow, heavy */
.bg-glow {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
  filter: blur(110px);
  opacity: .1;
}
.bg-glow.g1 {
  width: 520px; height: 360px;
  background: radial-gradient(ellipse, #7a1020, transparent 70%);
  top: -100px; left: -120px;
  animation: glowBreath 20s ease-in-out infinite;
}
.bg-glow.g2 {
  width: 420px; height: 300px;
  background: radial-gradient(ellipse, #2e1a60, transparent 70%);
  bottom: -80px; right: -100px;
  animation: glowBreath 26s ease-in-out 4s infinite reverse;
}
.bg-glow.g3 {
  width: 300px; height: 260px;
  background: radial-gradient(ellipse, #7a5000, transparent 70%);
  top: 45%; left: 50%;
  transform: translateX(-50%);
  opacity: .07;
  animation: glowBreath 18s ease-in-out 8s infinite;
}
@keyframes glowBreath {
  0%,100% { transform: translate(0,0)    scale(1); }
  40%     { transform: translate(16px,-14px) scale(1.06); }
  70%     { transform: translate(-10px,10px) scale(.95); }
}

/* ── Welcome layout ── */
#welcome {
  position: relative;
  z-index: 1;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 32px 20px 32px;
  gap: 0;
  animation: fadeUp 1.3s cubic-bezier(.22,.8,.36,1) both;
}

/* ── Icon ── */
.boo-icon-wrap {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 18px;
}

/* Slow-rotating rune ring around the icon */
.boo-icon-wrap::before {
  content: '';
  position: absolute;
  inset: -16px;
  border-radius: 50%;
  border: 1px solid rgba(240,236,228,.1);
  box-shadow:
    0 0 18px rgba(212,64,76,.2),
    inset 0 0 18px rgba(212,64,76,.08);
  animation: runeSpin 22s linear infinite;
}
.boo-icon-wrap::after {
  content: '';
  position: absolute;
  inset: -28px;
  border-radius: 50%;
  border: 1px dashed rgba(240,236,228,.07);
  animation: runeSpin 38s linear infinite reverse;
}
@keyframes runeSpin { to { transform: rotate(360deg); } }

.boo-icon {
  width: clamp(58px, 11vw, 86px);
  height: auto;
  filter:
    drop-shadow(0 0 28px rgba(212,64,76,.5))
    drop-shadow(0 0 8px rgba(212,64,76,.25))
    drop-shadow(0 4px 18px rgba(0,0,0,.85));
  animation: floatIcon 5s cubic-bezier(.45,.05,.55,.95) infinite;
}
@keyframes floatIcon {
  0%,100% { transform: translateY(0); }
  50%     { transform: translateY(-8px); }
}

/* ── Title ── */
.title-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  margin-bottom: 8px;
}

.title-en {
  font-family: var(--font-head);
  font-weight: 700;
  font-size: clamp(28px, 6.5vw, 62px);
  letter-spacing: 2px;
  line-height: 1;
  color: var(--white);
  text-transform: uppercase;
  /* Engraved feel — inner shadow + outer glow */
  text-shadow:
    0 0 40px rgba(212,64,76,.4),
    0 0 12px rgba(212,64,76,.2),
    0 2px 12px rgba(0,0,0,.9),
    0 -1px 0 rgba(240,236,228,.08);
}

/* Thin rule with crimson centre spark */
.title-rule {
  display: flex;
  align-items: center;
  gap: 10px;
  width: clamp(180px, 55vw, 380px);
  margin: 8px auto 0;
}
.title-rule-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(240,236,228,.22), transparent);
}
.title-rule-gem {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #c03040;
  box-shadow: 0 0 10px rgba(192,48,64,.8), 0 0 22px rgba(192,48,64,.4);
  animation: gemPulse 3s ease-in-out infinite;
  flex-shrink: 0;
}
@keyframes gemPulse {
  0%,100% { box-shadow: 0 0 8px  rgba(192,48,64,.7), 0 0 20px rgba(192,48,64,.3); transform: scale(1);    }
  50%     { box-shadow: 0 0 16px rgba(192,48,64,1),  0 0 38px rgba(192,48,64,.5); transform: scale(1.3);  }
}

.title-sub {
  font-family: var(--font-jp);
  font-weight: 400;
  font-size: clamp(10px, 1.5vw, 12px);
  letter-spacing: 4px;
  color: rgba(240,236,228,.35);
  margin-top: 10px;
  font-style: italic;
}

/* ── Week badge — minimal, archival ── */
.week-badge {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  border: 1px solid rgba(240,236,228,.15);
  border-radius: 4px;
  padding: 6px 18px;
  margin: 14px 0 20px;
  background: rgba(240,236,228,.04);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  position: relative;
}
/* Corner ticks — manuscript-style */
.week-badge::before,
.week-badge::after {
  content: '';
  position: absolute;
  width: 7px; height: 7px;
  border-color: rgba(192,48,64,.6);
  border-style: solid;
}
.week-badge::before { top: -1px; left: -1px;  border-width: 1px 0 0 1px; }
.week-badge::after  { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }

.week-text {
  font-family: var(--font-head);
  font-weight: 600;
  font-size: clamp(12px, 2vw, 15px);
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--white);
}

/* ── Tile grid ── */
.deck-links {
  display: grid;
  grid-template-columns: repeat(2, var(--tile-w));
  gap: 1.05rem;
  padding: 2px 0 0;
}

a.deck {
  width: var(--tile-w);
  height: var(--tile-h);
  border-radius: var(--tile-r);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  overflow: visible;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  touch-action: pan-y manipulation;
  transition: transform .28s cubic-bezier(.34,1.28,.64,1);
  transform: translateZ(0);
  z-index: 1;
  cursor: pointer;
}
a.deck:hover { transform: translateY(-4px) scale(1.04); }

a.deck.c1 { --tile-bg:var(--c1-bg); --border-c:var(--c1-border); --halo:var(--c1-halo); --ring-a:var(--c1-ring-a); --ring-b:var(--c1-ring-b); --mote-c:var(--c1-mote); }
a.deck.c2 { --tile-bg:var(--c2-bg); --border-c:var(--c2-border); --halo:var(--c2-halo); --ring-a:var(--c2-ring-a); --ring-b:var(--c2-ring-b); --mote-c:var(--c2-mote); }
a.deck.c3 { --tile-bg:var(--c3-bg); --border-c:var(--c3-border); --halo:var(--c3-halo); --ring-a:var(--c3-ring-a); --ring-b:var(--c3-ring-b); --mote-c:var(--c3-mote); }
a.deck.c4 { --tile-bg:var(--c4-bg); --border-c:var(--c4-border); --halo:var(--c4-halo); --ring-a:var(--c4-ring-a); --ring-b:var(--c4-ring-b); --mote-c:var(--c4-mote); }

/* Slow conic ring — more restrained than Pre-Boo */
a.deck::before {
  content: "";
  position: absolute;
  inset: -4px;
  border-radius: calc(var(--tile-r) + 5px);
  background: conic-gradient(
    from var(--angle, 0deg),
    var(--ring-a) 0%, var(--ring-b) 25%,
    var(--ring-a) 50%, var(--ring-b) 75%,
    var(--ring-a) 100%
  );
  opacity: .35;
  z-index: -1;
  filter: blur(2.5px);
  animation: spinRing 12s linear infinite;
  pointer-events: none;
}

/* Halo — appears on hover only */
a.deck::after {
  content: "";
  position: absolute;
  inset: -48px;
  border-radius: 50%;
  z-index: -2;
  pointer-events: none;
  opacity: 0;
  transform: scale(.5) translateZ(0);
  transition: opacity .35s, transform .35s;
  background: radial-gradient(circle, var(--halo) 0%, transparent 65%);
}
a.deck:hover::after {
  opacity: .65;
  transform: scale(1) translateZ(0);
}

/* Tile face */
a.deck .clip {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  overflow: hidden;
  z-index: 2;
  border: 1.5px solid var(--border-c);
  box-shadow:
    0 18px 50px rgba(0,0,0,.75),
    0 0 0 1px rgba(255,255,255,.05) inset,
    0 1px 0 rgba(255,255,255,.1) inset;
}

a.deck .inner {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px 10px 14px;
  gap: 4px;
  background: var(--tile-bg);
  text-align: center;
}

/* Subtle top gloss — less glossy than Pre-Boo */
a.deck .inner::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 38%;
  border-radius: inherit;
  background: linear-gradient(180deg, rgba(255,255,255,.1) 0%, transparent 100%);
  pointer-events: none;
}

/* Slow shimmer on hover */
a.deck .inner::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(118deg, transparent 28%, rgba(255,255,255,.08) 50%, transparent 72%);
  background-size: 200% 200%;
  background-position: 160% 0;
  pointer-events: none;
  transition: background-position .6s ease;
}
a.deck:hover .inner::after { background-position: -60% 100%; }

/* ── Three-layer label (same structure as Pre-Boo) ── */
.tile-label-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

/* English — Grenze, authoritative */
.label-en {
  font-family: var(--font-head);
  font-weight: 700;
  font-size: clamp(16px, 2vw, 19px);
  letter-spacing: 1.5px;
  color: var(--white);
  text-shadow: 0 1px 10px rgba(0,0,0,.8), 0 0 14px rgba(0,0,0,.5);
  line-height: 1;
  text-transform: uppercase;
}

/* Hiragana reading — airy, thin */
.label-hira {
  font-family: var(--font-jp);
  font-weight: 400;
  font-size: clamp(9px, 1.05vw, 11px);
  color: rgba(240,236,228,.6);
  letter-spacing: 2.5px;
  line-height: 1;
}

/* Kanji — medium weight, warm parchment */
.label-kanji {
  font-family: var(--font-jp);
  font-weight: 700;
  font-size: clamp(11px, 1.4vw, 14px);
  color: rgba(240,236,228,.85);
  letter-spacing: 1px;
  line-height: 1;
  text-shadow: 0 1px 6px rgba(0,0,0,.6);
}

/* Sparkle layer */
a.deck .sparkles {
  position: absolute;
  inset: 0;
  z-index: 9;
  pointer-events: none;
  border-radius: inherit;
  overflow: hidden;
}
.mote {
  position: absolute;
  border-radius: 50%;
  opacity: 0;
  animation: moteFly var(--dur,.8s) ease-out forwards;
  background: radial-gradient(circle, var(--mote-c,#fff) 0%, transparent 68%);
}
@keyframes moteFly {
  0%   { opacity:0;  transform:translate(-50%,-50%) scale(.12); }
  12%  { opacity:1;  transform:translate(-50%,-50%) scale(1.3); }
  60%  { opacity:.85; }
  100% { opacity:0;  transform:translate(var(--tx,0), var(--ty,-48px)) scale(.2); }
}

/* ── Tap / Playing ── */
a.deck.tap { transform: scale(.92); transition: transform .1s ease; }

a.deck.playing {
  z-index: 999;
  animation:
    bloom      .45s cubic-bezier(.34,1.56,.64,1) forwards,
    beatBounce .42s ease-in-out .45s infinite;
}
a.deck.playing::after {
  opacity: 1;
  transform: scale(1.3) translateZ(0);
  animation: haloFlash .42s ease-in-out infinite;
}
a.deck.playing::before {
  opacity: .8;
  animation: spinRing .8s linear infinite;
}
a.deck.playing .inner { animation: innerFlash  .42s ease-in-out infinite; }
a.deck.playing .clip  { animation: borderFlash .21s ease-in-out infinite; }

@keyframes bloom {
  0%   { transform: scale(1); }
  55%  { transform: scale(1.16) translateY(-7px); }
  100% { transform: scale(1.09) translateY(-4px); }
}
@keyframes beatBounce {
  0%,100% { transform: scale(1.09) translateY(-4px); }
  40%     { transform: scale(1.16) translateY(-9px) rotate(1deg); }
  70%     { transform: scale(1.04) translateY(-2px) rotate(-.8deg); }
}
@keyframes innerFlash {
  0%,100% { filter: brightness(1)   saturate(1); }
  45%     { filter: brightness(1.6) saturate(1.4) contrast(1.1); }
}
@keyframes haloFlash {
  0%,100% { opacity:.45; transform: scale(1.0) translateZ(0); }
  45%     { opacity:.9;  transform: scale(1.55) translateZ(0); }
}
@keyframes borderFlash {
  0%,100% {
    box-shadow:
      0 18px 50px rgba(0,0,0,.75),
      0 0 0 1px rgba(255,255,255,.05) inset,
      0 1px 0 rgba(255,255,255,.1) inset;
  }
  50% {
    box-shadow:
      0 18px 50px rgba(0,0,0,.75),
      0 0 0 2px rgba(240,236,228,.45) inset,
      0 0 26px 6px var(--border-c);
  }
}

@keyframes spinRing { to { --angle: 360deg; } }
@keyframes fadeUp   { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }
@keyframes tileIn   { from{opacity:0;transform:translateY(24px) scale(.84);} to{opacity:1;transform:translateY(0) scale(1);} }

.deck-links a.deck              { animation: tileIn .72s cubic-bezier(.22,.8,.36,1) both; }
.deck-links a.deck:nth-child(1) { animation-delay: .24s; }
.deck-links a.deck:nth-child(2) { animation-delay: .36s; }
.deck-links a.deck:nth-child(3) { animation-delay: .48s; }
.deck-links a.deck:nth-child(4) { animation-delay: .60s; }

/* ── Close button — quieter than Pre-Boo ── */
#btn-close {
  position: fixed;
  top: 18px; right: 18px;
  z-index: 9999;
  width: 48px; height: 48px;
  border-radius: 4px;
  border: 1px solid rgba(240,236,228,.2);
  background: rgba(7,8,15,.65);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform .18s ease, border-color .18s, background .18s;
  animation: closePulse 4s ease-in-out infinite;
}
#btn-close:hover {
  transform: scale(1.12);
  border-color: rgba(212,64,76,.7);
  background: rgba(120,16,32,.35);
}
#btn-close:active { transform: scale(.9); }
#btn-close svg {
  width: 18px; height: 18px;
  stroke: var(--white); stroke-width: 2; stroke-linecap: round;
  filter: drop-shadow(0 0 5px rgba(212,64,76,.5));
}
@keyframes closePulse {
  0%,100% { box-shadow: 0 0 10px rgba(212,64,76,.1); }
  50%     { box-shadow: 0 0 18px rgba(212,64,76,.25); }
}

/* ── Responsive ── */
@media (prefers-reduced-motion: reduce) {
  .boo-icon, a.deck::before, a.deck.playing,
  .bg-glow, .boo-icon-wrap::before,
  .boo-icon-wrap::after { animation: none !important; }
  a.deck.playing .inner { animation: none !important; }
  .mote { animation: none !important; opacity: 0; }
}
@media (max-width: 390px) {
  :root { --tile-w: 142px; --tile-h: 142px; }
}
@media (orientation: landscape) and (max-height: 500px) {
  :root { --tile-w: 124px; --tile-h: 124px; }
  #welcome { padding: 10px 16px 10px; }
  .boo-icon { width: 36px; }
  .boo-icon-wrap { margin-bottom: 8px; }
  .title-en { font-size: clamp(20px, 4vw, 30px); }
  .week-badge { margin: 6px 0 10px; }
  .deck-links { grid-template-columns: repeat(4, var(--tile-w)); gap: .75rem; }
}
</style>
</head>

<body>
<div id="app">

<div class="bg-glow g1" aria-hidden="true"></div>
<div class="bg-glow g2" aria-hidden="true"></div>
<div class="bg-glow g3" aria-hidden="true"></div>

<canvas id="bg-canvas" aria-hidden="true"></canvas>

<button id="btn-close" aria-label="Back to hub">
  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <line x1="5" y1="5" x2="19" y2="19"/>
    <line x1="19" y1="5" x2="5" y2="19"/>
  </svg>
</button>

<section id="welcome">

  <div class="boo-icon-wrap">
    <img class="boo-icon" src="../../assets/img/boo-tree.png" alt="Boo-Continuum" onerror="this.style.display='none'">
  </div>

  <div class="title-group">
    <h1 class="title-en">Boo&#8209;Continuum</h1>
    <div class="title-rule" aria-hidden="true">
      <span class="title-rule-line"></span>
      <span class="title-rule-gem"></span>
      <span class="title-rule-line"></span>
    </div>
    <p class="title-sub">スタディデッキ&nbsp;·Study Decks</p>
  </div>

  <div class="week-badge">
    <span class="week-text" id="week-label">Loading…</span>
  </div>

  <div class="deck-links">

    <a id="vocab" class="deck c1" href="#">
      <div class="clip">
        <div class="inner">
          <div class="tile-label-wrap">
            <span class="label-en">Vocab</span>
            <span class="label-hira">ごい</span>
            <span class="label-kanji">語彙</span>
          </div>
        </div>
        <div class="sparkles" aria-hidden="true"></div>
      </div>
    </a>

    <a id="sentences" class="deck c2" href="#">
      <div class="clip">
        <div class="inner">
          <div class="tile-label-wrap">
            <span class="label-en">Sentences</span>
            <span class="label-hira">ぶん</span>
            <span class="label-kanji">文</span>
          </div>
        </div>
        <div class="sparkles" aria-hidden="true"></div>
      </div>
    </a>

<!-- ── Background particles — ember-like, slow ── -->
<script>
(function () {
  const canvas = document.getElementById('bg-canvas');
  const ctx    = canvas.getContext('2d');
  /* Jewel tones from the tile palette — no pastels */
  const COLORS = [
    '#c03040','#e89090','#d4404c',      /* crimson */
    '#c08820','#e8cc80','#d4a040',      /* amber */
    '#6644b8','#b8a0e8','#8868cc',      /* violet */
    '#2080a8','#80c4d8','#3898b8',      /* teal */
    'rgba(240,236,228,.7)'              /* parchment white */
  ];
  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);
  const PARTS = [];
  function makePart(scatter) {
    return {
      x:     Math.random() * (canvas.width  || 400),
      y:     scatter ? Math.random() * (canvas.height || 700) : (canvas.height || 700) + 12,
      r:     .4 + Math.random() * 1.6,      /* smaller, ember-like */
      vx:    (Math.random() - .5) * .15,    /* slower drift */
      vy:    -.03 - Math.random() * .12,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      alpha: .06 + Math.random() * .18,     /* dimmer */
      life:  scatter ? Math.random() : 0,
    };
  }
  for (let i = 0; i < 55; i++) PARTS.push(makePart(true));
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < PARTS.length; i++) {
      const p = PARTS[i];
      p.x += p.vx; p.y += p.vy; p.life += .0025;
      if (p.y < -12 || p.life > 1) { PARTS[i] = makePart(false); continue; }
      const a = p.alpha * Math.sin(p.life * Math.PI);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = a;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>

<!-- ── Tile interaction ── -->
<script>
let lockedUI = false;
let moteInterval = null;

function resetUI() {
  lockedUI = false;
  if (moteInterval) { clearInterval(moteInterval); moteInterval = null; }
  document.querySelectorAll('a.deck').forEach(el => {
    el.classList.remove('playing', 'tap');
    el.style.pointerEvents = '';
  });
}

window.addEventListener('pageshow', ev => {
  if (ev.persisted || sessionStorage.getItem('booha_deck_open')) {
    resetUI();
    sessionStorage.removeItem('booha_deck_open');
  }
});
if (sessionStorage.getItem('booha_deck_open')) {
  resetUI();
  sessionStorage.removeItem('booha_deck_open');
}

function burstMotes(anchor, count) {
  const box = anchor.querySelector('.sparkles');
  if (!box) return;
  for (let i = 0; i < (count || 14); i++) {
    const m = document.createElement('div');
    m.className = 'mote';
    const sz  = 3 + Math.random() * 10;
    const x   = 8  + Math.random() * 84;
    const y   = 8  + Math.random() * 84;
    const tx  = (Math.random() - .5) * 80 + 'px';
    const ty  = -(16 + Math.random() * 56) + 'px';
    const dur = (.38 + Math.random() * .55) + 's';
    m.style.cssText =
      'width:'+sz+'px;height:'+sz+'px;left:'+x+'%;top:'+y+'%;' +
      '--tx:'+tx+';--ty:'+ty+';--dur:'+dur+';' +
      'animation-delay:'+(Math.random()*.1).toFixed(3)+'s';
    box.appendChild(m);
  }
  setTimeout(() => { box.innerHTML = ''; }, 980);
}

function startMusicShow(anchor) {
  moteInterval = setInterval(() => {
    if (!anchor.classList.contains('playing')) {
      clearInterval(moteInterval); moteInterval = null; return;
    }
    burstMotes(anchor, 8);
  }, 230);
  burstMotes(anchor, 18);
}

function goToDeck(anchor) {
  if (lockedUI) return;
  lockedUI = true;
  const url = anchor.getAttribute('href');
  if (!url || url === '#') { lockedUI = false; return; }
  anchor.classList.add('tap');
  setTimeout(() => anchor.classList.remove('tap'), 120);
  document.querySelectorAll('a.deck').forEach(el => {
    if (el !== anchor) el.style.pointerEvents = 'none';
  });
  anchor.classList.add('playing');
  startMusicShow(anchor);
  sessionStorage.setItem('booha_deck_open', '1');
  setTimeout(() => { window.location.href = url; }, 1000);
}

document.querySelectorAll('a.deck').forEach(a => {
  a.addEventListener('click', e => { e.preventDefault(); goToDeck(a); }, { passive: false });
});
</script>
